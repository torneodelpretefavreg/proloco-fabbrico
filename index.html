<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pro Loco Fabbrico · Attività</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6fb0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pro Loco">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<style>
  :root{
    --bg:#f7f6f2; --panel:#ffffff; --panel-2:#fbfaf6; --ink:#1a1a1a; --ink-2:#4a4a4a; --ink-3:#8a8a82;
    --rule:#e8e6df; --rule-2:#d8d5cc;
    --brand:#1f6fb0; --brand-dark:#165689; --brand-soft:#eaf2f9; --brand-soft-2:#d6e6f4;
    --ok:#2d5e3e; --ok-soft:#e8efe9; --danger:#b54343; --danger-soft:#fbecec; --warn:#a46a12; --warn-soft:#fdf3dd;
    --shadow:0 4px 16px rgba(20,20,20,.06),0 0 0 1px rgba(20,20,20,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  .serif{font-family:'Fraunces',Georgia,serif}
  .pl-center{height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}

  /* ---------- login ---------- */
  .pl-login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(900px 500px at 75% -10%,var(--brand-soft-2) 0%,transparent 60%),radial-gradient(700px 400px at 0% 110%,#f4ebd7 0%,transparent 55%),var(--bg)}
  .pl-card{width:min(410px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:34px 30px;box-shadow:0 20px 50px rgba(20,20,20,.10)}
  .pl-card h1{font-family:'Fraunces',serif;font-weight:500;font-size:25px;letter-spacing:-.01em}
  .pl-card .lead{color:var(--ink-3);font-size:13px;margin:4px 0 22px;font-style:italic}
  .pl-card .logo{width:52px;height:52px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:'Fraunces',serif;font-size:26px;margin-bottom:16px}
  .pl-err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}
  .pl-okmsg{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}
  .pl-link{background:none;border:none;color:var(--brand);font-weight:600;font-size:13px;padding:0}

  /* ---------- struttura ---------- */
  .pl-shell{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .pl-demo{background:var(--warn-soft);color:var(--warn);font-size:12px;text-align:center;padding:5px 10px;border-bottom:1px solid #eedcb4;flex-shrink:0}
  .pl-top{flex-shrink:0;background:var(--brand);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--brand-dark)}
  .pl-brand{display:flex;align-items:center;gap:11px;min-width:0}
  .pl-logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-family:'Fraunces',serif;font-size:20px;flex-shrink:0}
  .pl-title{font-family:'Fraunces',serif;font-size:17px;font-weight:500;line-height:1.1;white-space:nowrap}
  .pl-sub{font-size:11.5px;color:rgba(255,255,255,.72);font-style:italic;white-space:nowrap}
  .pl-tabs{display:flex;gap:3px;background:rgba(0,0,0,.14);border-radius:9px;padding:3px;margin-left:8px}
  .pl-tabs button{display:flex;align-items:center;gap:6px;border:none;background:none;color:rgba(255,255,255,.82);padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500}
  .pl-tabs button:hover{background:rgba(255,255,255,.1)}
  .pl-tabs button.on{background:#fff;color:var(--brand-dark)}
  .pl-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .pl-top .pl-iconbtn{background:transparent;border:1px solid rgba(255,255,255,.32);color:#fff;width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
  .pl-top .pl-iconbtn:hover{background:rgba(255,255,255,.14)}
  .pl-top .pl-newbtn{background:#fff;color:var(--brand-dark);border:none;border-radius:8px;padding:8px 13px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
  .pl-me{background:none;border:none;padding:0;display:flex}
  .pl-main{flex:1;min-height:0;overflow-y:auto;padding:18px 22px 26px;display:flex;flex-direction:column}
  .pl-bottom{display:none}

  /* ---------- elementi comuni ---------- */
  .pl-btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:500;border:1px solid var(--brand);background:var(--brand);color:#fff;transition:.12s;white-space:nowrap}
  .pl-btn:hover{background:var(--brand-dark)}
  .pl-btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--rule-2)}
  .pl-btn.ghost:hover{background:var(--bg)}
  .pl-btn.danger{background:var(--panel);color:var(--danger);border-color:var(--rule-2)}
  .pl-btn.danger:hover{background:var(--danger-soft)}
  .pl-btn.sm{padding:5px 10px;font-size:12px}
  .pl-btn.block{width:100%;justify-content:center;padding:11px}
  .pl-btn:disabled{opacity:.5;cursor:not-allowed}
  .pl-icon{border:1px solid var(--rule);background:var(--panel);border-radius:7px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
  .pl-icon:hover{background:var(--bg)}
  .pl-icon.danger{color:var(--danger)}
  .pl-input,.pl-select,.pl-area{width:100%;border:1px solid var(--rule-2);background:var(--panel);border-radius:7px;padding:8px 10px;outline:none}
  .pl-input:focus,.pl-select:focus,.pl-area:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .pl-area{resize:vertical;min-height:80px;line-height:1.5}
  .pl-lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:14px 0 6px}
  .pl-row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .pl-row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
  .pl-chips{display:flex;flex-wrap:wrap;gap:6px}
  .pl-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink-2)}
  .pl-chip:hover{background:var(--bg)}
  .pl-chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .pl-chip .dot{width:9px;height:9px;border-radius:50%}
  .pl-seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden;background:var(--panel)}
  .pl-seg button{border:none;background:none;padding:6px 12px;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
  .pl-seg button+button{border-left:1px solid var(--rule)}
  .pl-seg button.on{background:var(--brand);color:#fff}
  .pl-nav{display:inline-flex;align-items:center;gap:4px}
  .pl-nav button{border:1px solid var(--rule-2);background:var(--panel);height:32px;min-width:32px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2);font-size:12.5px;font-weight:500}
  .pl-nav button:hover{background:var(--bg)}
  .pl-nav .oggi{padding:0 12px}
  .pl-av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex-shrink:0;border:2px solid #fff;letter-spacing:-.02em}
  .pl-avs{display:inline-flex}
  .pl-avs .pl-av+.pl-av{margin-left:-7px}
  .pl-av.more{background:var(--ink-3)}
  .pl-panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px}
  .pl-empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-style:italic}
  .pl-hint{font-size:12.5px;color:var(--ink-3);line-height:1.5}
  .pl-pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}
  .st-da_fare{background:#f0eee8;color:#6b675e}
  .st-in_corso{background:var(--brand-soft);color:var(--brand-dark)}
  .st-fatto{background:var(--ok-soft);color:var(--ok)}
  .st-ritardo{background:var(--danger-soft);color:var(--danger)}
  .pr-alta{background:#f7e0d8;color:#b4462f}.pr-media{background:var(--warn-soft);color:var(--warn)}.pr-bassa{background:#eef4e8;color:#5e7e52}
  .pl-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--rule-2);background:#fff;display:grid;place-items:center;flex-shrink:0;padding:0}
  .pl-check.on{background:var(--ok);border-color:var(--ok)}
  .pl-toggle{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--rule-2);border-radius:8px;padding:9px 12px;cursor:pointer;margin-top:6px;user-select:none}
  .pl-toggle .sw{width:38px;height:22px;border-radius:12px;background:var(--rule-2);position:relative;transition:.15s;flex-shrink:0}
  .pl-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .pl-toggle.on .sw{background:var(--brand)}
  .pl-toggle.on .sw::after{transform:translateX(16px)}
  .pl-swatches{display:flex;flex-wrap:wrap;gap:7px}
  .pl-sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;display:grid;place-items:center}
  .pl-sw.on{border-color:var(--ink)}
  .pl-toast{position:fixed;bottom:22px;right:22px;background:var(--brand);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 10px 30px rgba(20,20,20,.2);z-index:300;max-width:420px}
  .pl-toast.error{background:var(--danger)}

  /* ---------- filtri ---------- */
  .pl-filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
  .pl-filters .pl-select{width:auto;padding:6px 9px;font-size:12.5px}
  .pl-search{position:relative;flex:0 1 220px}
  .pl-search input{padding-left:30px;font-size:12.5px;padding-top:6px;padding-bottom:6px}
  .pl-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3)}

  /* ---------- KPI ---------- */
  .pl-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .pl-kpi{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:11px 14px;text-align:left;border-left:3px solid var(--rule-2)}
  .pl-kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
  .pl-kpi .v{font-family:'Fraunces',serif;font-size:24px;line-height:1.15;margin-top:2px}
  .pl-kpi.blue{border-left-color:var(--brand)}.pl-kpi.blue .v{color:var(--brand-dark)}
  .pl-kpi.red{border-left-color:var(--danger)}.pl-kpi.red .v{color:var(--danger)}
  .pl-kpi.green{border-left-color:var(--ok)}.pl-kpi.green .v{color:var(--ok)}
  .pl-kpi.clic{cursor:pointer}.pl-kpi.clic:hover{background:var(--panel-2)}

  /* ---------- GANTT ---------- */
  .pg-bar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .pg-periodo{font-family:'Fraunces',serif;font-size:16px}
  .pg-scroll{flex:1;min-height:380px;overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:10px;position:relative}
  .pg-head{position:sticky;top:0;z-index:20;display:flex;background:var(--panel);border-bottom:1px solid var(--rule-2)}
  .pg-head-lbl{position:sticky;left:0;z-index:22;background:var(--panel-2);border-right:1px solid var(--rule);display:flex;align-items:flex-end;padding:0 12px 7px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);flex-shrink:0}
  .pg-head-track{flex-shrink:0}
  .pg-mrow,.pg-drow{display:flex;height:22px}
  .pg-m{flex-shrink:0;font-size:11px;font-weight:600;padding:4px 6px;border-left:1px solid var(--rule);white-space:nowrap;overflow:hidden;color:var(--ink-2);text-transform:capitalize}
  .pg-d{flex-shrink:0;font-size:10px;text-align:center;color:var(--ink-3);padding-top:4px;overflow:hidden;white-space:nowrap}
  .pg-d.we{color:#b3afa4}
  .pg-d.oggi{color:#fff;font-weight:700}
  .pg-d.oggi span{background:var(--brand);border-radius:4px;padding:1px 4px}
  .pg-body{position:relative}
  .pg-bg{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
  .pg-we{position:absolute;top:0;bottom:0;background:#f8f6f0}
  .pg-msep{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule)}
  .pg-now{position:absolute;top:0;bottom:0;width:2px;background:var(--brand);opacity:.8}
  .pg-row{display:flex;position:relative;border-bottom:1px solid #f1efe9;height:44px}
  .pg-row:hover .pg-lbl{background:var(--brand-soft)}
  .pg-lbl{position:sticky;left:0;z-index:12;background:var(--panel);border-right:1px solid var(--rule);display:flex;align-items:center;gap:8px;padding:0 10px;flex-shrink:0;min-width:0}
  .pg-lbl-main{flex:1;min-width:0;cursor:pointer}
  .pg-lbl-t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pg-lbl-t.done{text-decoration:line-through;color:var(--ink-3)}
  .pg-lbl-s{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
  .pg-lbl-s .late{color:var(--danger);font-weight:600}
  .pg-track{position:relative;flex-shrink:0;z-index:1}
  .pg-grp{height:36px;border-bottom:1px solid var(--rule)}
  .pg-grp .pg-lbl{background:var(--panel-2);gap:8px}
  .pg-grp .pg-track{background:rgba(251,250,246,.6)}
  .pg-grp-dot{width:11px;height:11px;border-radius:4px;flex-shrink:0}
  .pg-grp-n{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;cursor:pointer}
  .pg-grp-c{font-size:11px;color:var(--ink-3);background:#efede6;border-radius:999px;padding:1px 8px}
  .pg-stbtn{width:22px;height:22px;border-radius:50%;border:none;display:grid;place-items:center;flex-shrink:0;padding:0}
  .pg-bar{position:absolute;top:9px;height:26px;border-radius:6px;display:flex;align-items:center;overflow:hidden;cursor:pointer;border:1px solid transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y;box-shadow:0 1px 2px rgba(20,20,20,.08)}
  .pg-bar:hover{box-shadow:0 3px 10px rgba(20,20,20,.16);z-index:3}
  .pg-bar.drag{box-shadow:0 6px 18px rgba(20,20,20,.25);z-index:5;opacity:.92}
  .pg-bar.late{outline:2px solid var(--danger);outline-offset:1px}
  .pg-bar.done{opacity:.5}
  .pg-bar-prog{position:absolute;left:0;top:0;bottom:0;pointer-events:none}
  .pg-bar-t{position:relative;font-size:11.5px;font-weight:600;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .pg-bar.cl-l{border-top-left-radius:0;border-bottom-left-radius:0}
  .pg-bar.cl-r{border-top-right-radius:0;border-bottom-right-radius:0}
  .pg-handle{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}
  .pg-handle.l{left:0}.pg-handle.r{right:0}
  .pg-handle:hover{background:rgba(0,0,0,.12)}
  .pg-out{position:absolute;top:13px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;pointer-events:none}
  .pg-ms{position:absolute;top:13px;width:18px;height:18px;transform:rotate(45deg);border-radius:3px;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .pg-tip{position:fixed;z-index:200;background:var(--ink);color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;pointer-events:none;white-space:nowrap}
  .pg-dragtip{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:210;background:var(--brand-dark);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(20,20,20,.25);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .pg-grp-float{position:sticky;left:8px;display:inline-block;margin-top:9px;font-size:12px;font-weight:700;white-space:nowrap;padding-left:8px}
  .pg-fuori{font-size:12px;color:var(--ink-3);margin-top:8px}

  /* ---------- CALENDARIO ---------- */
  .pc-mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--rule)}
  .pc-mhead div{padding:8px 6px;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
  .pc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(108px,auto)}
  .pc-cell{border-left:1px solid #f0eee8;border-bottom:1px solid #f0eee8;padding:5px;cursor:copy;display:flex;flex-direction:column;gap:3px;min-width:0}
  .pc-cell:nth-child(7n+1){border-left:none}
  .pc-cell.out{background:#fbfaf6}
  .pc-cell.we{background:#fcfbf8}
  .pc-day{font-size:12px;font-weight:600;color:var(--ink-3);align-self:flex-end;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
  .pc-cell.out .pc-day{color:#cbc7bc}
  .pc-cell.oggi .pc-day{background:var(--brand);color:#fff}
  .pc-pill{display:flex;align-items:center;gap:5px;border:none;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:600;text-align:left;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:3px solid}
  .pc-pill.cont{opacity:.7;font-weight:500}
  .pc-pill.done{text-decoration:line-through;opacity:.5}
  .pc-more{font-size:10.5px;color:var(--ink-3);padding-left:4px}
  .pc-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .pc-wcol{border-left:1px solid var(--rule);min-height:360px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;cursor:copy}
  .pc-wcol:first-child{border-left:none}
  .pc-wcol.oggi{background:var(--brand-soft)}
  .pc-whead{text-align:center;padding-bottom:6px;border-bottom:1px solid var(--rule);margin-bottom:2px}
  .pc-whead .wd{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700}
  .pc-whead .dn{font-family:'Fraunces',serif;font-size:20px}
  .pc-card{border:none;text-align:left;border-radius:7px;padding:6px 8px;border-left:3px solid;font-size:12px;display:flex;flex-direction:column;gap:2px;width:100%}
  .pc-card .t{font-weight:600;line-height:1.25}
  .pc-card .s{font-size:10.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pc-list-day{display:flex;gap:14px;padding:12px 14px;border-bottom:1px solid var(--rule)}
  .pc-list-date{width:62px;flex-shrink:0;text-align:center}

const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (k) => { const [y, m, d] = String(k || "").split("-").map(Number); return new Date(y || 2000, (m || 1) - 1, d || 1); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const startOfWeek = (d) => { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
const oggiKey = () => toKey(new Date());
const wd = (d) => (d.getDay() + 6) % 7;
const fmtData = (k) => { if (!k) return ""; const d = fromKey(k); return `${d.getDate()} ${MESI[d.getMonth()].slice(0, 3)}`; };
const fmtDataLunga = (k) => { if (!k) return ""; const d = fromKey(k); return `${GIORNI[wd(d)]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; };
const fmtPeriodo = (a) => (!a.fine || a.fine === a.inizio) ? fmtData(a.inizio) : `${fmtData(a.inizio)} – ${fmtData(a.fine)}`;
const hexA = (hex, a) => { const h = String(hex || "#888888").replace("#", ""); return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`; };
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pulisci = (o) => JSON.parse(JSON.stringify(o));
const iniziali = (n) => String(n || "?").trim().split(/\s+/).map(x => x[0] || "").slice(0, 2).join("").toUpperCase() || "?";
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

function useMedia(q) {
  const [m, setM] = useState(() => window.matchMedia(q).matches);
  useEffect(() => {
    const mq = window.matchMedia(q); const f = () => setM(mq.matches); f();
    if (mq.addEventListener) mq.addEventListener("change", f); else mq.addListener(f);
    return () => { if (mq.removeEventListener) mq.removeEventListener("change", f); else mq.removeListener(f); };
  }, [q]);
  return m;
}

function creaArchivioLocale() {
  const KEY = "plf-prova-dati";
  let data = null;
  try { data = JSON.parse(lsGet(KEY) || "null"); } catch (e) {}
  if (!data) data = seedDemo();
  const ascolti = {};
  const lista = (c) => Object.entries(data[c] || {}).map(([id, v]) => ({ id, ...v }));
  const salva = () => lsSet(KEY, JSON.stringify(data));
  const avvisa = (c) => (ascolti[c] || []).forEach(cb => cb(lista(c)));
  return {
    subscribe(c, cb) { (ascolti[c] = ascolti[c] || []).push(cb); setTimeout(() => cb(lista(c)), 0); return () => { ascolti[c] = ascolti[c].filter(x => x !== cb); }; },
    watchDoc(c, id, cb) { const f = (l) => cb(l.find(x => x.id === id) || null); return this.subscribe(c, f); },
    async add(c, v) { const id = nid(); data[c] = data[c] || {}; data[c][id] = pulisci(v); salva(); avvisa(c); return id; },
    async set(c, id, v) { data[c] = data[c] || {}; data[c][id] = pulisci(v); salva(); avvisa(c); },
    async update(c, id, p) { data[c] = data[c] || {}; data[c][id] = { ...(data[c][id] || {}), ...pulisci(p) }; salva(); avvisa(c); },
    async del(c, id) { if (data[c]) delete data[c][id]; salva(); avvisa(c); },
    async getDoc(c, id) { return data[c] && data[c][id] ? { id, ...data[c][id] } : null; },
    azzera() { lsDel(KEY); location.reload(); },
  };
}

function creaArchivioFirestore() {
  return {
    subscribe(c, cb, onErr) {
      return db.collection(c).onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => { console.warn(c, e); cb([]); onErr && onErr(e); });
    },
    watchDoc(c, id, cb) { return db.collection(c).doc(id).onSnapshot(s => cb(s.exists ? { id: s.id, ...s.data() } : null), () => cb(null)); },
    async add(c, v) { const r = await db.collection(c).add(pulisci(v)); return r.id; },
    set: (c, id, v) => db.collection(c).doc(id).set(pulisci(v)),
    update: (c, id, p) => db.collection(c).doc(id).set(pulisci(p), { merge: true }),
    del: (c, id) => db.collection(c).doc(id).delete(),
    async getDoc(c, id) { const s = await db.collection(c).doc(id).get(); return s.exists ? { id: s.id, ...s.data() } : null; },
  };
}
const store = CONFIGURATO ? creaArchivioFirestore() : creaArchivioLocale();

function useCollection(nome) {
  const [rows, setRows] = useState(null);

   NOTIFICHE PUSH (lato dispositivo)
   ===================================================================== */
const LS_TOKEN = "plf-push-token";
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
function nomeDispositivo() {
  const u = navigator.userAgent;
  const os = /iphone/i.test(u) ? "iPhone" : /ipad/i.test(u) ? "iPad" : /android/i.test(u) ? "Android" : /mac/i.test(u) ? "Mac" : /windows/i.test(u) ? "Windows" : "Dispositivo";
  const br = /edg\//i.test(u) ? "Edge" : /firefox|fxios/i.test(u) ? "Firefox" : /crios|chrome/i.test(u) ? "Chrome" : /safari/i.test(u) ? "Safari" : "";
  return isStandalone() ? `${os} · app` : `${os}${br ? " · " + br : ""}`;
}
let swPromise = null;
function getSw() {
  if (!CONFIGURATO || !("serviceWorker" in navigator)) return Promise.resolve(null);
  if (!swPromise) swPromise = navigator.serviceWorker.register("./sw.js?cfg=" + encodeURIComponent(JSON.stringify(firebaseConfig)))
    .then(() => navigator.serviceWorker.ready).catch(e => { console.warn("SW", e); swPromise = null; return null; });
  return swPromise;
}
let messagingInst = null;
async function getMessaging() {
  if (messagingInst) return messagingInst;
  try {
    if (!CONFIGURATO || !firebase.messaging) return null;
    if (!(await Promise.resolve(firebase.messaging.isSupported()))) return null;
    messagingInst = firebase.messaging(); return messagingInst;
  } catch (e) { return null; }
}
async function registraDispositivo(uid, vapidKey) {
  const reg = await getSw(); if (!reg) throw new Error("Questo browser non supporta le notifiche dell'app.");
  const m = await getMessaging(); if (!m) throw new Error("Su questo browser le notifiche push non sono supportate.");
  const token = await m.getToken({ vapidKey, serviceWorkerRegistration: reg });
  if (!token) throw new Error("Firebase non ha restituito il codice del dispositivo.");
  await db.collection("pushTokens").doc(token.replace(/\//g, "_")).set({ uid, token, device: nomeDispositivo(), aggiornatoIl: Date.now() }, { merge: true });
  const vecchio = lsGet(LS_TOKEN);
  if (vecchio && vecchio !== token) db.collection("pushTokens").doc(vecchio.replace(/\//g, "_")).delete().catch(() => {});
  lsSet(LS_TOKEN, token);
  return token;
}
getSw();

function Toggle({ on, onChange, children }) {

function App() {
  const [s, setS] = useState({ fase: "carico" });
  useEffect(() => {
    if (DEMO) { setS({ fase: "ok", uid: "demo-admin" }); return; }
    return auth.onAuthStateChanged(async (u) => {
      if (!u) { setS({ fase: "login" }); return; }
      try {
        let p = await store.getDoc("utenti", u.uid);
        const mail = (u.email || "").toLowerCase();
        if (!p && ADMIN_EMAILS.map(x => x.toLowerCase()).includes(mail)) {
          const nuovo = { nome: mail.split("@")[0], email: mail, ruolo: "admin", incarico: "Presidente", colore: PALETTE[0], attivo: true, creatoIl: ora() };
          await store.set("utenti", u.uid, nuovo); p = { id: u.uid, ...nuovo };
        }
        if (!p) { setS({ fase: "bloccato", motivo: "Questo account non è ancora abilitato. Chiedi all'amministratore della Pro Loco di aggiungerti." }); return; }
        if (p.attivo === false) { setS({ fase: "bloccato", motivo: "Il tuo account è stato disattivato. Contatta l'amministratore." }); return; }
        setS({ fase: "ok", uid: u.uid });
      } catch (e) {
        setS({ fase: "bloccato", motivo: "Non riesco a leggere il tuo profilo (" + (e.code || e.message) + "). Controlla le regole di Firestore." });
      }
    });
  }, []);
  if (s.fase === "carico") return <div className="pl-center">Carico…</div>;
  if (s.fase === "login") return <Login />;
  if (s.fase === "bloccato") return (
    <div className="pl-login"><div className="pl-card">
      <div className="logo">P</div><h1>{ENTE}</h1>
      <p className="lead">Accesso non disponibile</p>
      <div className="pl-err">{s.motivo}</div>
      <button className="pl-btn ghost block" onClick={() => auth.signOut()}>Esci</button>
    </div></div>
  );
  return <Shell uid={s.uid} />;
}

function Login() {
  const [modo, setModo] = useState("entra"); // entra | primo | reset
  const [email, setEmail] = useState(""), [pw, setPw] = useState(""), [err, setErr] = useState(""), [msg, setMsg] = useState(""), [busy, setBusy] = useState(false);
  const errori = { "auth/invalid-credential": "Email o password non corretti.", "auth/invalid-email": "Email non valida.", "auth/weak-password": "La password deve avere almeno 6 caratteri.", "auth/email-already-in-use": "Account già esistente: usa Entra.", "auth/wrong-password": "Password errata.", "auth/user-not-found": "Nessun account con questa email.", "auth/too-many-requests": "Troppi tentativi. Riprova tra qualche minuto." };
  const invia = async () => {
    setErr(""); setMsg(""); setBusy(true);
    try {
      const mail = email.trim();
      if (modo === "entra") await auth.signInWithEmailAndPassword(mail, pw);
      else if (modo === "reset") { await auth.sendPasswordResetEmail(mail); setMsg("Ti abbiamo mandato un'email per impostare una nuova password."); }
      else {
        if (!ADMIN_EMAILS.map(x => x.toLowerCase()).includes(mail.toLowerCase())) throw { code: "x", message: "Questa email non è quella dell'amministratore. Gli altri membri ricevono l'accesso dall'amministratore." };
        await auth.createUserWithEmailAndPassword(mail, pw);
      }
    } catch (e) { setErr(errori[e.code] || e.message || String(e)); }
    finally { setBusy(false); }
  };
  const key = (e) => e.key === "Enter" && invia();
  return (
    <div className="pl-login"><div className="pl-card">
      <div className="logo">P</div><h1>{ENTE}</h1>
      <p className="lead">{modo === "entra" ? "Attività, calendario e responsabili" : modo === "reset" ? "Recupero password" : "Primo accesso dell'amministratore"}</p>
      {err && <div className="pl-err">{err}</div>}
      {msg && <div className="pl-okmsg">{msg}</div>}
      <label className="pl-lbl">Email</label>
      <input className="pl-input" type="email" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={key} autoComplete="email" />
      {modo !== "reset" && <><label className="pl-lbl">Password</label>
        <input className="pl-input" type="password" value={pw} onChange={e => setPw(e.target.value)} onKeyDown={key} autoComplete={modo === "entra" ? "current-password" : "new-password"} /></>}
      <button className="pl-btn block" style={{ marginTop: 18 }} disabled={busy || !email || (modo !== "reset" && !pw)} onClick={invia}>
        {busy ? "Attendi…" : modo === "entra" ? "Entra" : modo === "reset" ? "Mandami l'email" : "Crea account amministratore"}
      </button>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 16, gap: 10, flexWrap: "wrap" }}>
        {modo === "entra"
          ? <><button className="pl-link" onClick={() => { setModo("reset"); setErr(""); }}>Password dimenticata?</button>
              <button className="pl-link" onClick={() => { setModo("primo"); setErr(""); }}>Primo accesso amministratore</button></>
          : <button className="pl-link" onClick={() => { setModo("entra"); setErr(""); setMsg(""); }}>← Torna all'accesso</button>}
      </div>
    </div></div>
  );
}
