/* ═══════════ modale sezione ═══════════ */
function SectionModal({sezione, onSave, onDelete, onClose, count, radici, parentIniziale, figlieDi}){
  const [nome,setNome] = useState(sezione?sezione.nome:'');
  const [descrizione,setDescrizione] = useState(sezione?sezione.descrizione||'':'');
  const [colore,setColore] = useState(sezione?sezione.colore:COLORS[0]);
  const [parentId,setParentId] = useState(sezione ? (sezione.parentId||'') : (parentIniziale||''));
  const nuovo = !sezione;
  const haFiglie = sezione ? figlieDi(sezione.id).length > 0 : false;
  const possibili = (radici||[]).filter(r=>!sezione || r.id !== sezione.id);
  return (
    <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="modal">
        <h3>{nuovo?'Nuova sezione':'Modifica sezione'}</h3>
        <div className="f">
          <label>Nome</label>
          <input autoFocus value={nome} onChange={e=>setNome(e.target.value)} placeholder="Es. Sagra d'autunno, Comunicazione, Direttivo"
            onKeyDown={e=>{if(e.key==='Enter'&&nome.trim()) onSave({nome:nome.trim(),descrizione,colore,parentId:parentId||null});}}/>
        </div>
        <div className="f">
          <label>Descrizione</label>
          <input value={descrizione} onChange={e=>setDescrizione(e.target.value)} placeholder="A cosa serve questa sezione"/>
        </div>
        <div className="f">
          <label>Dentro</label>
          <select value={parentId} onChange={e=>setParentId(e.target.value)} disabled={haFiglie}>
            <option value="">— Sezione principale —</option>
            {possibili.map(r=><option key={r.id} value={r.id}>{r.nome}</option>)}
          </select>
          {haFiglie && <div className="spazio-sub" style={{marginTop:4}}>
            Questa sezione contiene delle sottosezioni, quindi resta principale.
          </div>}
        </div>
        <div className="f">
          <label>Colore</label>
          <div className="swatches">
            {COLORS.map(c=>(
              <button key={c} className={'sw'+(c===colore?' on':'')} style={{background:c}} onClick={()=>setColore(c)}/>
            ))}
          </div>
        </div>
        <div className="modal-foot">
          {!nuovo && <button className="btn danger" style={{marginRight:'auto'}}
            onClick={()=>{
              const extra = haFiglie ? ' Con lei vanno nel cestino anche le sottosezioni.' : '';
              if(confirm(`Eliminare "${sezione.nome}"? Finisce nel cestino con i suoi ${count} documenti e si recupera per 30 giorni.${extra}`)) onDelete();
            }}>Elimina</button>}
          <button className="btn" onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={!nome.trim()}
            onClick={()=>onSave({nome:nome.trim(),descrizione,colore,parentId:parentId||null})}>Salva</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════ nuovo documento ═══════════ */
function NewDocModal({onCreate, onClose}){
  const [tipo,setTipo] = useState('piano');
  const [tpl,setTpl] = useState('vuoto');
  const [titolo,setTitolo] = useState('');
  const [dataRif,setDataRif] = useState('');
  const modelli = tipo==='riunione' ? TEMPLATES : tipo==='piano' ? MODELLI_PIANO : tipo==='foglio' ? MODELLI_FOGLIO : null;
  const cambiaTipo = (t) => { setTipo(t); setTpl('vuoto'); };
  const crea = () => {
    if(tipo==='piano' && tpl!=='vuoto' && !dataRif){ alert('Scegli la data di riferimento: le uscite del modello vengono messe in calendario a partire da lì.'); return; }
    onCreate(tipo, modelli ? tpl : null, titolo.trim(), dataRif);
  };
  const esempio = {piano:'Es. Sagra d\'autunno — piano di comunicazione', foglio:'Es. Bilancio festa patronale', riunione:'Es. Direttivo di novembre',
    disegno:'Es. Piantina degli stand', nota:'Es. Idee per il mercatino di Natale'};
  return (
    <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="modal">
        <h3>Nuovo documento</h3>
        <div className="f">
          <label>Titolo</label>
          <input autoFocus value={titolo} onChange={e=>setTitolo(e.target.value)} placeholder={esempio[tipo]}
            onKeyDown={e=>{if(e.key==='Enter') crea();}}/>
        </div>
        <div className="f">
          <label>Tipo</label>
          <select value={tipo} onChange={e=>cambiaTipo(e.target.value)}>
            <option value="piano">Piano — strategia, calendario dei contenuti, attività</option>
            <option value="foglio">Foglio di calcolo — tabelle con numeri e formule</option>
            <option value="riunione">Riunione — ordine del giorno, decisioni, attività</option>
            <option value="nota">Appunto — testo libero</option>
            <option value="disegno">Disegno — schizzi a mano libera (mouse, dito, penna)</option>
          </select>
        </div>
        {modelli && (
          <div className="f">
            <label>Parti da</label>
            <select value={tpl} onChange={e=>setTpl(e.target.value)}>
              {Object.entries(modelli).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
        )}
        {tipo==='piano' && (
          <div className="f">
            <label>{(MODELLI_PIANO[tpl] || MODELLI_PIANO.vuoto).rif}</label>
            <input type="date" value={dataRif} onChange={e=>setDataRif(e.target.value)}/>
            {tpl!=='vuoto' && <div className="spazio-sub" style={{marginTop:4}}>
              Il modello mette già in calendario {MODELLI_PIANO[tpl].contenuti.length} uscite calcolate da questa data: poi le sposti, le cambi o le togli.</div>}
          </div>
        )}
        <div className="modal-foot">
          <button className="btn" onClick={onClose}>Annulla</button>
          <button className="btn primary" onClick={crea}>Crea</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════ anteprima di stampa ═══════════ */
function AnteprimaStampa({doc, sezione, fmt, onSave, onClose}){
  const o = fmt || FORMATO_DEF;
  const base = useMemo(()=>docToHtml(doc, sezione), [doc.id]);         // il contenuto di quando si è aperta
  const unita = useMemo(()=>unitaStampa(base), [base]);
  const iniziale = () => { const x = doc.stampa || {}; return { ordine: ordinaUnita(unita, x).map(u=>u.k), pb: x.pb || [], insieme: x.insieme || [], via: x.via || [], spazio: x.spazio || [] }; };
  const [st, setStVero] = useState(iniziale);
  /* cronologia dell'impaginazione: ogni modifica si può annullare e ripetere */
  const stRef = useRef(st); stRef.current = st;
  const passi = useRef([]), avanti = useRef([]);
  const setSt = (f) => {
    const p = stRef.current;
    const n = typeof f === 'function' ? f(p) : f;
    if(!n || n === p || JSON.stringify(n) === JSON.stringify(p)) return;
    passi.current.push(p); if(passi.current.length > 100) passi.current.shift();
    avanti.current = [];
    stRef.current = n; setStVero(n);
  };
  const indietro = () => { if(!passi.current.length) return; avanti.current.push(stRef.current); const n = passi.current.pop(); stRef.current = n; setStVero(n); };
  const avantiDi = () => { if(!avanti.current.length) return; passi.current.push(stRef.current); const n = avanti.current.pop(); stRef.current = n; setStVero(n); };
  const [sel, setSel] = useState(null);
  const [pagine, setPagine] = useState(null);
  const [contenuto, setContenuto] = useState('');
  const [scala, setScala] = useState(0.7);
  const [busy, setBusy] = useState('');
  const pagRef = useRef(null), listaRef = useRef(null);

  const mm = MARGINI[o.margini] || MARGINI.normali;
  const pxMm = 96 / 25.4;
  const pagW = Math.round(210 * pxMm), pagH = Math.round(297 * pxMm);
  const mT = mm[0] * pxMm, mL = mm[1] * pxMm;
  const largPx = Math.round((210 - 2 * mm[1]) * pxMm), altPx = Math.floor((297 - 2 * mm[0] - 2) * pxMm);

  // ricalcolo le pagine a ogni cambio, con le stesse regole del PDF
  useEffect(()=>{
    let vivo = true;
    let stile = document.getElementById('pdf-style');
    if(!stile){ stile = document.createElement('style'); stile.id = 'pdf-style'; document.head.appendChild(stile); }
    stile.textContent = pdfDomCss(o);
    const html = preparaPerPdf(applicaStampa(base, st, true));
    const host = document.createElement('div');
    host.style.cssText = `position:absolute;left:-30000px;top:0;width:${largPx}px;background:#fff`;
    host.innerHTML = `<div class="pdfdoc">${html}</div>`;
    document.body.appendChild(host);
    (async()=>{
      try{
        await Promise.all(Array.from(host.querySelectorAll('img')).map(im => im.complete ? 0 : new Promise(r=>{ im.onload = im.onerror = r; setTimeout(r, 3000); })));
        try{ if(document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r, 1500))]); }catch(e){}
        const t = calcolaTagli(host, altPx);
        if(vivo){ setContenuto(html); setPagine(t); }
      } finally { host.remove(); }
    })();
    return ()=>{ vivo = false; };
  }, [st, base, o.font, o.size, o.margini]);

  // le pagine si adattano alla larghezza dello schermo
  useEffect(()=>{
    const misura = () => { const w = pagRef.current ? pagRef.current.clientWidth - 36 : 600; setScala(Math.max(0.3, Math.min(1, w / pagW))); };
    misura(); window.addEventListener('resize', misura);
    return ()=>window.removeEventListener('resize', misura);
  }, []);
  useEffect(()=>{
    const k = e => {
      if(e.key === 'Escape') onClose();
      if((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); e.shiftKey ? avantiDi() : indietro(); }
      if((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); avantiDi(); }
    };
    document.addEventListener('keydown', k); return ()=>document.removeEventListener('keydown', k);
  }, []);

  const perK = useMemo(()=>{ const m = {}; unita.forEach(u=>m[u.k] = u); return m; }, [unita]);
  const lista = st.ordine.map(k=>perK[k]).filter(Boolean);
  const ha = (campo, k) => (st[campo] || []).includes(k);
  const alterna = (campo, k) => setSt(p=>({ ...p, [campo]: ha(campo, k) ? p[campo].filter(x=>x !== k) : [...p[campo], k] }));
  const sposta = (k, d) => setSt(p=>{
    const o2 = p.ordine.slice(); const i = o2.indexOf(k), j = i + d;
    if(i < 0 || j < 0 || j >= o2.length) return p;
    [o2[i], o2[j]] = [o2[j], o2[i]];
    return { ...p, ordine: o2 };
  });
  const [trascina, setTrascina] = useState(null);
  const lascia = (k) => {
    if(!trascina || trascina === k) return setTrascina(null);
    setSt(p=>{ const o2 = p.ordine.filter(x=>x !== trascina); o2.splice(o2.indexOf(k), 0, trascina); return { ...p, ordine: o2 }; });
    setTrascina(null);
  };
  const originale = unita.map(u=>u.k);
  const toccato = st.pb.length || st.insieme.length || st.via.length || st.spazio.length || st.ordine.join('\n') !== originale.join('\n');
  const daSalvare = () => toccato ? st : null;
  const salva = () => { onSave(daSalvare()); };

  const spazioDi = (k) => { const c = (st.spazio || []).find(x=>x[0] === k); return c ? c[1] : 0; };
  const metiSpazio = (k, mm) => setSt(p=>{
    const v = Math.max(-60, Math.min(250, Math.round(mm)));
    const resto = (p.spazio || []).filter(x=>x[0] !== k);
    return { ...p, spazio: v ? [...resto, [k, v]] : resto };
  });
  // trascinando un blocco nell'anteprima lo sposto più su o più giù nel foglio
  const tira = useRef(null);
  const giuSuPagina = (e) => {
    if(e.button !== undefined && e.button !== 0) return;
    const u = e.target.closest('.st-pag [data-k]');
    if(!u) return;
    tira.current = { k: u.getAttribute('data-k'), y0: e.clientY, base: spazioDi(u.getAttribute('data-k')), mosso: false };
  };
  const muoviPagina = (e) => {
    const t = tira.current; if(!t) return;
    const dy = (e.clientY - t.y0) / scala;
    if(!t.mosso && Math.abs(dy) < 4) return;
    t.mosso = true; e.preventDefault();
    t.mm = t.base + dy / pxMm;
    pagRef.current.querySelectorAll(`.st-pag [data-k="${CSS.escape(t.k)}"]`).forEach(el=>{ el.style.transform = `translateY(${dy}px)`; el.style.opacity = '.85'; });
  };
  const suPagina = () => {
    const t = tira.current; tira.current = null;
    if(!t || !t.mosso) return;
    pagRef.current.querySelectorAll(`.st-pag [data-k="${CSS.escape(t.k)}"]`).forEach(el=>{ el.style.transform = ''; el.style.opacity = ''; });
    setSel(t.k); metiSpazio(t.k, t.mm);
    tira.current = { appenaMosso: true };
    setTimeout(()=>{ if(tira.current && tira.current.appenaMosso) tira.current = null; }, 0);
  };

  // clic su un blocco dell'anteprima: lo seleziono nella lista
  const cliccaPagina = (e) => {
    if(tira.current && tira.current.appenaMosso){ tira.current = null; return; }
    const u = e.target.closest('[data-k]');
    if(!u) return;
    const k = u.getAttribute('data-k');
    setSel(k);
    setTimeout(()=>{ const r = listaRef.current && listaRef.current.querySelector(`[data-riga="${CSS.escape(k)}"]`); if(r) r.scrollIntoView({block:'nearest'}); }, 0);
  };
  useEffect(()=>{
    if(!sel || !pagRef.current) return;
    const el = pagRef.current.querySelector(`.st-pag [data-k="${CSS.escape(sel)}"]`);
    if(el){ const box = pagRef.current.getBoundingClientRect(), r = el.getBoundingClientRect();
      if(r.top < box.top || r.top > box.bottom - 60) el.scrollIntoView({block:'center'}); }
  }, [sel, pagine]);

  const nomeFile = (doc.titolo||'documento') + (doc.data ? ' ' + doc.data : '');
  const esporta = async (modo) => {
    onSave(daSalvare(), true);
    const inner = applicaStampa(base, st);
    if(modo === 'stampa'){ printFallback(doc.titolo||'Documento', inner, o); return; }
    setBusy('PDF…');
    try{ await exportPdf(doc.titolo||'Documento', inner, nomeFile, {...o, pdf:'alta'}); } finally { setBusy(''); }
  };

  const evidenzia = sel ? `.st-pag [data-k="${CSS.escape(sel)}"]{outline:2px solid #2f6f4e !important;outline-offset:-2px;box-shadow:inset 0 0 0 9999px rgba(47,111,78,.07)}` : '';
  const n = pagine ? pagine.length : 0;

  return (
    <div className="st-ov">
      <style>{evidenzia}</style>
      <div className="st-bar">
        <h3>Anteprima di stampa</h3>
        <span className="st-info">{pagine ? `${n} ${n === 1 ? 'pagina' : 'pagine'} A4` : 'calcolo…'} · le modifiche valgono solo per stampa e PDF</span>
        <span className="spacer" style={{flex:1}}></span>
        <button className="btn sm" disabled={!passi.current.length} onClick={indietro} title="Annulla l'ultima modifica (Ctrl/Cmd+Z)">↶ Indietro</button>
        <button className="btn sm" disabled={!avanti.current.length} onClick={avantiDi} title="Rifai la modifica annullata (Ctrl/Cmd+Maiusc+Z)">Avanti ↷</button>
        <button className="btn sm" disabled={!toccato} onClick={()=>{ setSt({ordine: originale, pb:[], insieme:[], via:[], spazio:[]}); setSel(null); }}
          title="Torna all'ordine del documento, senza salti pagina">Ripristina</button>
        <button className="btn sm" onClick={()=>esporta('stampa')} title="Apre la finestra di stampa del browser">Stampa</button>
        <button className="btn sm" disabled={!!busy} onClick={()=>esporta('pdf')}>{busy || 'PDF'}</button>
        <button className="btn sm" onClick={onClose}>Chiudi</button>
        <button className="btn sm primary" onClick={salva}>Salva impaginazione</button>
      </div>
      <div className="st-corpo">
        <div className="st-lista" ref={listaRef}>
          <div className="st-aiuto">Sposta i blocchi con le frecce (o trascinandoli), manda un blocco a <b>pagina nuova</b>,
            tienilo <b>tutto insieme</b> sulla stessa pagina o <b>escludilo</b> dalla stampa. Per spostarlo più su o più giù
            nel foglio <b>trascinalo</b> nell'anteprima, oppure usa ↥ / ↧. Il documento non cambia.</div>
          {lista.map((u, i)=>{
            const on = sel === u.k;
            return (
              <div key={u.k}>
                {ha('pb', u.k) && i > 0 && <div className="st-salto">— pagina nuova —</div>}
                <div data-riga={u.k} className={'st-riga' + (on ? ' sel' : '') + (ha('via', u.k) ? ' fuori' : '') + (trascina === u.k ? ' trasc' : '')}
                  draggable onDragStart={()=>setTrascina(u.k)} onDragOver={e=>e.preventDefault()} onDrop={()=>lascia(u.k)} onDragEnd={()=>setTrascina(null)}
                  onClick={()=>setSel(on ? null : u.k)}>
                  <span className="st-tipo">{u.tipo}</span>
                  <span className="st-nome" title={u.nome}>{u.nome}</span>
                  {!!spazioDi(u.k) && <span className="st-mm">{(spazioDi(u.k) > 0 ? '+' : '') + spazioDi(u.k)} mm</span>}
                </div>
                {on && (
                  <div className="st-az">
                    <button disabled={i === 0} onClick={()=>sposta(u.k, -1)} title="Sposta su">↑ Su</button>
                    <button disabled={i === lista.length - 1} onClick={()=>sposta(u.k, 1)} title="Sposta giù">↓ Giù</button>
                    <button className={ha('pb', u.k) ? 'on' : ''} disabled={i === 0} onClick={()=>alterna('pb', u.k)}>Pagina nuova</button>
                    <button className={ha('insieme', u.k) ? 'on' : ''} onClick={()=>alterna('insieme', u.k)} title="Non spezzarlo fra due pagine">Tutto insieme</button>
                    <button className={ha('via', u.k) ? 'on' : ''} onClick={()=>alterna('via', u.k)}>Escludi</button>
                    <span className="st-sp">
                      <button onClick={()=>metiSpazio(u.k, spazioDi(u.k) - 5)} title="Avvicina il blocco a quello sopra (5 mm)">↥ Più su</button>
                      <button onClick={()=>metiSpazio(u.k, spazioDi(u.k) + 5)} title="Allontana il blocco da quello sopra (5 mm)">↧ Più giù</button>
                      <span className="st-mm">{spazioDi(u.k) ? (spazioDi(u.k) > 0 ? '+' : '') + spazioDi(u.k) + ' mm' : 'posizione normale'}</span>
                      {!!spazioDi(u.k) && <button onClick={()=>metiSpazio(u.k, 0)}>Azzera</button>}
                    </span>
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <div className="st-pagine" ref={pagRef} onClick={cliccaPagina}
          onPointerDown={giuSuPagina} onPointerMove={muoviPagina} onPointerUp={suPagina} onPointerLeave={suPagina}>
          {!pagine && <div className="st-calcolo">Preparo le pagine…</div>}
          {pagine && pagine.map(([a, b], i)=>(
            <div key={i} className="st-pag" style={{width: pagW * scala, height: pagH * scala}}>
              <div style={{width: pagW, height: pagH, transform: `scale(${scala})`, transformOrigin: '0 0', position: 'relative'}}>
                <div style={{position:'absolute', left: mL, top: mT, width: largPx, height: Math.max(1, b - a), overflow:'hidden'}}>
                  <div className="pdfdoc" style={{position:'relative', top: -a}} dangerouslySetInnerHTML={{__html: contenuto}}/>
                </div>
                <div className="st-num">{i + 1} / {n}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

  return (
    <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="modal" style={{maxWidth:460}}>
        <h3>Formato di Word e PDF</h3>

        <div className="f">
          <label>Carattere</label>
          <select value={f} onChange={e=>setF(e.target.value)}>
            {Object.entries(FONTS).map(([k,v])=><option key={k} value={k}>{v.nome}</option>)}
          </select>
        </div>

        <div className="f">
          <label>Dimensione del testo — {String(sz).replace('.',',')} pt</label>
          <input type="range" min="8" max="14" step="0.5" value={sz}
            onChange={e=>setSz(parseFloat(e.target.value))} style={{padding:0}}/>
          <div className="spazio-sub" style={{display:'flex',justifyContent:'space-between',marginTop:2}}>
            <span>piccolo</span><span>grande</span>
          </div>
        </div>

        <div className="f">
          <label>Margini della pagina</label>
          <select value={mg} onChange={e=>setMg(e.target.value)}>
            <option value="stretti">Stretti — più testo per pagina</option>
            <option value="normali">Normali</option>
            <option value="ampi">Ampi</option>
          </select>
        </div>

        <div className="f">
          <label>Come generare il PDF</label>
          <select value={qp} onChange={e=>setQp(e.target.value)}>
            <option value="alta">Diretto HD — si scarica subito, circa 400 dpi</option>
            <option value="nitido">Nitido — testo vero e selezionabile, passa dalla stampa</option>
          </select>
          <div className="spazio-sub" style={{marginTop:4}}>
            {qp === 'nitido'
              ? 'Si apre il pannello di stampa: scegli "Salva come PDF". Qualità perfetta a ogni ingrandimento.'
              : 'Nessun passaggio in più: pagine in alta definizione, nitide anche stampate. Il testo non è selezionabile.'}
          </div>
        </div>

        <div className="anteprima" style={{fontFamily:ff}}>
          <div style={{fontSize:(sz*1.85)+'pt',lineHeight:1.2,marginBottom:6}}>Riunione di esempio</div>
          <div style={{fontSize:(sz*1.22)+'pt',borderBottom:'1px solid #d5dcd7',paddingBottom:3,margin:'10px 0 5px'}}>Ordine del giorno</div>
          <div style={{fontSize:sz+'pt',lineHeight:1.45}}>
            Così apparirà il testo dei tuoi documenti una volta esportati, con questa
            dimensione e questo carattere.
          </div>
          <div style={{fontSize:(sz*0.92)+'pt',color:'#41504a',marginTop:5}}>
            E così le note, leggermente più piccole.
          </div>
        </div>

        <div className="modal-foot">
          <button className="btn" style={{marginRight:'auto'}}
            onClick={()=>{ setF(FORMATO_DEF.font); setSz(FORMATO_DEF.size); setMg(FORMATO_DEF.margini); setQp(FORMATO_DEF.pdf); }}>
            Ripristina
          </button>
          <button className="btn" onClick={onClose}>Annulla</button>
          <button className="btn primary" onClick={()=>onSave({font:f,size:sz,margini:mg,pdf:qp})}>Salva</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════ versioni precedenti ═══════════ */
function StoricoModal({doc, onRipristina, onClose}){
  const [voci,setVoci] = useState(null);
  useEffect(()=>{
    if(HAS_FB){
      fbDb.ref(ROOT+'/storico/'+doc.id).once('value').then(sn=>{
        const v = sn.val() || {};
        setVoci(Object.keys(v).sort().reverse().map(k=>v[k]));
      }).catch(()=>setVoci([]));
    } else {
      const st = local.get(ROOT+':storico') || {};
      setVoci([...(st[doc.id]||[])].reverse());
    }
  },[doc.id]);

  const quando = (iso) => {
    if(!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('it-IT') + ' alle ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  };
  const anteprima = (v) => stripHtml(v.corpo).slice(0,110) || '(nessun testo)';

  return (
    <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="modal" style={{maxWidth:560}}>
        <h3>Versioni precedenti</h3>
        <p className="spazio-sub" style={{marginTop:-6}}>
          Copie salvate quando il documento si è accorciato molto, e comunque ogni mezz'ora di lavoro.
        </p>
        {voci === null && <div className="empty">Cerco…</div>}
        {voci && voci.length === 0 && (
          <div className="empty"><strong>Nessuna copia</strong>Per questo documento non ci sono versioni archiviate.</div>
        )}
        <div style={{maxHeight:'46vh', overflowY:'auto', marginTop:8}}>
          {voci && voci.map((v,i)=>(
            <div className="top-doc" key={i}>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:13}}>{quando(v.salvataIl || v.aggiornato)}</div>
                <div className="src" style={{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{anteprima(v)}</div>
              </div>
              <span className="p">{Math.round((v.corpo||'').length/1024*10)/10} KB</span>
              <button className="btn sm" onClick={()=>{
                if(confirm('Riportare il documento a questa versione? Quella attuale verrà a sua volta archiviata.')) onRipristina(v);
              }}>Ripristina</button>
            </div>
          ))}
        </div>
        <div className="modal-foot"><button className="btn" onClick={onClose}>Chiudi</button></div>
      </div>
    </div>
  );
}

/* ═══════════ sposta i documenti ═══════════ */
function SpostaModal({quanti, radici, figlieDi, correnteId, onSposta, onClose}){
  return (
    <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="modal" style={{maxWidth:440}}>
        <h3>{quanti === 1 ? 'Sposta il documento' : `Sposta ${quanti} documenti`}</h3>
        <div style={{maxHeight:'50vh', overflowY:'auto', marginTop:6}}>
          {radici.map(r=>(
            <div key={r.id}>
              <button className={'dest'+(r.id===correnteId?' qui':'')} disabled={r.id===correnteId}
                onClick={()=>onSposta(r.id)}>
                <span className="chip" style={{background:r.colore}}></span>
                {r.nome}
                {r.id===correnteId && <span className="qui-t">qui</span>}
              </button>
              {figlieDi(r.id).map(f=>(
                <button key={f.id} className={'dest figlia'+(f.id===correnteId?' qui':'')} disabled={f.id===correnteId}
                  onClick={()=>onSposta(f.id)}>
                  <span className="ic" style={{color:f.colore}}>▣</span>
                  {f.nome}
                  {f.id===correnteId && <span className="qui-t">qui</span>}
                </button>
              ))}
            </div>
          ))}
        </div>
        <div className="modal-foot"><button className="btn" onClick={onClose}>Annulla</button></div>
      </div>
    </div>
  );
}

/* ═══════════ login ═══════════ */
/* ═══════════ LAVAGNA: fogli da disegnare (PC, iPad, telefono) ═══════════
   Il disegno è salvato come tratti (non come immagine): pesa poco nel database,
   resta nitido a ogni dimensione e si vede uguale su tutti i dispositivi.
   Le coordinate sono "logiche": il foglio è largo sempre 1000 unità, qualunque sia lo schermo. */
const LAV_W = 1000;
const LAV_PAGINA = 1414;                 // proporzioni di un A4
const LAV_COLORI = ['#17211d','#2f6f4e','#1f5fbf','#c0392b','#e67e22','#8e44ad','#7f8c8d'];
const LAV_EVID = ['#fff176','#a5d6a7','#90caf9','#f8bbd0'];
const LAV_SPESSORI = [{n:'Fine',v:2},{n:'Media',v:4},{n:'Grossa',v:8},{n:'Pennarello',v:14}];
const LAV_SFONDI = [{n:'Bianco',v:'bianco'},{n:'A righe',v:'righe'},{n:'A quadretti',v:'quadretti'},{n:'A puntini',v:'puntini'}];

function lavSfondo(ctx, sfondo, h){
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, LAV_W, h);
  ctx.save();
  if(sfondo === 'righe' || sfondo === 'quadretti'){
    ctx.strokeStyle = sfondo === 'righe' ? '#dbe6ee' : '#e6edf2';
    ctx.lineWidth = 1;
    const passo = sfondo === 'righe' ? 40 : 25;
    ctx.beginPath();
    for(let y = passo; y < h; y += passo){ ctx.moveTo(0, y); ctx.lineTo(LAV_W, y); }
    if(sfondo === 'quadretti') for(let x = passo; x < LAV_W; x += passo){ ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    ctx.stroke();
  } else if(sfondo === 'puntini'){
    ctx.fillStyle = '#c9d4db';
    for(let y = 25; y < h; y += 25) for(let x = 25; x < LAV_W; x += 25){ ctx.fillRect(x - 1, y - 1, 2, 2); }
  }
  // separatore tra le pagine, leggero
  ctx.strokeStyle = '#eef2f4'; ctx.setLineDash([6, 6]); ctx.lineWidth = 1;
  ctx.beginPath();
  for(let y = LAV_PAGINA; y < h; y += LAV_PAGINA){ ctx.moveTo(0, y); ctx.lineTo(LAV_W, y); }
  ctx.stroke();
  ctx.restore();
}
const LAV_FONT = "'Inter',-apple-system,'Segoe UI',Arial,sans-serif";
const LAV_CORPI = {2:18, 4:24, 8:32, 14:44};           // spessore scelto → corpo del testo
let lavCtxMisura = null;
/* ingombro di una scritta: {x, y, w, h} (y = cima della prima riga) */
function lavMisura(tr){
  if(!lavCtxMisura){ const c = document.createElement('canvas'); lavCtxMisura = c.getContext('2d'); }
  const righe = String(tr.testo || '').split('\n');
  lavCtxMisura.font = `${tr.s}px ${LAV_FONT}`;
  const w = Math.max(10, ...righe.map(r=>lavCtxMisura.measureText(r).width));
  return {x: tr.x, y: tr.y, w, h: righe.length * tr.s * 1.25};
}
/* quanto in basso arriva un elemento (per allungare il foglio e ritagliare le immagini) */
function lavFondo(tr){
  if(tr.t === 'testo'){ const m = lavMisura(tr); return m.y + m.h; }
  const p = tr.p || []; let y = 0; for(let i = 1; i < p.length; i += 2) if(p[i] > y) y = p[i];
  return y + (tr.w || 0) / 2;
}
function lavTratto(ctx, tr){
  if(tr.t === 'testo'){
    ctx.save();
    ctx.fillStyle = tr.c; ctx.font = `${tr.s}px ${LAV_FONT}`; ctx.textBaseline = 'top';
    String(tr.testo || '').split('\n').forEach((r, i)=>ctx.fillText(r, tr.x, tr.y + i * tr.s * 1.25));
    ctx.restore();
    return;
  }
  const p = tr.p || [];
  if(p.length < 2) return;
  ctx.save();
  ctx.globalAlpha = tr.t === 'evid' ? 0.4 : 1;
  ctx.strokeStyle = tr.c; ctx.fillStyle = tr.c;
  ctx.lineWidth = tr.w; ctx.lineCap = tr.t === 'evid' ? 'butt' : 'round'; ctx.lineJoin = 'round';
  if(p.length === 2){
    ctx.beginPath(); ctx.arc(p[0], p[1], tr.w / 2, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    // curve morbide passando per i punti di mezzo
    for(let i = 2; i < p.length - 2; i += 2){
      const mx = (p[i] + p[i+2]) / 2, my = (p[i+1] + p[i+3]) / 2;
      ctx.quadraticCurveTo(p[i], p[i+1], mx, my);
    }
    ctx.lineTo(p[p.length-2], p[p.length-1]);
    ctx.stroke();
  }
  ctx.restore();
}
/* immagine del disegno, per Word e PDF */
function disegnoPng(dis){
  try{
    const d = dis || {};
    const tratti = d.tratti || [];
    // alto quanto serve: fino all'ultimo tratto (almeno mezza pagina)
    let maxY = 400;
    tratti.forEach(t=>{ const f = lavFondo(t); if(f > maxY) maxY = f; });
    const h = Math.min(d.h || LAV_PAGINA, Math.ceil(maxY + 60));
    const c = document.createElement('canvas');
    const k = 2.5;
    c.width = Math.round(LAV_W * k); c.height = Math.round(h * k);
    const ctx = c.getContext('2d');
    ctx.setTransform(k, 0, 0, k, 0, 0);
    lavSfondo(ctx, d.sfondo || 'bianco', h);
    tratti.forEach(t=>lavTratto(ctx, t));
    return c.toDataURL('image/png');
  }catch(e){ return ''; }
}

/* immagine ritagliata sul contenuto, con lo sfondo trasparente: per i disegni dentro il testo */
function disegnoRitaglio(dis){
  const tratti = (dis && dis.tratti) || [];
  if(!tratti.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  tratti.forEach(t=>{
    if(t.t === 'testo'){ const m = lavMisura(t); x0 = Math.min(x0, m.x); y0 = Math.min(y0, m.y); x1 = Math.max(x1, m.x + m.w); y1 = Math.max(y1, m.y + m.h); return; }
    const p = t.p || [], m = (t.w || 2) / 2;
    for(let i = 0; i < p.length; i += 2){ x0 = Math.min(x0, p[i]-m); x1 = Math.max(x1, p[i]+m); y0 = Math.min(y0, p[i+1]-m); y1 = Math.max(y1, p[i+1]+m); }
  });
  const pad = 14;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(LAV_W, x1 + pad); y1 = y1 + pad;
  const w = Math.max(20, x1 - x0), h = Math.max(20, y1 - y0);
  const k = 3;
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext('2d');
  ctx.setTransform(k, 0, 0, k, -x0 * k, -y0 * k);
  if(dis.sfondo && dis.sfondo !== 'bianco'){ ctx.save(); lavSfondo(ctx, dis.sfondo, y1 + 10); ctx.restore(); }
  tratti.forEach(t=>lavTratto(ctx, t));
  return { src: c.toDataURL('image/png'), perc: Math.min(100, Math.round(w / LAV_W * 1000) / 10) };
}

let lavAttiva = null;                    // l'ultima lavagna toccata: Ctrl+Z vale per lei

function Lavagna({value, onChange, docKey, compatta, apiRef}){
  const leggi = (v) => ({ tratti: (v && Array.isArray(v.tratti)) ? v.tratti.filter(t=>t && (t.p || t.t === 'testo')) : [],
                          h: (v && v.h) || LAV_PAGINA, sfondo: (v && v.sfondo) || 'bianco' });
  const [dis, setDis] = useState(()=>leggi(value));
  const disRef = useRef(dis); disRef.current = dis;
  const [strumento, setStrumento] = useState('penna');     // penna · evid · gomma
  const [colore, setColore] = useState(LAV_COLORI[0]);
  const [coloreEvid, setColoreEvid] = useState(LAV_EVID[0]);
  const [spessore, setSpessore] = useState(4);
  const [ditoScorre, setDitoScorre] = useState(()=> !!local.get('proloco:ditoScorre'));
  const [scrivo, setScrivo] = useState(null);         // scritta in corso: {x, y, s, c, testo, idx}
  const scrivoRef = useRef(null); scrivoRef.current = scrivo;
  const areaRef = useRef(null);
  const mioId = useRef(Math.random().toString(36).slice(2));
  const ditoRef = useRef(ditoScorre); ditoRef.current = ditoScorre;
  const wrapRef = useRef(null), cRef = useRef(null), oRef = useRef(null);
  const scalaRef = useRef(1);
  const correnteRef = useRef(null);         // tratto in corso
  const scorriRef = useRef(null);           // dito che fa scorrere
  const cancellatiRef = useRef(false);
  const storia = useRef({passi:[], avanti:[]});
  const [, forza] = useState(0);
  const inviato = useRef(JSON.stringify(leggi(value)));
  const timer = useRef(null);

  /* salvataggio: poco dopo l'ultimo tratto */
  const salva = (nuovo, subito) => {
    clearTimeout(timer.current);
    const invia = () => { const s = JSON.stringify(nuovo); inviato.current = s; onChange(nuovo); };
    if(subito) invia(); else timer.current = setTimeout(invia, 500);
  };
  const cambia = (nuovo, conStoria=true) => {
    if(conStoria){
      const st = storia.current;
      st.passi.push(disRef.current); if(st.passi.length > 80) st.passi.shift();
      st.avanti = [];
    }
    disRef.current = nuovo;
    setDis(nuovo);
    salva(nuovo);
  };
  // cambiando foglio riparto pulito; un aggiornamento da un altro dispositivo lo prendo se non sto disegnando
  useEffect(()=>{
    const d = leggi(value);
    inviato.current = JSON.stringify(d);
    storia.current = {passi:[], avanti:[]};
    setDis(d); disRef.current = d;
  }, [docKey]);
  useEffect(()=>{
    if(correnteRef.current) return;
    const d = leggi(value);
    const s = JSON.stringify(d);
    if(s !== inviato.current && s !== JSON.stringify(disRef.current)){
      inviato.current = s; setDis(d); disRef.current = d;
    }
  }, [value]);
  useEffect(()=>()=>{ clearTimeout(timer.current); }, []);
  // se esco dal foglio con un salvataggio in attesa, lo mando subito
  useEffect(()=>()=>{
    if(timer.current){ clearTimeout(timer.current); const s = JSON.stringify(disRef.current); if(s !== inviato.current) onChange(disRef.current); }
  }, [docKey]);

  /* disegno a video */
  const ridisegna = () => {
    const c = cRef.current, w = wrapRef.current;
    if(!c || !w) return;
    const dpr = window.devicePixelRatio || 1;
    const larg = w.clientWidth;
    const scala = larg / LAV_W;
    scalaRef.current = scala;
    const d = disRef.current;
    const altPx = Math.round(d.h * scala);
    [c, oRef.current].forEach(x=>{
      if(!x) return;
      const W = Math.round(larg * dpr), H = Math.round(altPx * dpr);
      if(x.width !== W) x.width = W;
      if(x.height !== H) x.height = H;
      x.style.width = larg + 'px'; x.style.height = altPx + 'px';
    });
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr * scala, 0, 0, dpr * scala, 0, 0);
    lavSfondo(ctx, d.sfondo, d.h);
    const inModifica = scrivoRef.current ? scrivoRef.current.idx : null;
    d.tratti.forEach((t, i)=>{ if(i !== inModifica) lavTratto(ctx, t); });
  };
  useEffect(()=>{ ridisegna(); });
  useEffect(()=>{
    const w = wrapRef.current;
    if(!w || !window.ResizeObserver) return;
    const ro = new ResizeObserver(()=>ridisegna());
    ro.observe(w);
    return () => ro.disconnect();
  }, []);
  const disegnaCorrente = () => {
    const o = oRef.current; if(!o) return;
    const dpr = window.devicePixelRatio || 1, k = dpr * scalaRef.current;
    const ctx = o.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, o.width, o.height);
    ctx.setTransform(k, 0, 0, k, 0, 0);
    if(correnteRef.current) lavTratto(ctx, correnteRef.current);
  };

  /* coordinate logiche del puntatore */
  const punto = (e) => {
    const r = cRef.current.getBoundingClientRect();
    const s = scalaRef.current || 1;
    return [Math.round(((e.clientX - r.left) / s) * 10) / 10, Math.round(((e.clientY - r.top) / s) * 10) / 10];
  };
  const contenitoreScorrevole = () => {
    let x = wrapRef.current && wrapRef.current.parentElement;
    while(x && x !== document.body){
      const st = getComputedStyle(x);
      if(/(auto|scroll)/.test(st.overflowY) && x.scrollHeight > x.clientHeight) return x;
      x = x.parentElement;
    }
    return document.scrollingElement || document.documentElement;
  };
  const gommaSu = (x, y) => {
    const d = disRef.current;
    const raggio = 10 + spessore;
    const r2 = raggio * raggio;
    const tocca = (t) => {
      if(t.t === 'testo'){
        const b = lavMisura(t);
        return x >= b.x - raggio && x <= b.x + b.w + raggio && y >= b.y - raggio && y <= b.y + b.h + raggio;
      }
      const p = t.p || [], m = (t.w || 2) / 2;
      for(let i = 0; i < p.length; i += 2){
        const dx = p[i] - x, dy = p[i+1] - y;
        if(dx*dx + dy*dy <= r2 + m*m + 2*raggio*m) return true;
        // anche lungo il segmento tra due punti lontani
        if(i + 3 < p.length){
          const ax = p[i], ay = p[i+1], bx = p[i+2], by = p[i+3];
          const vx = bx-ax, vy = by-ay, l2 = vx*vx+vy*vy;
          if(l2 > 16){
            let tt = ((x-ax)*vx + (y-ay)*vy) / l2; tt = Math.max(0, Math.min(1, tt));
            const qx = ax + tt*vx - x, qy = ay + tt*vy - y;
            if(qx*qx + qy*qy <= (raggio+m)*(raggio+m)) return true;
          }
        }
      }
      return false;
    };
    const resto = d.tratti.filter(t=>!tocca(t));
    if(resto.length !== d.tratti.length){
      if(!cancellatiRef.current){                       // un solo passo di "annulla" per tutta la passata
        const st = storia.current; st.passi.push(d); if(st.passi.length > 80) st.passi.shift(); st.avanti = [];
        cancellatiRef.current = true;
      }
      const nuovo = {...d, tratti: resto};
      disRef.current = nuovo; setDis(nuovo);
    }
  };

  /* ═══ scritte sul foglio ═══ */
  const chiudiScritta = () => {
    const sc = scrivoRef.current;
    if(!sc) return;
    scrivoRef.current = null; setScrivo(null);
    const testo = (sc.testo || '').replace(/\s+$/,'');
    const d = disRef.current;
    const tratti = d.tratti.slice();
    if(sc.idx !== null && sc.idx !== undefined){
      if(testo.trim()) tratti[sc.idx] = {t:'testo', x:sc.x, y:sc.y, s:sc.s, c:sc.c, testo};
      else tratti.splice(sc.idx, 1);
    } else if(testo.trim()) tratti.push({t:'testo', x:sc.x, y:sc.y, s:sc.s, c:sc.c, testo});
    else { ridisegna(); return; }
    let h = d.h;
    const fondo = Math.max(0, ...tratti.map(lavFondo));
    if(fondo > h - 200) h = h + Math.round(LAV_PAGINA / 2);
    cambia({...d, h, tratti});
  };
  const apriScritta = (x, y) => {
    const d = disRef.current;
    // tocco una scritta che c'è già: la modifico
    let idx = -1;
    for(let i = d.tratti.length - 1; i >= 0; i--){
      const t = d.tratti[i];
      if(t.t !== 'testo') continue;
      const b = lavMisura(t);
      if(x >= b.x - 6 && x <= b.x + b.w + 6 && y >= b.y - 6 && y <= b.y + b.h + 6){ idx = i; break; }
    }
    const nuovo = idx >= 0 ? {...d.tratti[idx], idx}
                           : {x, y: Math.max(0, y - (LAV_CORPI[spessore]||24) * 0.6), s: LAV_CORPI[spessore] || 24, c: colore, testo:'', idx:null};
    scrivoRef.current = nuovo; setScrivo(nuovo);
    setTimeout(()=>{ if(areaRef.current){ areaRef.current.focus(); const n = areaRef.current.value.length; areaRef.current.setSelectionRange(n, n); } }, 0);
  };

  const giu = (e) => {
    lavAttiva = mioId.current;
    if(e.pointerType === 'pen' && !ditoRef.current){ setDitoScorre(true); local.set('proloco:ditoScorre', true); }
    if(e.pointerType === 'touch' && ditoRef.current){
      // con la penna in uso il dito serve a scorrere il foglio
      scorriRef.current = {id: e.pointerId, y: e.clientY, x: e.clientX, cont: contenitoreScorrevole()};
      e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
      e.preventDefault();
      return;
    }
    if(e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
    if(correnteRef.current) return;                     // un solo tratto per volta (niente palmo)
    e.preventDefault();
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
    const [x, y] = punto(e);
    if(strumento === 'testo'){
      if(scrivoRef.current) chiudiScritta();   // la scritta aperta si salva e se ne apre un'altra dove ho toccato
      apriScritta(x, y);
      return;
    }
    if(scrivoRef.current) chiudiScritta();
    if(strumento === 'gomma'){
      cancellatiRef.current = false;
      correnteRef.current = {gomma:true, id:e.pointerId};
      gommaSu(x, y);
      return;
    }
    const ev = strumento === 'evid';
    correnteRef.current = { t: ev ? 'evid' : 'penna', c: ev ? coloreEvid : colore,
      w: ev ? Math.max(14, spessore * 3) : spessore, p:[x, y], id:e.pointerId };
    disegnaCorrente();
  };
  const muovi = (e) => {
    const sc = scorriRef.current;
    if(sc && sc.id === e.pointerId){
      const dy = e.clientY - sc.y, dx = e.clientX - sc.x;
      sc.y = e.clientY; sc.x = e.clientX;
      if(sc.cont === document.scrollingElement || sc.cont === document.documentElement) window.scrollBy(-dx, -dy);
      else { sc.cont.scrollTop -= dy; sc.cont.scrollLeft -= dx; }
      e.preventDefault();
      return;
    }
    const cur = correnteRef.current;
    if(!cur || cur.id !== e.pointerId) return;
    e.preventDefault();
    const eventi = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    if(cur.gomma){ eventi.forEach(ev=>{ const [x,y] = punto(ev); gommaSu(x, y); }); return; }
    eventi.forEach(ev=>{
      const [x, y] = punto(ev);
      const p = cur.p, lx = p[p.length-2], ly = p[p.length-1];
      if((x-lx)*(x-lx) + (y-ly)*(y-ly) >= 1.5) p.push(x, y);
    });
    disegnaCorrente();
  };
  const su = (e) => {
    if(scorriRef.current && scorriRef.current.id === e.pointerId){ scorriRef.current = null; return; }
    const cur = correnteRef.current;
    if(!cur || cur.id !== e.pointerId) return;
    correnteRef.current = null;
    if(cur.gomma){
      if(cancellatiRef.current){ salva(disRef.current); forza(n=>n+1); }
      cancellatiRef.current = false;
      return;
    }
    const {id, ...tratto} = cur;
    const d = disRef.current;
    // disegnando in fondo, il foglio si allunga da solo
    let maxY = 0; for(let i = 1; i < tratto.p.length; i += 2) if(tratto.p[i] > maxY) maxY = tratto.p[i];
    const h = maxY > d.h - 200 ? d.h + Math.round(LAV_PAGINA / 2) : d.h;
    cambia({...d, h, tratti: [...d.tratti, tratto]});
    disegnaCorrente();
  };

  const annulla = () => {
    const st = storia.current; if(!st.passi.length) return;
    st.avanti.push(disRef.current);
    const p = st.passi.pop();
    disRef.current = p; setDis(p); salva(p);
  };
  const ripeti = () => {
    const st = storia.current; if(!st.avanti.length) return;
    st.passi.push(disRef.current);
    const p = st.avanti.pop();
    disRef.current = p; setDis(p); salva(p);
  };
  const svuota = () => {
    if(!disRef.current.tratti.length) return;
    if(!confirm('Cancellare tutto il disegno? Puoi comunque tornare indietro con ↶.')) return;
    cambia({...disRef.current, tratti: []});
  };
  const allunga = () => cambia({...disRef.current, h: disRef.current.h + LAV_PAGINA}, false);
  const accorcia = () => {
    const d = disRef.current;
    let maxY = 0; d.tratti.forEach(t=>{ const f = lavFondo(t); if(f > maxY) maxY = f; });
    const h = Math.max(compatta ? 500 : LAV_PAGINA, Math.ceil((maxY + 100) / (LAV_PAGINA/2)) * (LAV_PAGINA/2));
    if(h < d.h) cambia({...d, h}, false);
  };

  // i tasti Ctrl/Cmd+Z funzionano anche qui (quando il foglio è in primo piano)
  useEffect(()=>{
    const k = (e) => {
      if(!(e.ctrlKey || e.metaKey) || !wrapRef.current) return;
      if(lavAttiva !== mioId.current) return;
      const a = document.activeElement;
      if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      if(a && a.isContentEditable) return;
      if(e.key === 'z' || e.key === 'Z'){ e.preventDefault(); e.shiftKey ? ripeti() : annulla(); }
      else if(e.key === 'y' || e.key === 'Y'){ e.preventDefault(); ripeti(); }
    };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  }, []);

  const scegli = (s) => { if(scrivoRef.current) chiudiScritta(); setStrumento(s); };
  // chi mi contiene può chiedermi il disegno aggiornato all'ultimo tratto (scritta aperta compresa)
  if(apiRef) apiRef.current = { dati: () => { if(scrivoRef.current) chiudiScritta(); return disRef.current; } };
  const pw = storia.current;
  const coloriVisti = strumento === 'evid' ? LAV_EVID : LAV_COLORI;
  const coloreAttivo = strumento === 'evid' ? coloreEvid : colore;
  return (
    <div className="lav">
      <div className="lav-tools">
        <button className={strumento==='penna'?'on':''} onClick={()=>scegli('penna')} title="Penna">✏️<span> Penna</span></button>
        <button className={strumento==='evid'?'on':''} onClick={()=>scegli('evid')} title="Evidenziatore">🖍<span> Evid.</span></button>
        <button className={strumento==='testo'?'on':''} onClick={()=>scegli('testo')} title="Testo: tocca il foglio dove vuoi scrivere (o una scritta per modificarla)">𝐓<span> Testo</span></button>
        <button className={strumento==='gomma'?'on':''} onClick={()=>scegli('gomma')} title="Gomma: cancella i tratti e le scritte che tocchi">⌫<span> Gomma</span></button>
        <span className="lav-sep"></span>
        {strumento !== 'gomma' && coloriVisti.map(c=>(
          <button key={c} className={'lav-col'+(coloreAttivo===c?' on':'')} style={{background:c}}
            onClick={()=>{
              if(strumento==='evid'){ setColoreEvid(c); return; }
              setColore(c);
              if(scrivoRef.current){ const n = {...scrivoRef.current, c}; scrivoRef.current = n; setScrivo(n); }
            }} title="Colore"></button>
        ))}
        {strumento !== 'gomma' && (
          <label className="lav-col lav-altro" title="Altro colore">
            <input type="color" value={coloreAttivo} onChange={e=> strumento==='evid' ? setColoreEvid(e.target.value) : setColore(e.target.value)}/>+
          </label>
        )}
        <span className="lav-sep"></span>
        <select value={spessore} onChange={e=>{
            const v = parseInt(e.target.value,10); setSpessore(v);
            if(scrivoRef.current){ const n = {...scrivoRef.current, s: LAV_CORPI[v] || 24}; scrivoRef.current = n; setScrivo(n); }
          }} title={strumento==='gomma'?'Grandezza della gomma':strumento==='testo'?'Grandezza del testo':'Spessore'}>
          {LAV_SPESSORI.map(s=><option key={s.v} value={s.v}>{strumento==='testo' ? (s.n==='Fine'?'Piccolo':s.n==='Media'?'Normale':s.n==='Grossa'?'Grande':'Titolo') : s.n}</option>)}
        </select>
        <span className="lav-sep"></span>
        <button onClick={annulla} disabled={!pw.passi.length} title="Annulla (Ctrl/Cmd+Z)"><svg className="ic-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M7 5 3 9l4 4"/><path d="M3 9h9a5 5 0 0 1 0 10h-2"/></svg></button>
        <button onClick={ripeti} disabled={!pw.avanti.length} title="Ripeti"><svg className="ic-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="m13 5 4 4-4 4"/><path d="M17 9H8a5 5 0 0 0 0 10h2"/></svg></button>
        <span className="lav-sep"></span>
        <select value={dis.sfondo} onChange={e=>cambia({...disRef.current, sfondo:e.target.value}, false)} title="Sfondo del foglio">
          {LAV_SFONDI.map(s=><option key={s.v} value={s.v}>{s.n}</option>)}
        </select>
        <button className={ditoScorre?'on':''} onClick={()=>{ const v=!ditoScorre; setDitoScorre(v); local.set('proloco:ditoScorre', v); }}
          title={ditoScorre ? 'Il dito scorre il foglio, si disegna con la penna. Tocca per disegnare anche col dito'
                            : 'Il dito disegna. Tocca per usare il dito solo per scorrere (utile con la penna su iPad)'}>
          ✋<span> {ditoScorre ? 'Dito scorre' : 'Dito disegna'}</span></button>
        <span className="lav-spacer"></span>
        <button onClick={allunga} title="Aggiungi una pagina in fondo">+ Pagina</button>
        <button onClick={accorcia} title="Togli lo spazio vuoto in fondo">Accorcia</button>
        <button className="lav-del" onClick={svuota} title="Cancella tutto il disegno">Svuota</button>
      </div>
      <div className="lav-foglio" ref={wrapRef}>
        <canvas ref={cRef}></canvas>
        <canvas ref={oRef} className={'lav-sopra'+(strumento==='gomma'?' gomma':strumento==='testo'?' testo':'')}
          onPointerDown={giu} onPointerMove={muovi} onPointerUp={su} onPointerCancel={su}
          onContextMenu={e=>e.preventDefault()}></canvas>
        {scrivo && (()=>{ const k = scalaRef.current || 1; return (
          <textarea ref={areaRef} className="lav-scritta" value={scrivo.testo} placeholder="Scrivi…"
            rows={Math.max(1, (scrivo.testo||'').split('\n').length)}
            style={{left: scrivo.x * k, top: scrivo.y * k, fontSize: scrivo.s * k, color: scrivo.c,
                    lineHeight: 1.25, fontFamily: LAV_FONT,
                    width: Math.max(160, (lavMisura({...scrivo, testo: (scrivo.testo||'') + 'MM'}).w) * k)}}
            onChange={e=>{ const n = {...scrivoRef.current, testo: e.target.value}; scrivoRef.current = n; setScrivo(n); }}
            onKeyDown={e=>{
              if(e.key === 'Escape'){ e.preventDefault(); chiudiScritta(); }
              if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); chiudiScritta(); }
            }}
            onBlur={()=>setTimeout(()=>{ if(scrivoRef.current && document.activeElement !== areaRef.current) chiudiScritta(); }, 120)}/>
        ); })()}
      </div>
    </div>
  );
}


/* ═══════════ blocco con PIN / Face ID ═══════════
   Il blocco vale per questo dispositivo: PIN (salvato solo come impronta cifrata) e Face ID / Touch ID
   (passkey del dispositivo). Protegge l'app aperta da occhi indiscreti; i dati restano protetti
   dall'accesso con password e dalle regole del database. */
const BLOCCO_KEY = 'proloco:blocco';
const bloccoCfg = () => { const c = local.get(BLOCCO_KEY); return c && (c.pin || c.bio) ? c : null; };
const esadecimale = buf => Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
const impronta = async (testo) => esadecimale(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(testo)));
const inB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const daB64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function bioDisponibile(){
  try{ return !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable
    && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; }
}
async function bioRegistra(nome){
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp: { name: APP_NOME },
    user: { id: crypto.getRandomValues(new Uint8Array(16)), name: nome || APP_NOME, displayName: APP_NOME },
    pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
    authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
    timeout: 60000
  }});
  return inB64(cred.rawId);
}
async function bioVerifica(id){
  const r = await navigator.credentials.get({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials: [{ type:'public-key', id: daB64(id), transports:['internal','hybrid'] }],
    userVerification: 'required', timeout: 60000
  }});
  return !!r;
}
async function pinGiusto(cfg, pin){ return !!(cfg && cfg.pin && await impronta(cfg.pin.sale + ':' + pin) === cfg.pin.hash); }
async function pinNuovo(pin){ const sale = esadecimale(crypto.getRandomValues(new Uint8Array(16))); return { sale, hash: await impronta(sale + ':' + pin), len: pin.length }; }

function TastierinoPin({lunghezza, onFatto, errore, bloccato}){
  const [cifre, setCifre] = useState('');
  useEffect(()=>{ if(errore) setCifre(''); }, [errore]);
  const premi = (c) => {
    if(bloccato) return;
    setCifre(p=>{
      const n = (p + c).slice(0, lunghezza);
      if(n.length === lunghezza) setTimeout(()=>{ onFatto(n); setCifre(''); }, 120);
      return n;
    });
  };
  const togli = () => setCifre(p=>p.slice(0, -1));
  useEffect(()=>{
    const k = e => { if(/^[0-9]$/.test(e.key)) premi(e.key); else if(e.key === 'Backspace') togli(); };
    document.addEventListener('keydown', k); return ()=>document.removeEventListener('keydown', k);
  });
  return (
    <>
      <div className={'pin-punti' + (errore ? ' errore' : '')} key={errore}>
        {Array.from({length: lunghezza}).map((_, i)=><span key={i} className={i < cifre.length ? 'on' : ''}></span>)}
      </div>
      <div className="pin-tasti">
        {['1','2','3','4','5','6','7','8','9'].map(c=><button key={c} onClick={()=>premi(c)}>{c}</button>)}
        <button className="vuoto" tabIndex={-1}></button>
        <button onClick={()=>premi('0')}>0</button>
        <button className="testo" onClick={togli}>Cancella</button>
      </div>
    </>
  );
}

function SchermoBlocco({cfg, onSblocca, onPassword}){
  const [msg, setMsg] = useState('');
  const [errore, setErrore] = useState(0);
  const [attesa, setAttesa] = useState(0);
  const tentativi = useRef(0);
  const conBio = async () => {
    try{ if(await bioVerifica(cfg.bio.id)) onSblocca(); }
    catch(e){ setMsg(cfg.pin ? 'Face ID / Touch ID non riuscito: usa il PIN.' : 'Face ID / Touch ID non riuscito: riprova.'); }
  };
  useEffect(()=>{
    try{ if(document.activeElement) document.activeElement.blur(); }catch(e){}   // niente tasti che finiscono nel documento sotto
    if(cfg.bio) conBio();
  }, []);
  useEffect(()=>{ if(!attesa) return; const t = setTimeout(()=>setAttesa(a=>Math.max(0, a - 1)), 1000); return ()=>clearTimeout(t); }, [attesa]);
  const provaPin = async (pin) => {
    if(await pinGiusto(cfg, pin)){ tentativi.current = 0; onSblocca(); return; }
    tentativi.current++; setErrore(x=>x + 1);
    if(tentativi.current >= 5){ setAttesa(30); tentativi.current = 0; setMsg('Troppi tentativi: aspetta 30 secondi.'); }
    else setMsg('PIN sbagliato.');
  };
  return (
    <div className="blocco">
      <div className="blocco-box">
        <h1>{APP_NOME}</h1>
        <p>{cfg.pin ? 'Inserisci il PIN per entrare' : 'Sblocca con Face ID / Touch ID'}</p>
        <div className="blocco-msg">{attesa ? `Riprova fra ${attesa} s` : msg}</div>
        {cfg.pin && <TastierinoPin lunghezza={cfg.pin.len || 4} onFatto={provaPin} errore={errore} bloccato={!!attesa}/>}
        {cfg.bio && <div style={{marginTop:18}}><button className="btn primary" onClick={conBio}>Usa Face ID / Touch ID</button></div>}
        <div><button className="blocco-link" onClick={onPassword}>Hai dimenticato il PIN? Esci e accedi con la password</button></div>
      </div>
    </div>
  );
}

function ImpostazioniBlocco({email, onClose}){
  const [cfg, setCfg] = useState(()=>local.get(BLOCCO_KEY) || {});
  const [bioOk, setBioOk] = useState(false);
  const [fase, setFase] = useState(null);      // null | 'nuovo' | 'conferma'
  const [primo, setPrimo] = useState('');
  const [lung, setLung] = useState(4);
  const [errore, setErrore] = useState(0);
  const [msg, setMsg] = useState('');
  useEffect(()=>{ bioDisponibile().then(setBioOk); }, []);
  const salva = (n) => { setCfg(n); local.set(BLOCCO_KEY, n); };
  const minuti = cfg.minuti === undefined ? 5 : cfg.minuti;
  const attivaBio = async () => {
    try{ const id = await bioRegistra(email); salva({...cfg, bio:{id}}); setMsg('Face ID / Touch ID attivo su questo dispositivo.'); }
    catch(e){ setMsg('Non sono riuscito ad attivare Face ID / Touch ID su questo dispositivo.'); }
  };
  const pinScelto = async (p) => {
    if(fase === 'nuovo'){ setPrimo(p); setFase('conferma'); setMsg(''); return; }
    if(p !== primo){ setErrore(x=>x + 1); setMsg('I due PIN non coincidono: ricomincia.'); setFase('nuovo'); setPrimo(''); return; }
    salva({...cfg, pin: await pinNuovo(p)}); setFase(null); setPrimo(''); setMsg('PIN salvato.');
  };
  if(fase) return (
    <div className="blocco" style={{zIndex:320}}>
      <div className="blocco-box">
        <h1>{fase === 'nuovo' ? 'Nuovo PIN' : 'Conferma il PIN'}</h1>
        <p>{fase === 'nuovo' ? `Scegli un PIN di ${lung} cifre` : 'Scrivilo di nuovo'}</p>
        {fase === 'nuovo' && <div style={{marginBottom:12}}>
          <button className={'btn sm' + (lung === 4 ? ' primary' : '')} onClick={()=>setLung(4)}>4 cifre</button>{' '}
          <button className={'btn sm' + (lung === 6 ? ' primary' : '')} onClick={()=>setLung(6)}>6 cifre</button></div>}
        <div className="blocco-msg">{msg}</div>
        <TastierinoPin key={fase + lung} lunghezza={lung} onFatto={pinScelto} errore={errore}/>
        <div><button className="blocco-link" onClick={()=>{ setFase(null); setMsg(''); }}>Annulla</button></div>
      </div>
    </div>
  );
  return (
    <div className="overlay" onMouseDown={e=>{ if(e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={{maxWidth:440}}>
        <h3>Blocco dell'app</h3>
        <div className="opz">
          <div><b>PIN</b><small>{cfg.pin ? `Attivo (${cfg.pin.len || 4} cifre)` : 'Non attivo'}</small></div>
          <div style={{display:'flex',gap:6}}>
            <button className="btn sm" onClick={()=>{ setFase('nuovo'); setMsg(''); }}>{cfg.pin ? 'Cambia' : 'Imposta'}</button>
            {cfg.pin && <button className="btn sm" onClick={()=>{ const n = {...cfg}; delete n.pin; salva(n); }}>Togli</button>}
          </div>
        </div>
        <div className="opz">
          <div><b>Face ID / Touch ID</b><small>{!bioOk ? 'Non disponibile su questo dispositivo o browser' : cfg.bio ? 'Attivo su questo dispositivo' : 'Non attivo'}</small></div>
          <div style={{display:'flex',gap:6}}>
            {bioOk && !cfg.bio && <button className="btn sm" onClick={attivaBio}>Attiva</button>}
            {cfg.bio && <button className="btn sm" onClick={()=>{ const n = {...cfg}; delete n.bio; salva(n); }}>Togli</button>}
          </div>
        </div>
        <div className="opz">
          <div><b>Blocca di nuovo</b><small>dopo che l'app è rimasta in secondo piano</small></div>
          <select value={minuti} onChange={e=>salva({...cfg, minuti: parseInt(e.target.value, 10)})} style={{width:'auto'}}>
            <option value={0}>subito</option><option value={1}>dopo 1 minuto</option><option value={5}>dopo 5 minuti</option>
            <option value={15}>dopo 15 minuti</option><option value={60}>dopo 1 ora</option>
          </select>
        </div>
        {msg && <div className="spazio-sub" style={{marginTop:10,color:'var(--accent)'}}>{msg}</div>}
        <div className="spazio-sub" style={{marginTop:12}}>Il blocco vale solo su questo dispositivo: su ogni telefono o computer va attivato una volta.
          Se dimentichi il PIN puoi sempre uscire e rientrare con la password.</div>
        <div className="modal-foot"><button className="btn primary" onClick={onClose}>Fatto</button></div>
      </div>
    </div>
  );
}

/* ═══════════ aggiornamento dell'app ═══════════ */
async function versioneOnline(){
  const t = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'}).then(r=>r.ok ? r.text() : '');
  const m = t.match(/window\.APP_VER\s*=\s*"([^"]*)"/);
  return m ? m[1] : null;
}

/* ═══════════════════════════════════════════════════════════════
   PRO LOCO — date, calendario, piani con i contenuti da pubblicare
   ═══════════════════════════════════════════════════════════════ */
const pad2 = n => String(n).padStart(2,'0');
const isoDi = d => d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
const oggiLoc = () => isoDi(new Date());
const dataDa = iso => { const p = String(iso||'').split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); };
const piuGiorni = (iso, n) => { const d = dataDa(iso); d.setDate(d.getDate() + n); return isoDi(d); };
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI_SETT = ['lun','mar','mer','gio','ven','sab','dom'];
const nomeGiorno = iso => dataDa(iso).toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
const giornoCorto = iso => { const d = dataDa(iso); return GIORNI_SETT[(d.getDay()+6)%7] + ' ' + pad2(d.getDate()) + '/' + pad2(d.getMonth()+1); };
const escHtml = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const coloreCanale = (nome) => {
  const c = CANALI.find(x=>x.n.toLowerCase() === String(nome||'').trim().toLowerCase());
  if(c) return c.c;
  const t = String(nome||'');
  if(!t.trim()) return '#7b8a83';
  let h = 0; for(let i=0;i<t.length;i++) h = (h*31 + t.charCodeAt(i)) % 9973;
  return COLORS[h % COLORS.length];
};

/* contenuti di un modello, con le date calcolate a partire dalla data di riferimento (evento o inizio) */
function contenutiDaModello(tpl, base){
  const m = MODELLI_PIANO[tpl] || MODELLI_PIANO.vuoto;
  const b = base || oggiLoc();
  return (m.contenuti || []).map(([g, titolo, canale, formato, ora])=>({
    id: uid(), titolo, data: piuGiorni(b, g), ora: ora || '', canale, formato, stato:'idea', responsabile:'', note:'', link:''
  }));
}
function azioniDaModello(tpl, base){
  const m = MODELLI_PIANO[tpl] || MODELLI_PIANO.vuoto;
  const b = base || oggiLoc();
  return (m.azioni || []).map(([g, testo])=>({ id: uid(), testo, note:'', responsabile:'', scadenza: piuGiorni(b, g), fatto:false, parentId:null }));
}

/* il calendario dei contenuti come tabella, per Word e PDF */
function pianoHtml(doc){
  const l = (doc.contenuti || []).slice().sort((a,b)=>((a.data||'9999')+(a.ora||'')).localeCompare((b.data||'9999')+(b.ora||'')));
  if(!l.length) return '';
  let h = '<h2>Calendario dei contenuti</h2><table class="grid"><tr><th>Quando</th><th>Canale</th><th>Contenuto</th><th>Formato</th><th>Stato</th><th>Chi</th></tr>';
  l.forEach(c=>{
    h += `<tr><td>${c.data ? giornoCorto(c.data) : '—'}${c.ora ? ' ' + escHtml(c.ora) : ''}</td><td>${escHtml(c.canale)}</td>`
      + `<td>${escHtml(c.titolo)}${c.note && c.note.trim() ? `<div class="note">${escHtml(c.note).replace(/\n/g,'<br>')}</div>` : ''}</td>`
      + `<td>${escHtml(c.formato)}</td><td>${escHtml(c.stato)}</td><td>${escHtml(c.responsabile)}</td></tr>`;
  });
  return h + '</table>';
}

/* ═══ calendario del mese: lo usano sia i piani sia la vista generale ═══ */
function CalMese({mese, onMese, voci, giorno, onGiorno, onVoce, onSposta, ro}){
  const [y, m] = mese.split('-').map(Number);
  const scarto = (new Date(y, m-1, 1).getDay() + 6) % 7;            // la settimana parte da lunedì
  const giorniMese = new Date(y, m, 0).getDate();
  const nSett = Math.ceil((scarto + giorniMese) / 7);
  const celle = [];
  for(let i = 0; i < nSett * 7; i++){
    const d = new Date(y, m-1, 1 - scarto + i);
    celle.push({iso: isoDi(d), n: d.getDate(), fuori: d.getMonth() !== m-1});
  }
  const perGiorno = {};
  voci.forEach(v=>{ if(v.data){ if(!perGiorno[v.data]) perGiorno[v.data] = []; perGiorno[v.data].push(v); } });
  Object.keys(perGiorno).forEach(k=>perGiorno[k].sort((a,b)=>(a.ora||'99').localeCompare(b.ora||'99')));
  const vaiMese = (d) => { const x = new Date(y, m-1+d, 1); onMese(x.getFullYear() + '-' + pad2(x.getMonth()+1)); };
  const oggi = oggiLoc();
  const [sopra, setSopra] = useState(null);
  return (
    <div>
      <div className="cal-head">
        <button className="btn sm" onClick={()=>vaiMese(-1)} title="Mese prima">‹</button>
        <h4>{MESI[m-1]} {y}</h4>
        <button className="btn sm" onClick={()=>vaiMese(1)} title="Mese dopo">›</button>
        <button className="btn sm ghost" onClick={()=>{ onMese(oggi.slice(0,7)); onGiorno(oggi); }}>Oggi</button>
      </div>
      <div className="cal-grid">
        {GIORNI_SETT.map(g=><div key={g} className="cal-dow">{g}</div>)}
        {celle.map(c=>{
          const l = perGiorno[c.iso] || [];
          return (
            <div key={c.iso} className={'cal-day' + (c.fuori ? ' fuori' : '') + (c.iso === oggi ? ' oggi' : '') + (c.iso === giorno ? ' sel' : '') + (sopra === c.iso ? ' drop' : '')}
              onClick={()=>onGiorno(c.iso)}
              onDragOver={e=>{ if(onSposta && !ro){ e.preventDefault(); if(sopra !== c.iso) setSopra(c.iso); } }}
              onDragLeave={()=>setSopra(s=>s === c.iso ? null : s)}
              onDrop={e=>{ e.preventDefault(); setSopra(null); const id = e.dataTransfer.getData('text/plain'); if(id && onSposta && !ro) onSposta(id, c.iso); }}>
              <span className="cal-n">{c.n}</span>
              {l.slice(0, 3).map(v=>(
                <button key={v.id} className={'cal-chip' + (v.fatto ? ' fatto' : '')} style={{'--cc': v.colore}}
                  draggable={!!onSposta && !ro && !v.fisso}
                  onDragStart={e=>{ e.dataTransfer.setData('text/plain', v.id); e.dataTransfer.effectAllowed = 'move'; }}
                  onClick={e=>{ e.stopPropagation(); onVoce(v); }}
                  title={(v.ora ? v.ora + ' · ' : '') + v.titolo + (v.sotto ? ' — ' + v.sotto : '')}>
                  {v.ora ? v.ora + ' ' : ''}{v.titolo}
                </button>
              ))}
              {l.length > 3 && <div className="cal-piu">+{l.length - 3} {l.length - 3 === 1 ? 'altro' : 'altri'}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* riga di un contenuto / di una voce del calendario */
function VoceRiga({colore, quando, titolo, sotto, stato, fatto, onClick}){
  return (
    <button className={'cont-riga' + (fatto ? ' fatto' : '')} onClick={onClick}>
      <span className="punto" style={{background: colore}}></span>
      <span className="quando">{quando}</span>
      <span className="cosa"><b>{titolo}</b>{sotto ? <span className="sotto">{sotto}</span> : null}</span>
      {stato ? <span className="stato">{stato}</span> : null}
    </button>
  );
}

/* scheda di un contenuto da pubblicare */
function ContenutoModal({iniziale, nuovo, onSave, onDelete, onDuplica, onClose, ro}){
  const [c, setC] = useState(iniziale);
  const set = (k, v) => setC(p=>({...p, [k]: v}));
  const salva = () => { if(!ro) onSave({...c, titolo: (c.titolo||'').trim()}); };
  return (
    <div className="overlay" onMouseDown={e=>{ if(e.target === e.currentTarget) onClose(); }}>
      <div className="modal largo">
        <h3>{nuovo ? 'Nuovo contenuto' : 'Contenuto'}</h3>
        <div className="f"><label>Cosa esce</label>
          <input autoFocus={nuovo} value={c.titolo} disabled={ro} placeholder="Es. Locandina ufficiale e programma" onChange={e=>set('titolo', e.target.value)}
            onKeyDown={e=>{ if(e.key === 'Enter') salva(); }}/></div>
        <div className="due-col">
          <div className="f"><label>Giorno di uscita</label><input type="date" value={c.data||''} disabled={ro} onChange={e=>set('data', e.target.value)}/></div>
          <div className="f"><label>Ora</label><input type="time" value={c.ora||''} disabled={ro} onChange={e=>set('ora', e.target.value)}/></div>
          <div className="f"><label>Canale</label>
            <input list="pl-canali" value={c.canale||''} disabled={ro} placeholder="Facebook, Instagram…" onChange={e=>set('canale', e.target.value)}/>
            <datalist id="pl-canali">{CANALI.map(x=><option key={x.n} value={x.n}/>)}</datalist></div>
          <div className="f"><label>Formato</label>
            <input list="pl-formati" value={c.formato||''} disabled={ro} placeholder="Post, storia, video…" onChange={e=>set('formato', e.target.value)}/>
            <datalist id="pl-formati">{FORMATI.map(x=><option key={x} value={x}/>)}</datalist></div>
          <div className="f"><label>Stato</label>
            <select value={c.stato||'idea'} disabled={ro} onChange={e=>set('stato', e.target.value)}>
              {STATI_CONT.map(s=><option key={s} value={s}>{s}</option>)}
            </select></div>
          <div className="f"><label>Chi se ne occupa</label><input value={c.responsabile||''} disabled={ro} placeholder="Nome" onChange={e=>set('responsabile', e.target.value)}/></div>
        </div>
        <div className="f"><label>Testo del post / note</label>
          <textarea rows={5} value={c.note||''} disabled={ro} placeholder="Il testo da pubblicare, gli hashtag, le foto da usare…" onChange={e=>set('note', e.target.value)}/></div>
        <div className="f"><label>Collegamento (grafica, cartella foto, post pubblicato)</label>
          <input value={c.link||''} disabled={ro} placeholder="https://" onChange={e=>set('link', e.target.value)}/>
          {/^https?:\/\//.test(c.link||'') && <div style={{marginTop:4}}><a className="link-btn" href={c.link} target="_blank" rel="noopener noreferrer">Apri il collegamento ↗</a></div>}
        </div>
        <div className="modal-foot">
          {!nuovo && !ro && <button className="btn danger" style={{marginRight:'auto'}} onClick={()=>{ if(confirm('Eliminare questo contenuto dal calendario?')) onDelete(); }}>Elimina</button>}
          {!nuovo && !ro && <button className="btn" onClick={()=>onDuplica(c)} title="Stesso contenuto su un altro canale o in un altro giorno">Duplica</button>}
          <button className="btn" onClick={onClose}>{ro ? 'Chiudi' : 'Annulla'}</button>
          {!ro && <button className="btn primary" onClick={salva}>Salva</button>}
        </div>
      </div>
    </div>
  );
}

/* ═══ il calendario dei contenuti di un piano ═══ */
function PianoContenuti({doc, onChange, ro}){
  const cont = doc.contenuti || [];
  const [vista, setVista] = useState(()=>local.get('proloco:vistaPiano') || 'mese');
  const [mese, setMese] = useState(()=>{
    const oggi = oggiLoc();
    const prossimo = cont.map(c=>c.data).filter(d=>d && d >= oggi).sort()[0];
    const primo = cont.map(c=>c.data).filter(Boolean).sort()[0];
    return (prossimo || primo || doc.data || oggi).slice(0, 7);
  });
  const [giorno, setGiorno] = useState(null);
  const [filtro, setFiltro] = useState('');
  const [modal, setModal] = useState(null);       // {c, nuovo}
  const [copiato, setCopiato] = useState(false);
  const scegliVista = (v) => { setVista(v); local.set('proloco:vistaPiano', v); };

  const nuovo = (data) => setModal({nuovo:true, c:{id:uid(), titolo:'', data: data || giorno || '', ora:'', canale:'', formato:'', stato:'idea', responsabile:'', note:'', link:''}});
  const salva = (c) => {
    const c2 = {...c}; Object.keys(c2).forEach(k=>{ if(c2[k] === undefined || c2[k] === null) c2[k] = ''; });
    onChange(cont.some(x=>x.id === c2.id) ? cont.map(x=>x.id === c2.id ? c2 : x) : [...cont, c2]);
    setModal(null);
    if(c2.data){ setMese(c2.data.slice(0,7)); setGiorno(c2.data); }
  };
  const sposta = (id, data) => { onChange(cont.map(x=>x.id === id ? {...x, data} : x)); setGiorno(data); };
  const spostaTutto = () => {
    const n = parseInt(prompt('Di quanti giorni sposto tutte le date? (es. 7 per una settimana dopo, -3 per tre giorni prima)', '7'), 10);
    if(!n || isNaN(n)) return;
    onChange(cont.map(x=>x.data ? {...x, data: piuGiorni(x.data, n)} : x));
  };

  const canali = Array.from(new Set(cont.map(c=>(c.canale||'').trim()).filter(Boolean)));
  const visti = filtro ? cont.filter(c=>(c.canale||'').trim() === filtro) : cont;
  const ordinati = visti.slice().sort((a,b)=>((a.data||'9999')+(a.ora||'')).localeCompare((b.data||'9999')+(b.ora||'')));
  const voci = visti.filter(c=>c.data).map(c=>({ id:c.id, data:c.data, ora:c.ora, titolo:c.titolo || '(senza titolo)', colore: coloreCanale(c.canale),
    fatto: c.stato === 'pubblicato', sotto: [c.canale, c.formato].filter(Boolean).join(' · ') }));
  const pubblicati = cont.filter(c=>c.stato === 'pubblicato').length;
  const oggi = oggiLoc();
  const inRitardo = cont.filter(c=>c.data && c.data < oggi && c.stato !== 'pubblicato').length;
  const prossimo = cont.filter(c=>c.data && c.data >= oggi && c.stato !== 'pubblicato').sort((a,b)=>a.data.localeCompare(b.data))[0];

  const testo = () => {
    const righe = [(doc.titolo || 'Piano') + ' — calendario dei contenuti', ''];
    ordinati.forEach(c=>{
      righe.push((c.data ? giornoCorto(c.data) : 'senza data') + (c.ora ? ' ' + c.ora : '') + ' — ' + [c.canale, c.formato].filter(Boolean).join(' · ')
        + (c.canale || c.formato ? ' — ' : '') + (c.titolo || '(senza titolo)') + (c.responsabile ? ' (' + c.responsabile + ')' : '') + (c.stato === 'pubblicato' ? ' ✓' : ''));
    });
    return righe.join('\n');
  };
  const copia = async () => {
    try{ await navigator.clipboard.writeText(testo()); setCopiato(true); setTimeout(()=>setCopiato(false), 2000); }
    catch(e){ alert('Il browser non mi lascia copiare: seleziona le righe dall\'elenco.'); }
  };
  const riga = (c) => (
    <VoceRiga key={c.id} colore={coloreCanale(c.canale)} fatto={c.stato === 'pubblicato'}
      quando={(c.data ? giornoCorto(c.data) : 'senza data') + (c.ora ? ' ' + c.ora : '')}
      titolo={c.titolo || '(senza titolo)'} sotto={[c.canale, c.formato, c.responsabile].filter(Boolean).join(' · ')}
      stato={c.stato} onClick={()=>setModal({c, nuovo:false})}/>
  );

  let ultimoMese = '';
  return (
    <div>
      <div className="riepilogo">
        {cont.length === 0 ? 'Ancora nessun contenuto: tocca un giorno del calendario per aggiungere il primo.'
          : <>{cont.length} contenut{cont.length === 1 ? 'o' : 'i'} · {pubblicati} pubblicat{pubblicati === 1 ? 'o' : 'i'}
              {inRitardo > 0 && <span style={{color:'var(--red)'}}> · {inRitardo} in ritardo</span>}
              {prossimo && <> · prossima uscita {giornoCorto(prossimo.data)}: {prossimo.titolo || '(senza titolo)'}</>}</>}
      </div>
      <div className="barra-az">
        <span className="seg">
          <button className={vista === 'mese' ? 'on' : ''} onClick={()=>scegliVista('mese')}>Mese</button>
          <button className={vista === 'elenco' ? 'on' : ''} onClick={()=>scegliVista('elenco')}>Elenco</button>
        </span>
        {!ro && <button className="btn sm primary" onClick={()=>nuovo()}>+ Contenuto</button>}
        <span className="spacer"></span>
        {cont.length > 0 && <button className="btn sm" onClick={copia} title="Copia il calendario come testo, da incollare su WhatsApp o in una mail">{copiato ? '✓ Copiato' : '⧉ Copia'}</button>}
        {!ro && cont.length > 0 && <button className="btn sm" onClick={spostaTutto} title="Se cambia la data dell'evento: sposta tutte le uscite di alcuni giorni">⇄ Sposta date</button>}
        {!ro && cont.length > 0 && <button className="btn sm" onClick={()=>{ if(confirm('Tolgo dal calendario tutti i ' + cont.length + ' contenuti di questo piano? Resta il piano vuoto, da riempire a mano.')) onChange([]); }}
          title="Toglie tutte le uscite di questo piano, per ripartire da un calendario vuoto">✕ Svuota</button>}
      </div>
      {canali.length > 1 && (
        <div className="filtri">
          <button className={!filtro ? 'on' : ''} onClick={()=>setFiltro('')}>Tutti i canali</button>
          {canali.map(n=><button key={n} className={filtro === n ? 'on' : ''} onClick={()=>setFiltro(filtro === n ? '' : n)}><i style={{background: coloreCanale(n)}}></i>{n}</button>)}
        </div>
      )}
      {vista === 'mese' ? (
        <>
          <CalMese mese={mese} onMese={setMese} voci={voci} giorno={giorno} ro={ro}
            onGiorno={g=>setGiorno(g === giorno ? null : g)}
            onVoce={v=>{ const c = cont.find(x=>x.id === v.id); if(c) setModal({c, nuovo:false}); }}
            onSposta={sposta}/>
          {giorno && (
            <div className="cal-giorno">
              <h5><span>{nomeGiorno(giorno)}</span>{!ro && <button className="btn sm" onClick={()=>nuovo(giorno)}>+ Aggiungi</button>}</h5>
              {ordinati.filter(c=>c.data === giorno).map(riga)}
              {!ordinati.some(c=>c.data === giorno) && <div className="spazio-sub" style={{padding:'4px 0 8px'}}>Niente in uscita questo giorno.</div>}
            </div>
          )}
          {ordinati.some(c=>!c.data) && (
            <div className="cal-giorno">
              <h5><span>Senza data</span></h5>
              {ordinati.filter(c=>!c.data).map(riga)}
            </div>
          )}
        </>
      ) : (
        <div>
          {ordinati.length === 0 && <div className="empty"><strong>Nessun contenuto</strong>Aggiungine uno con il pulsante qui sopra.</div>}
          {ordinati.map(c=>{
            const mm = c.data ? c.data.slice(0,7) : 'senza';
            const testa = mm !== ultimoMese;
            ultimoMese = mm;
            return (
              <div key={c.id}>
                {testa && <div className="cont-mese">{c.data ? MESI[parseInt(c.data.slice(5,7),10)-1] + ' ' + c.data.slice(0,4) : 'Senza data'}</div>}
                {riga(c)}
              </div>
            );
          })}
        </div>
      )}
      {modal && <ContenutoModal iniziale={modal.c} nuovo={modal.nuovo} ro={ro} onClose={()=>setModal(null)} onSave={salva}
        onDelete={()=>{ onChange(cont.filter(x=>x.id !== modal.c.id)); setModal(null); }}
        onDuplica={(c)=>{ const copia2 = {...c, id:uid(), stato:'idea'}; onChange([...cont.map(x=>x.id === c.id ? c : x), copia2]); setModal({c:copia2, nuovo:false}); }}/>}
    </div>
  );
}

/* ═══ calendario generale: contenuti, riunioni, eventi e scadenze di tutti i documenti ═══ */
const TIPI_VOCE = [['contenuti','Contenuti da pubblicare','#2b5d80'], ['eventi','Eventi e lanci','#a33c34'], ['riunioni','Riunioni','#2f6f4e'], ['attivita','Scadenze delle attività','#a86a1f']];
function VistaCalendario({documenti, sezioni, onApri, saveDoc, ro}){
  const [mese, setMese] = useState(()=>oggiLoc().slice(0,7));
  const [giorno, setGiorno] = useState(()=>oggiLoc());
  const [spenti, setSpenti] = useState(()=>local.get('proloco:calSpenti') || {});
  const alterna = (k) => setSpenti(p=>{ const n = {...p, [k]: !p[k]}; local.set('proloco:calSpenti', n); return n; });
  const voci = useMemo(()=>{
    const out = [];
    Object.values(documenti).forEach(d=>{
      if(d.cestinato || d.archiviato) return;
      if(d.tipo === 'riunione' && d.data)
        out.push({id:'r|'+d.id, k:'riunioni', data:d.data, ora:d.ora||'', titolo:d.titolo || 'Riunione', colore:'#2f6f4e', doc:d, fatto:d.stato === 'svolta', sotto:d.luogo || ''});
      if(d.tipo === 'piano' && d.data)
        out.push({id:'e|'+d.id, k:'eventi', data:d.data, ora:'', titolo:'★ ' + (d.titolo || 'Evento'), colore:'#a33c34', doc:d, fatto:d.stato === 'concluso', sotto:'data dell\'evento / lancio'});
      if(d.tipo === 'piano') (d.contenuti||[]).forEach(c=>{
        if(c.data) out.push({id:'c|'+d.id+'|'+c.id, k:'contenuti', data:c.data, ora:c.ora||'', titolo:c.titolo || '(senza titolo)', colore: coloreCanale(c.canale), doc:d,
          fatto:c.stato === 'pubblicato', sotto:[c.canale, c.formato, d.titolo].filter(Boolean).join(' · ')});
      });
      (d.azioni||[]).forEach(a=>{
