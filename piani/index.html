    // senza fuoco sull'editor la tastiera non arriva: frecce, F2 ed Esc resterebbero muti
    try{
      ref.current.focus({preventScroll:true});
      const sel = window.getSelection();
      if(sel) sel.removeAllRanges();
    }catch(err){}
  };

  const [multi,setMulti] = useState(false);   // ogni tocco aggiunge alla selezione
  const trascina = useRef(false);
  useEffect(()=>{
    const stop = () => { trascina.current = false; };
    document.addEventListener('mouseup', stop);
    document.addEventListener('touchend', stop);
    return ()=>{ document.removeEventListener('mouseup', stop); document.removeEventListener('touchend', stop); };
  },[]);

  const cellaDaPunto = (x, y) => {
    const el = document.elementFromPoint(x, y);
    const td = el && el.closest && el.closest('td,th');
    return (td && ref.current && ref.current.contains(td)) ? td : null;
  };
  const estendiFinoA = (td) => {
    if(!td || !attivaRef.current) return;
    selRef.current = rettangolo(attivaRef.current, td);
    disegnaSel();
  };

  const entraInModifica = (td) => {
    const cella = td || cellaCorrente();
    if(!cella) return;
    if(inModifica.current && inModifica.current !== cella) chiudiModifica();
    // dentro la cella si scrive la formula, non il risultato
    if(cella.hasAttribute('data-f')) cella.textContent = cella.getAttribute('data-f');
    inModifica.current = cella;
    setMulti(false);
    setModo('edit'); applicaModo('edit', cella);
    tuttiTd().forEach(x=>x.classList.remove('cella-sel','cella-attiva'));
    selRef.current = [cella]; attivaRef.current = cella; fuocoRef.current = cella; cellaRef.current = cella;
    setTimeout(()=>{ cella.focus(); vaiA(cella); }, 0);
  };
  const tornaInSelezione = () => {
    chiudiModifica();
    const cella = cellaRef.current;
    setModo('sel'); applicaModo('sel');
    if(cella && cella.isConnected){ selRef.current = [cella]; attivaRef.current = cella; fuocoRef.current = cella; disegnaSel(); posizionaBox(cella); }
    ref.current.focus();
  };

  /* ═══ dove mettere i comandi della tabella ═══
     Mai sopra le celle: prima provo nello spazio libero sopra la tabella, poi sotto;
     se la tabella è più alta dello schermo resta agganciata sotto la barra degli strumenti.
     L'altezza è quella vera del riquadro (va a capo su più righe), non una stima. */
  const boxRef = useRef(null);
  const cellaBoxRef = useRef(null);
  const posizionaBox = (cell) => {
    const tab = cell && cell.closest('table');
    if(!tab || !wrapRef.current){ setTblBox(null); return; }
    cellaBoxRef.current = cell;
    const t = tab.getBoundingClientRect();
    const w = wrapRef.current.getBoundingClientRect();
    const h = boxRef.current ? boxRef.current.offsetHeight : 44;
    const barra = wrapRef.current.parentNode && wrapRef.current.parentNode.querySelector('.rt-tools');
    const tetto = barra ? barra.getBoundingClientRect().bottom : 0;   // sotto qui si vede davvero
    const fondo = window.innerHeight;
    let top;
    if(t.top - h - 8 >= tetto) top = t.top - w.top - h - 6;                 // sopra la tabella
    else if(t.bottom + h + 8 <= fondo) top = t.bottom - w.top + 6;          // sotto la tabella
    else {
      // tabella più alta dello schermo: niente riquadro sopra le celle, la barra si aggancia in fondo allo schermo
      setTblBox({ dock:true, left: Math.max(4, w.left), width: Math.min(w.width, window.innerWidth - 8), h });
      return;
    }
    setTblBox({ top, left: Math.max(0, t.left - w.left), h });
  };
  // appena disegnato conosco l'altezza vera: se era diversa da quella usata, ricalcolo
  React.useLayoutEffect(()=>{
    if(!tblBox || !boxRef.current) return;
    if(Math.abs(boxRef.current.offsetHeight - tblBox.h) > 1 && cellaBoxRef.current && cellaBoxRef.current.isConnected)
      posizionaBox(cellaBoxRef.current);
  });

  // mentre scorro la pagina (o cambia la barra degli strumenti) ricalcolo dove stanno i comandi della tabella
  useEffect(()=>{
    if(!tblBox) return;
    let raf = 0;
    const h = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(()=>{
      if(cellaBoxRef.current && cellaBoxRef.current.isConnected) posizionaBox(cellaBoxRef.current); }); };
    window.addEventListener('scroll', h, true); window.addEventListener('resize', h);
    const t = setTimeout(h, 120);
    return ()=>{ cancelAnimationFrame(raf); clearTimeout(t); window.removeEventListener('scroll', h, true); window.removeEventListener('resize', h); };
  }, [!!tblBox, tblBox && tblBox.dock]);

  const checkCtx = () => {
    if(modo === 'sel'){
      const a = cellaCorrente();
      if(a){ setInTable(true); posizionaBox(a); }
      return;
    }
    const cell = cellFromSelection();
    if(cell) cellaRef.current = cell;
    setInTable(!!cell);
    if(!cell){ setTblBox(null); return; }
    posizionaBox(cell);
  };

  /* spostarsi tra le celle come in un foglio di calcolo */
  const celleDi = (tab) => Array.from(tab.querySelectorAll('tr'));
  const vaiA = (cell) => {
    if(!cell) return;
    const r = document.createRange();
    r.selectNodeContents(cell); r.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
    cell.scrollIntoView({block:'nearest', inline:'nearest'});
    setTimeout(checkCtx, 0);
  };
  const nuovaRigaIn = (tab, modello) => {
    const tr = document.createElement('tr');
    const quante = grigliaDi(tab).nCol || modello.children.length;   // le celle unite valgono più colonne
    for(let i=0;i<quante;i++){ const td=document.createElement('td'); td.innerHTML='<br>'; tr.appendChild(td); }
    let corpo = tab.querySelector('tbody');
    if(!corpo){ corpo = document.createElement('tbody'); tab.appendChild(corpo); }
    corpo.appendChild(tr);
    emit();
    return tr;
  };
  /* il cursore è all'inizio o alla fine del contenuto della cella? */
  const aiBordi = (cell) => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return {inizio:false, fine:false};
    const r = sel.getRangeAt(0);
    const tutto = document.createRange();
    tutto.selectNodeContents(cell);
    const inizio = r.collapsed && r.compareBoundaryPoints(Range.START_TO_START, tutto) <= 0;
    const fine = r.collapsed && r.compareBoundaryPoints(Range.END_TO_END, tutto) >= 0;
    return {inizio, fine};
  };

  /* unisci le celle selezionate (stessa riga) e dividi */
  const unisciCelle = () => {
    const celle = celleCoinvolte();
    if(celle.length < 2){
      alert('Servono almeno due celle. Clicca la prima, poi tieni Maiusc e clicca l\'ultima (oppure Ctrl per sceglierle una a una).');
      return;
    }
    const tab = celle[0].closest('table');
    if(!celle.every(c=>c.closest('table') === tab)){ alert('Le celle devono stare nella stessa tabella.'); return; }
    const righe = Array.from(tab.querySelectorAll('tr'));
    const pos = celle.map(c=>({
      c,
      r: righe.indexOf(c.parentNode),
      k: Array.prototype.indexOf.call(c.parentNode.children, c)
    }));
    const r0 = Math.min(...pos.map(p=>p.r)), r1 = Math.max(...pos.map(p=>p.r));
    const k0 = Math.min(...pos.map(p=>p.k)), k1 = Math.max(...pos.map(p=>p.k));
    const attese = (r1-r0+1) * (k1-k0+1);
    if(celle.length !== attese){ alert('Seleziona un blocco rettangolare di celle.'); return; }

    const prima = pos.find(p=>p.r===r0 && p.k===k0).c;
    const testi = pos.sort((a,b)=>a.r-b.r || a.k-b.k)
      .map(p=>p.c.innerHTML.replace(/^<br>$/,'').trim()).filter(Boolean);
    prima.innerHTML = testi.length ? testi.join(' ') : '<br>';
    prima.colSpan = k1 - k0 + 1;
    prima.rowSpan = r1 - r0 + 1;
    pos.forEach(p=>{ if(p.c !== prima) p.c.remove(); });
    puliscoSel();
    emit(true);
    selezionaCella(prima);
  };
  const dividiCella = () => {
    const c = cellaCorrente() || cellaAttiva(); if(!c) return;
    const nc = c.colSpan || 1, nr = c.rowSpan || 1;
    if(nc < 2 && nr < 2){ alert('Questa cella non è unita.'); return; }
    const tab = c.closest('table');
    const righe = Array.from(tab.querySelectorAll('tr'));
    const r0 = righe.indexOf(c.parentNode);
    const k0 = Array.prototype.indexOf.call(c.parentNode.children, c);
    const crea = () => { const td = document.createElement(c.tagName === 'TH' ? 'th' : 'td'); td.innerHTML='<br>'; return td; };
    c.colSpan = 1; c.rowSpan = 1;
    for(let i=1;i<nc;i++) c.parentNode.insertBefore(crea(), c.nextSibling);   // colonne nella stessa riga
    for(let r=r0+1; r<r0+nr; r++){                                            // righe sotto
      const tr = righe[r];
      if(!tr) continue;
      for(let i=0;i<nc;i++) tr.insertBefore(crea(), tr.children[k0] || null);
    }
    emit(true); selezionaCella(c);
  };

  /* copia formato: prende l'aspetto di una cella e lo applica alle altre */
  const [fmtPreso,setFmtPreso] = useState(false);
  const fmtRef = useRef(null);
  const copiaFormato = () => {
    const c = cellaCorrente() || cellaAttiva();
    if(!c){ alert('Scegli prima la cella di cui copiare il formato.'); return; }
    fmtRef.current = {
      backgroundColor: c.style.backgroundColor || '',
      width: c.style.width || '',
      textAlign: c.style.textAlign || '',
      fontWeight: c.style.fontWeight || '',
      fontStyle: c.style.fontStyle || '',
      color: c.style.color || ''
    };
    setFmtPreso(true);
  };
  const incollaFormato = () => {
    if(!fmtRef.current){ copiaFormato(); return; }
    const dest = celleCoinvolte();
    if(!dest.length){ alert('Scegli le celle a cui applicare il formato.'); return; }
    dest.forEach(td=>{
      Object.entries(fmtRef.current).forEach(([k,v])=>{
        if(v) td.style[k] = v;
        else td.style.removeProperty(k.replace(/[A-Z]/g, m=>'-'+m.toLowerCase()));
      });
    });
    emit(true); setFmtPreso(false);
  };

  /* appunti delle celle: matrice di testi, come in un foglio di calcolo */
  const appunti = useRef(null);
  const appuntiHtml = useRef('');
  const matriceDa = (celle) => {
    const perRiga = new Map();
    celle.forEach(td=>{
      const tr = td.parentNode;
      if(!perRiga.has(tr)) perRiga.set(tr, []);
      perRiga.get(tr).push(td);
    });
    return Array.from(perRiga.values()).map(riga=>riga.map(td=>td.textContent));
  };
  /* ricostruisce una vera tabella con le celle scelte, stili compresi */
  const tabellaHtmlDa = (celle) => {
    if(!celle.length) return '';
    const tab = celle[0].closest('table');
    if(!tab) return '';
    const insieme = new Set(celle);
    const righe = [];
    Array.from(tab.querySelectorAll('tr')).forEach(tr=>{
      const dentro = Array.from(tr.children).filter(td=>insieme.has(td));
      if(!dentro.length) return;
      righe.push('<tr>' + dentro.map(td=>{
        const tag = td.tagName.toLowerCase();
        const st = td.getAttribute('style');
        const cs = (td.colSpan||1) > 1 ? ` colspan="${td.colSpan}"` : '';
        const rs = (td.rowSpan||1) > 1 ? ` rowspan="${td.rowSpan}"` : '';
        return `<${tag}${st?` style="${st}"`:''}${cs}${rs}>${td.innerHTML}</${tag}>`;
      }).join('') + '</tr>');
    });
    return '<table style="border-collapse:collapse">' +
      '<tbody>' + righe.join('') + '</tbody></table>';
  };

  const copiaCelle = (taglia) => {
    const celle = celleCoinvolte();
    if(!celle.length) return false;
    const m = matriceDa(celle);
    appunti.current = m;
    appuntiHtml.current = tabellaHtmlDa(celle);
    const testo = m.map(r=>r.join('\t')).join('\n');
    // negli appunti metto sia la tabella sia il testo a colonne: Word ed Excel prendono ciascuno il suo
    try{
      if(navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem !== 'undefined'){
        navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([appuntiHtml.current], {type:'text/html'}),
          'text/plain': new Blob([testo], {type:'text/plain'})
        })]).catch(()=>{ try{ navigator.clipboard.writeText(testo); }catch(e2){} });
      } else if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(testo);
      }
    }catch(err){}
    if(taglia){ celle.forEach(td=>{ td.innerHTML = '<br>'; }); emit(true); }
    return true;
  };
  const incollaCelle = (matrice) => {
    const partenza = cellaCorrente() || cellFromSelection();
    if(!partenza || !matrice || !matrice.length) return false;
    const tab = partenza.closest('table');
    const righe = Array.from(tab.querySelectorAll('tr'));
    const r0 = righe.indexOf(partenza.parentNode);
    const c0 = Array.prototype.indexOf.call(partenza.parentNode.children, partenza);
    matrice.forEach((riga, i)=>{
      const tr = righe[r0 + i];
      if(!tr) return;                       // non allargo la tabella da solo
      riga.forEach((val, j)=>{
        const td = tr.children[c0 + j];
        if(td) td.textContent = val;
      });
    });
    emit(true);
    return true;
  };

  /* tasti quando si è "sopra" le celle, senza cursore dentro */
  const tastiSelezione = (e) => {
    const cell = cellaCorrente();
    if(!cell) return false;
    const tab = cell.closest('table');
    const riga = cell.parentNode;
    const righe = Array.from(tab.querySelectorAll('tr'));
    const gr = grigliaDi(tab);
    const qui = gr.dove.get(cell) || {r:0, c:0, rs:1, cs:1};
    const ri = qui.r, ci = qui.c;

    const vaiCella = (r, c, estendi) => {
      let td = cellaIn(gr, r, c);
      if(!td && r >= 0 && r < gr.nRighe){          // riga più corta: prendo la cella più vicina
        for(let k=Math.min(c, gr.nCol-1); k>=0 && !td; k--) td = cellaIn(gr, r, k);
      }
      if(!td || td === cell) return false;
      selezionaCella(td, {estendi});
      td.scrollIntoView({block:'nearest', inline:'nearest'});
      return true;
    };

    if(e.key === 'F2'){ e.preventDefault(); entraInModifica(cell); return true; }
    if(e.key === 'Enter'){
      e.preventDefault();
      vaiCella(ri + qui.rs, ci);                // scende alla riga successiva
      return true;
    }
    if(e.key === 'Escape'){
      e.preventDefault();
      if(fmtTPresoRef.current){ spegniPennello(); return true; }   // prima spengo il pennello
      puliscoSel(); setInTable(false); setTblBox(null); return true;
    }

    const salto = e.ctrlKey || e.metaKey;   // Ctrl/Cmd: fino al bordo, come nel foglio di calcolo
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(salto) return vaiCella(gr.nRighe-1, ci, e.shiftKey) || true;
      vaiCella(ri + qui.rs, ci, e.shiftKey);      // scavalco la parte unita
      return true;
    }
    if(e.key === 'ArrowUp'){
      e.preventDefault();
      vaiCella(salto ? 0 : ri-1, ci, e.shiftKey); return true;
    }
    if(e.key === 'ArrowRight'){
      e.preventDefault();
      if(salto) return vaiCella(ri, gr.nCol-1, e.shiftKey) || true;
      if(!vaiCella(ri, ci + qui.cs, e.shiftKey)) vaiCella(ri + qui.rs, 0, e.shiftKey);
      return true;
    }
    if(e.key === 'ArrowLeft'){
      e.preventDefault();
      if(salto) return vaiCella(ri, 0, e.shiftKey) || true;
      if(!vaiCella(ri, ci-1, e.shiftKey)) vaiCella(ri-1, gr.nCol-1, e.shiftKey);
      return true;
    }

    if(e.key === 'Tab'){
      e.preventDefault();
      if(e.shiftKey){ if(!vaiCella(ri, ci-1)) vaiCella(ri-1, gr.nCol-1); }
      else if(!vaiCella(ri, ci + qui.cs) && !vaiCella(ri + qui.rs, 0)){
        const nr = nuovaRigaIn(tab, riga); selezionaCella(nr.children[0]);
      }
      return true;
    }

    if(e.key === 'Delete' || e.key === 'Backspace'){
      e.preventDefault();
      celleCoinvolte().forEach(td=>{ td.innerHTML = '<br>'; });
      emit(); return true;
    }

    if((e.ctrlKey || e.metaKey) && rigaOColonna(e)){ e.preventDefault(); return true; }
    if((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')){
      e.preventDefault(); e.shiftKey ? ripeti() : annulla(); return true;
    }
    if(e.altKey && (e.key === 'o' || e.key === 'O' || e.code === 'KeyO')){
      e.preventDefault(); pennelloDaTasto(); return true;
    }
    if((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.key === 'C')){
      e.preventDefault(); copiaFormatoTesto(); return true;
    }
    if((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'v' || e.key === 'V')){
      e.preventDefault(); incollaFormatoTesto(); return true;
    }
    if((e.ctrlKey || e.metaKey) && !e.altKey && 'biu'.indexOf((e.key||'').toLowerCase()) >= 0){
      e.preventDefault();
      const k = e.key.toLowerCase();
      cmd(k === 'b' ? 'bold' : k === 'i' ? 'italic' : 'underline');
      return true;
    }
    if((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')){
      e.preventDefault(); copiaCelle(false); return true;
    }
    if((e.ctrlKey || e.metaKey) && (e.key === 'x' || e.key === 'X')){
      e.preventDefault(); copiaCelle(true); return true;
    }
    if((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')){
      // lascio fare al browser: arriva l'evento di incolla, gestito più sotto
      if(appunti.current){ e.preventDefault(); incollaCelle(appunti.current); return true; }
      return false;
    }
    if((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')){
      e.preventDefault();
      selRef.current = Array.from(tab.querySelectorAll('td,th'));
      disegnaSel(); return true;
    }

    /* come in Excel: iniziare a scrivere sostituisce il contenuto */
    if(e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault();
      inModifica.current = null;
      cell.removeAttribute('data-f');
      cell.innerHTML = '';
      entraInModifica(cell);
      setTimeout(()=>{ document.execCommand('insertText', false, e.key); emit(); }, 10);
      return true;
    }
    return false;
  };

  useEffect(()=>{
    if(modo !== 'sel') return;
    const h = (e) => {
      if(!attivaRef.current || !attivaRef.current.isConnected) return;
      const t = e.target;
      if(t && t.closest && t.closest('input,textarea,select')) return;   // sto scrivendo altrove
      if(t && t.closest && t.closest('.modal')) return;
      if(tastiSelezione(e)) e.stopPropagation();
    };
    document.addEventListener('keydown', h, true);
    return ()=>document.removeEventListener('keydown', h, true);
  },[modo]);

  const navigaTabella = (e) => {
    const cell = cellFromSelection();
    if(!cell) return false;
    if(e.key === 'Escape' || e.key === 'F2'){ e.preventDefault(); tornaInSelezione(); return true; }
    if((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')){
      e.preventDefault();                                  // seleziona tutta la tabella, non il testo
      const tutte = Array.from(cell.closest('table').querySelectorAll('td,th'));
      setModo('sel'); applicaModo('sel');
      selRef.current = tutte; attivaRef.current = cell; fuocoRef.current = cell;
      disegnaSel(); setInTable(true); posizionaBox(cell);
      try{ ref.current.focus({preventScroll:true}); const s0=window.getSelection(); if(s0) s0.removeAllRanges(); }catch(err){}
      return true;
    }
    const tab = cell.closest('table');
    const riga = cell.parentNode;
    const righe = celleDi(tab);
    const gr = grigliaDi(tab);
    const qui = gr.dove.get(cell) || {r:0, c:0, rs:1, cs:1};
    const ri = qui.r, ci = qui.c;
    // cerca la cella nella posizione indicata; se lì non c'è (riga più corta) prende la più vicina a sinistra
    const cellaVicina = (r, c) => {
      if(r < 0 || r >= gr.nRighe) return null;
      for(let k = Math.min(c, gr.nCol-1); k >= 0; k--){
        const td = cellaIn(gr, r, k);
        if(td && td !== cell) return td;
      }
      for(let k = c+1; k < gr.nCol; k++){
        const td = cellaIn(gr, r, k);
        if(td && td !== cell) return td;
      }
      return null;
    };

    if(e.key === 'Tab'){
      e.preventDefault();
      if(e.shiftKey){
        const prec = cellaIn(gr, ri, ci-1) || cellaVicina(ri-1, gr.nCol-1);
        if(prec) selezionaCella(prec);          // confermo e mi sposto: cella selezionata, non aperta
      } else {
        let succ = cellaIn(gr, ri, ci + qui.cs) || cellaIn(gr, ri + qui.rs, 0);
        if(!succ) succ = nuovaRigaIn(tab, riga).children[0];   // in fondo: nuova riga
        selezionaCella(succ);
      }
      return true;
    }
    if(e.key === 'Enter' && e.shiftKey){
      e.preventDefault();
      document.execCommand('insertLineBreak');   // Maiusc+Invio: a capo dentro la cella
      emit();
      return true;
    }
    if(e.key === 'Enter'){
      e.preventDefault();
      const sotto = cellaIn(gr, ri + qui.rs, ci) || cellaVicina(ri + qui.rs, ci);
      if(sotto) selezionaCella(sotto);           // conferma e scende, con la cella selezionata
      else tornaInSelezione();                   // ultima riga: confermo e resto qui
      return true;
    }

    /* frecce su e giù: cambio cella, come in un foglio di calcolo */
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      const giu = e.key === 'ArrowDown';
      const r = giu ? ri + qui.rs : ri - 1;
      const td = cellaIn(gr, r, ci) || cellaVicina(r, ci);
      if(td){ e.preventDefault(); selezionaCella(td); return true; }
      return false;   // fuori dalla tabella lascio fare al browser
    }

    /* frecce destra e sinistra: nel testo, e cambiano cella quando sono al bordo */
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      const b = aiBordi(cell);
      if(e.key === 'ArrowRight' && b.fine){
        const succ = cellaIn(gr, ri, ci + qui.cs) || cellaIn(gr, ri + qui.rs, 0);
        if(succ){ e.preventDefault(); selezionaCella(succ); return true; }
      }
      if(e.key === 'ArrowLeft' && b.inizio){
        const prec = cellaIn(gr, ri, ci-1) || cellaVicina(ri-1, gr.nCol-1);
        if(prec){ e.preventDefault(); selezionaCella(prec); return true; }
      }
      return false;
    }

    /* Ctrl/Cmd con + e −: righe; con Maiusc o Alt: colonne */
    if((e.ctrlKey || e.metaKey) && rigaOColonna(e)){ e.preventDefault(); return true; }

    return false;
  };

  /* Ctrl/Cmd con + e −: righe; con Maiusc (o Alt) colonne. Valgono per tutte le righe/colonne scelte.
     Se la selezione copre colonne intere (tutte le righe), capisce da solo che vuoi le colonne.
     Il + inserisce sopra / a sinistra della selezione, come in Excel. */
  const rigaOColonna = (e) => {
    const piu  = ['+','=','*'].indexOf(e.key) >= 0 || ['NumpadAdd','Equal','BracketRight'].indexOf(e.code) >= 0;
    const meno = ['-','_'].indexOf(e.key) >= 0 || ['NumpadSubtract','Minus','Slash'].indexOf(e.code) >= 0;
    if(!piu && !meno) return false;
    let colonna = e.shiftKey || e.altKey;
    if(!colonna){ const z = zonaScelta(); if(z && z.colIntere && !z.righeIntere) colonna = true; }
    if(colonna){ piu ? addCol(true) : delCol(); } else { piu ? addRow(true) : delRow(); }
    return true;
  };

  const insertTable = () => {
    const r = parseInt(prompt('Quante righe? (esclusa l\'intestazione)','3'),10);
    if(!r || r<1) return;
    const c = parseInt(prompt('Quante colonne?','3'),10);
    if(!c || c<1) return;
    let h = '<table><thead><tr>';
    for(let j=0;j<c;j++) h += '<th>Colonna '+(j+1)+'</th>';
    h += '</tr></thead><tbody>';
    for(let i=0;i<r;i++){ h += '<tr>'; for(let j=0;j<c;j++) h += '<td><br></td>'; h += '</tr>'; }
    h += '</tbody></table><p><br></p>';
    cmd('insertHTML', h);
  };

  const cellaAttiva = () => cellFromSelection() || (cellaRef.current && cellaRef.current.isConnected ? cellaRef.current : null);

  /* righe e colonne: valgono per tutte le righe/colonne della selezione (più celle scelte = più righe/colonne) */
  const zonaScelta = () => {
    const vive = modo === 'sel' ? selRef.current.filter(td=>td.isConnected) : [];
    const att = cellaAttiva();
    const base = vive.length ? vive : (att ? [att] : []);
    if(!base.length) return null;
    const tab = base[0].closest('table'); if(!tab) return null;
    const gr = grigliaDi(tab);
    let r0 = 1e9, r1 = -1, c0 = 1e9, c1 = -1;
    base.forEach(td=>{ const d = gr.dove.get(td); if(!d) return;
      r0 = Math.min(r0, d.r); r1 = Math.max(r1, d.r + d.rs - 1); c0 = Math.min(c0, d.c); c1 = Math.max(c1, d.c + d.cs - 1); });
    if(r1 < 0) return null;
    const nHead = tab.querySelectorAll('thead tr').length;
    return { tab, gr, r0, r1, c0, c1, nHead,
      righeIntere: c0 === 0 && c1 >= gr.nCol - 1,
      colIntere: r0 <= nHead && r1 >= gr.nRighe - 1 };
  };
  const dopoRigheColonne = (tab, r, c) => {
    emit();
    if(!tab.isConnected){ cellaRef.current = null; setInTable(false); setTblBox(null); return; }
    const gr = grigliaDi(tab);
    const td = cellaIn(gr, Math.max(0, Math.min(r, gr.nRighe - 1)), Math.max(0, Math.min(c, gr.nCol - 1)));
    if(!td){ setTblBox(null); return; }
    if(modo === 'sel') selezionaCella(td); else vaiA(td);
  };
  const addRow = (sopra) => {
    const z = zonaScelta(); if(!z) return;
    const {tab, gr, nHead} = z;
    const n = Math.max(1, z.r1 - Math.max(z.r0, nHead) + 1);
    const righe = Array.from(tab.querySelectorAll('tr'));
    // dove inserisco: sotto la selezione (pulsante) o sopra (come in Excel, con Ctrl/Cmd +)
    let at = sopra ? z.r0 : z.r1 + 1;
    if(at < nHead) at = nHead;
    let body = tab.querySelector('tbody');
    if(!body){ body = document.createElement('tbody'); tab.appendChild(body); }
    const prima = righe[at] && righe[at].parentNode.tagName !== 'THEAD' ? righe[at] : null;
    const allargate = new Set();
    const nuove = [];
    for(let k=0;k<n;k++){
      const tr = document.createElement('tr');
      for(let c=0;c<gr.nCol;c++){
        const su = cellaIn(gr, at - 1, c), giu = cellaIn(gr, at, c);
        if(su && su === giu){              // cella unita che attraversa il punto: la allungo
          if(!allargate.has(su)){ su.rowSpan = (su.rowSpan || 1) + n; allargate.add(su); }
          continue;
        }
        const td = document.createElement('td'); td.innerHTML = '<br>'; tr.appendChild(td);
      }
      nuove.push(tr);
    }
    nuove.forEach(tr=>{ if(prima) prima.parentNode.insertBefore(tr, prima); else body.appendChild(tr); });
    dopoRigheColonne(tab, at, z.c0);
  };
  const delRow = () => {
    const z = zonaScelta(); if(!z) return;
    const {tab, gr, nHead} = z;
    const a = Math.max(z.r0, nHead), b = z.r1;
    if(b < a){ alert('L\'intestazione non si elimina.'); return; }
    if(a === nHead && b >= gr.nRighe - 1){
      if(confirm('Hai scelto tutte le righe: elimino tutta la tabella?')){ tab.remove(); dopoRigheColonne(tab, 0, 0); }
      return;
    }
    gr.dove.forEach((d, td)=>{                // celle unite che entrano nelle righe tolte: le accorcio
      if(d.rs > 1 && d.r < a && d.r + d.rs - 1 >= a){
        const fuori = Math.min(b, d.r + d.rs - 1) - a + 1;
        td.rowSpan = d.rs - fuori;
      }
    });
    const righe = Array.from(tab.querySelectorAll('tr'));
    for(let r=a; r<=b; r++) if(righe[r]) righe[r].remove();
    dopoRigheColonne(tab, a, z.c0);
  };
  const addCol = (sinistra) => {
    const z = zonaScelta(); if(!z) return;
    const {tab, gr} = z;
    const n = z.c1 - z.c0 + 1;
    const at = sinistra ? z.c0 : z.c1 + 1;    // a destra della selezione (pulsante) o a sinistra (Ctrl/Cmd +)
    const righe = Array.from(tab.querySelectorAll('tr'));
    const allargate = new Set();
    righe.forEach((tr, r)=>{
      const sx = cellaIn(gr, r, at - 1), dx = cellaIn(gr, r, at);
      if(sx && sx === dx){                    // cella unita a cavallo: la allargo una volta sola
        if(!allargate.has(sx)){ sx.colSpan = (sx.colSpan || 1) + n; allargate.add(sx); }
        return;
      }
      const head = tr.parentNode.tagName === 'THEAD';
      const prima = Array.from(tr.children).find(td=>{ const d = gr.dove.get(td); return d && d.c >= at; }) || null;
      for(let k=0;k<n;k++){
        const el = document.createElement(head ? 'th' : 'td');
        el.innerHTML = head ? 'Colonna' : '<br>';
        tr.insertBefore(el, prima);
      }
    });
    dopoRigheColonne(tab, z.r0, at);
  };
  const delCol = () => {
    const z = zonaScelta(); if(!z) return;
    const {tab, gr, c0, c1} = z;
    if(c0 === 0 && c1 >= gr.nCol - 1){
      if(confirm('Hai scelto tutte le colonne: elimino tutta la tabella?')){ tab.remove(); dopoRigheColonne(tab, 0, 0); }
      return;
    }
    gr.dove.forEach((d, td)=>{
      const dentro = Math.min(c1, d.c + d.cs - 1) - Math.max(c0, d.c) + 1;
      if(dentro <= 0) return;
      if(dentro >= d.cs) td.remove(); else td.colSpan = d.cs - dentro;
    });
    dopoRigheColonne(tab, z.r0, c0);
  };
  const delTable = () => {
    const cell = cellaAttiva(); if(!cell) return;
    if(confirm('Eliminare tutta la tabella?')){
      cell.closest('table').remove(); emit();
      cellaRef.current = null; setInTable(false); setTblBox(null);
    }
  };

  /* copia formato del testo: grassetto, corsivo, colore, evidenziatore */
  const fmtTesto = useRef(null);
  const pennelloTimer = useRef(null);
  const [fmtTPreso,setFmtTPreso] = useState(false);
  const fmtTPresoRef = useRef(false);
  useEffect(()=>{ fmtTPresoRef.current = fmtTPreso; },[fmtTPreso]);
  /* agganciato = resta acceso per più punti (doppio clic sul pennello, o Alt+O O) */
  const [fmtSticky,setFmtSticky] = useState(false);
  const fmtStickyRef = useRef(false);
  useEffect(()=>{ fmtStickyRef.current = fmtSticky; },[fmtSticky]);
  const ultimoAltO = useRef(0);
  const spegniPennello = () => { setFmtTPreso(false); setFmtSticky(false); };
  const dopoAverApplicato = () => { if(!fmtStickyRef.current) spegniPennello(); };
  const CHIAVI_CELLA = ['backgroundColor','color','fontWeight','fontStyle','textDecoration','textAlign',
    'verticalAlign','width','lineHeight','fontSize','fontFamily'];
  const stileDiCella = (td) => { const o={}; CHIAVI_CELLA.forEach(k=>{ o[k] = td.style[k] || ''; }); return o; };
  /* Alt+O: carica il pennello. Premuto due volte di fila resta agganciato, come il doppio clic in Word */
  const pennelloDaTasto = () => {
    const ora = Date.now();
    const raddoppio = (ora - ultimoAltO.current) < 800;
    ultimoAltO.current = ora;
    if(fmtTPresoRef.current){
      if(raddoppio && !fmtStickyRef.current){ setFmtSticky(true); return; }
      spegniPennello(); return;
    }
    copiaFormatoTesto();
  };
  const eGrassetto = (w) => w === 'bold' || w === 'bolder' || parseInt(w,10) >= 600;
  const vuoto = (c) => !c || c === 'rgba(0, 0, 0, 0)' || c === 'transparent';

  /* ═══ pennello sul testo, come in Word ═══
     Il formato copiato SOSTITUISCE quello del testo di arrivo: se copio un testo normale su
     uno in grassetto evidenziato, il grassetto e l'evidenziatore vanno via.
     Si lavora pezzo di testo per pezzo di testo, così una selezione su più righe, elenchi
     o titoli non rompe i paragrafi (prima il testo veniva estratto e rimesso tutto in una riga). */
  const RX_BLOCCO_TESTO = /^(P|DIV|LI|H1|H2|H3|H4|H5|H6|BLOCKQUOTE|PRE|TD|TH|FIGCAPTION|UL|OL|TABLE|TR|TBODY|THEAD)$/;
  const RX_FORMATO = /^(SPAN|B|STRONG|I|EM|U|FONT|MARK|S|STRIKE|INS)$/;
  const bloccoDi = (n) => {
    let x = n.nodeType === 3 ? n.parentNode : n;
    while(x && x !== ref.current && !RX_BLOCCO_TESTO.test(x.tagName)) x = x.parentNode;
    return x || ref.current;
  };
  /* legge il formato "visto" di un punto del testo, risalendo fino al suo paragrafo */
  const formatoDelTesto = (el) => {
    const st = window.getComputedStyle(el);
    const blocco = bloccoDi(el);
    let sotto = false, sfondo = null, corpo = '', famiglia = '';
    for(let x = el; x && x !== blocco && x !== ref.current; x = x.parentElement){
      const cs = window.getComputedStyle(x);
      if(!sotto && ((cs.textDecorationLine||'').includes('underline') || x.tagName === 'U' || x.tagName === 'INS')) sotto = true;
      if(!sfondo && !vuoto(cs.backgroundColor)) sfondo = cs.backgroundColor;
      if(!corpo && x.style && x.style.fontSize) corpo = x.style.fontSize;
      if(!famiglia && x.style && x.style.fontFamily) famiglia = x.style.fontFamily;
    }
    /* corpo e carattere sono quelli che si VEDONO (anche se vengono dal titolo), altrimenti
       copiando da un titolo su un testo normale non cambiava niente */
    const bl = blocco && blocco !== ref.current ? blocco : null;
    return {
      bold: eGrassetto(st.fontWeight),
      italic: st.fontStyle === 'italic',
      underline: sotto,
      color: vuoto(st.color) ? '' : st.color,
      bg: sfondo,
      fontSize: corpo || st.fontSize || '',
      fontFamily: famiglia || st.fontFamily || '',
      corpoScelto: !!corpo, famigliaScelta: !!famiglia,
      // il formato del paragrafo: vale quando si "pennella" un paragrafo intero, come in Word
      bloccoTag: bl && /^(P|H1|H2|H3|H4|DIV)$/.test(bl.tagName) && !bl.classList.contains('grp-t') && !bl.classList.contains('grp-c') && !bl.classList.contains('grp') ? (bl.tagName === 'DIV' ? 'P' : bl.tagName) : '',
      bloccoStile: bl ? {
        lineHeight: bl.style.lineHeight || '', textAlign: bl.style.textAlign || '',
        backgroundColor: bl.style.backgroundColor || ''
      } : null
    };
  };
  /* i pezzi di testo toccati dalla selezione, con gli estremi giusti */
  const testiNelRange = (r) => {
    const out = [];
    const radice = r.commonAncestorContainer;
    const prendi = (t) => {
      if(!t.textContent.length) return;
      let a = 0, b = t.textContent.length;
      if(t === r.startContainer) a = r.startOffset;
      if(t === r.endContainer) b = r.endOffset;
      if(b > a && t.textContent.slice(a, b).replace(/[\s ]/g,'').length) out.push({nodo:t, a, b});
    };
    if(radice.nodeType === 3){ prendi(radice); return out; }
    const w = document.createTreeWalker(radice, NodeFilter.SHOW_TEXT, {
      acceptNode: t => { try{ return r.intersectsNode(t) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }catch(e){ return NodeFilter.FILTER_REJECT; } }
    });
    let t; while((t = w.nextNode())) prendi(t);
    return out;
  };
  /* porta il pezzo di testo fuori dagli elementi di formato che lo avvolgono (spezzandoli),
     fino al paragrafo: così il formato vecchio non resta sotto a quello nuovo. I link restano. */
  const isolaTesto = (t, blocco) => {
    while(t.parentNode && t.parentNode !== blocco && RX_FORMATO.test(t.parentNode.tagName) && !t.parentNode.className){
      const A = t.parentNode;
      const dopo = A.cloneNode(false);
      while(t.nextSibling) dopo.appendChild(t.nextSibling);
      A.parentNode.insertBefore(t, A.nextSibling);
      if(dopo.childNodes.length) A.parentNode.insertBefore(dopo, t.nextSibling);
      if(!A.childNodes.length) A.remove();
    }
  };
  const stileDelPennello = (f) => {
    const o = {
      fontWeight: f.bold ? 'bold' : 'normal',
      fontStyle: f.italic ? 'italic' : 'normal',
      textDecoration: f.underline ? 'underline' : 'none'
    };
    if(f.color) o.color = f.color;
    if(f.bg) o.backgroundColor = f.bg;
    if(f.fontSize) o.fontSize = f.fontSize;
    if(f.fontFamily && f.famigliaScelta !== false) o.fontFamily = f.fontFamily;   // carattere del foglio: non lo ripeto
    return o;
  };
  /* unisce gli span vicini con lo stesso aspetto, per non lasciare l'HTML a pezzetti */
  const unisciSpanUguali = (padri) => {
    padri.forEach(p=>{
      if(!p || !p.isConnected) return;
      let x = p.firstChild;
      while(x){
        const dopo = x.nextSibling;
        if(dopo && x.nodeType === 1 && dopo.nodeType === 1 && x.tagName === 'SPAN' && dopo.tagName === 'SPAN'
           && (x.getAttribute('style')||'') === (dopo.getAttribute('style')||'') && !x.className && !dopo.className){
          while(dopo.firstChild) x.appendChild(dopo.firstChild);
          dopo.remove();
          continue;
        }
        x = dopo;
      }
      p.normalize();
    });
  };
  const pennelloSulTesto = (f) => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount || sel.isCollapsed) return false;
    const r = sel.getRangeAt(0);
    const pezzi = testiNelRange(r);
    if(!pezzi.length) return false;
    const stile = stileDelPennello(f);
    /* paragrafi presi per intero: prendono anche il formato del paragrafo di partenza
       (titolo / sottotitolo / testo, interlinea, allineamento) */
    const interi = [];
    if(f.bloccoTag){
      const visti = new Set();
      pezzi.forEach(pz=>{
        const b = bloccoDi(pz.nodo);
        if(!b || b === ref.current || visti.has(b)) return;
        visti.add(b);
        if(!/^(P|H1|H2|H3|H4|DIV)$/.test(b.tagName) || b.classList.contains('grp-t') || b.classList.contains('grp-c') || b.classList.contains('grp')) return;
        if(b.closest('td,th,li')) return;
        const tutto = document.createRange(); tutto.selectNodeContents(b);
        const dentro = document.createRange(); dentro.selectNodeContents(b);
        if(dentro.compareBoundaryPoints(Range.START_TO_START, r) < 0) dentro.setStart(r.startContainer, r.startOffset);
        if(dentro.compareBoundaryPoints(Range.END_TO_END, r) > 0) dentro.setEnd(r.endContainer, r.endOffset);
        const pulito = x => x.toString().replace(/[\s\u00a0]/g,'');
        if(pulito(dentro) && pulito(dentro) === pulito(tutto)) interi.push(b);
      });
    }
    const fatti = [];
    // taglio i nodi di testo agli estremi della selezione (prima l'ultimo, così gli indici restano validi)
    pezzi.forEach(pz=>{
      let t = pz.nodo;
      if(pz.b < t.textContent.length) t.splitText(pz.b);
      if(pz.a > 0) t = t.splitText(pz.a);
      fatti.push(t);
    });
    const padri = new Set();
    const span0 = [];
    fatti.forEach(t=>{
      const blocco = bloccoDi(t);
      isolaTesto(t, blocco);
      const sp = document.createElement('span');
      Object.entries(stile).forEach(([k,v])=>{ sp.style[k] = v; });
      t.parentNode.insertBefore(sp, t);
      sp.appendChild(t);
      span0.push(sp);
      padri.add(sp.parentNode);
    });
    // via gli elementi di formato rimasti vuoti
    padri.forEach(p=>{
      Array.from(p.querySelectorAll('span,b,strong,i,em,u,font,mark,s,strike,ins')).forEach(el=>{
        if(!el.textContent.length && !el.querySelector('br,img')) el.remove();
      });
    });
    // cambio il tipo di paragrafo (es. da titolo a testo) tenendo il contenuto
    interi.forEach(b=>{
      if(!b.isConnected) return;
      let nb = b;
      if(b.tagName !== f.bloccoTag){
        nb = document.createElement(f.bloccoTag.toLowerCase());
        Array.from(b.attributes).forEach(a=>{ if(a.name !== 'style') nb.setAttribute(a.name, a.value); });
        while(b.firstChild) nb.appendChild(b.firstChild);
        b.replaceWith(nb);
        padri.delete(b); padri.add(nb);
      }
      const bs = f.bloccoStile || {};
      ['lineHeight','textAlign','backgroundColor'].forEach(k=>{
        if(bs[k]) nb.style[k] = bs[k]; else nb.style.removeProperty(k.replace(/[A-Z]/g, m=>'-'+m.toLowerCase()));
      });
      if(!nb.getAttribute('style')) nb.removeAttribute('style');
      // nel paragrafo intero corpo e carattere vengono dal paragrafo stesso: niente stile ripetuto sui pezzi
      if(nb.tagName === f.bloccoTag){
        nb.querySelectorAll('span').forEach(sp=>{
          if(!span0.includes(sp)) return;
          if(!f.corpoScelto) sp.style.removeProperty('font-size');
          if(!f.famigliaScelta) sp.style.removeProperty('font-family');
        });
      }
    });
    const primo = span0[0], ultimo = span0[span0.length-1];
    unisciSpanUguali(padri);
    try{
      const nr = document.createRange();
      nr.setStartBefore(primo.isConnected ? primo : span0.find(x=>x.isConnected));
      nr.setEndAfter(ultimo.isConnected ? ultimo : [...span0].reverse().find(x=>x.isConnected));
      sel.removeAllRanges(); sel.addRange(nr);
    }catch(err){}
    emit(true);
    return true;
  };

  /* ═══ corpo e carattere "visti" ═══
     Come in Word: le due tendine mostrano il corpo e il carattere del testo selezionato
     (o del punto dove sta il cursore). Se la selezione ne mescola più d'uno, restano vuote. */
  const [fmtVisto, setFmtVisto] = useState({corpo:'', fam:'', famNome:''});
  const primoNome = (ff) => (ff||'').split(',')[0].replace(/["']/g,'').trim().toLowerCase();
  const leggiFmtDi = (el) => {
    const cs = window.getComputedStyle(el);
    const px = parseFloat(cs.fontSize);
    const corpo = isNaN(px) ? '' : String(Math.round(px * 2) / 2);
    // carattere scelto a mano (stile scritto su un elemento) o quello del foglio?
    let scelto = '';
    for(let x = el; x && x !== ref.current; x = x.parentElement){
      if(x.style && x.style.fontFamily){ scelto = x.style.fontFamily; break; }
    }
    const nome = primoNome(cs.fontFamily);
    let fam = 'DEF', famNome = '';
    if(scelto){
      const f = FAMIGLIE.find(f=>f.v && primoNome(f.v) === primoNome(scelto));
      if(f) fam = f.v;
      else { fam = 'X:' + scelto; famNome = scelto.split(',')[0].replace(/["']/g,'').trim(); }
    } else if(!nome){ fam = ''; }
    return {corpo, fam, famNome};
  };
  const aggiornaFmtVisto = () => {
    if(!ref.current) return;
    let el = null, elementi = [];
    const cella = (modo === 'sel') ? cellaCorrente() : null;
    if(cella){ el = cella; }
    else {
      const sel = window.getSelection();
      if(!sel || !sel.rangeCount) return;
      const r = sel.getRangeAt(0);
      if(!ref.current.contains(r.commonAncestorContainer)) return;   // fuori dall'editor: lascio com'era
      if(!sel.isCollapsed){
        elementi = testiNelRange(r).slice(0, 400).map(p=>p.nodo.parentElement).filter(Boolean);
      }
      if(!elementi.length){
        let n = sel.anchorNode;
        if(n && n.nodeType === 3) n = n.parentElement;
        el = n;
      }
    }
    if(el) elementi = [el];
    if(!elementi.length){ setFmtVisto({corpo:'', fam:'', famNome:''}); return; }
    const visti = elementi.map(leggiFmtDi);
    const corpo = visti.every(v=>v.corpo === visti[0].corpo) ? visti[0].corpo : '';
    const stessaFam = visti.every(v=>v.fam === visti[0].fam);
    setFmtVisto(p=>{
      const n = {corpo, fam: stessaFam ? visti[0].fam : '', famNome: stessaFam ? visti[0].famNome : ''};
      return (p.corpo === n.corpo && p.fam === n.fam && p.famNome === n.famNome) ? p : n;
    });
  };
  const salvaRef = useRef(()=>{}); salvaRef.current = () => { const s = window.getSelection(); if(s && s.rangeCount && !s.isCollapsed) salvaRange(); };
  const aggFmtRef = useRef(aggiornaFmtVisto);
  aggFmtRef.current = aggiornaFmtVisto;
  useEffect(()=>{
    let att = false;
    const h = () => {
      try{ salvaRef.current(); }catch(e){}          // la selezione (anche allargata con le maniglie) resta pronta per il pennello
      if(att) return; att = true;
      requestAnimationFrame(()=>{ att = false; aggFmtRef.current(); });
    };
    document.addEventListener('selectionchange', h);
    return () => document.removeEventListener('selectionchange', h);
  },[]);

  const copiaFormatoTesto = () => {
    salvaRange();
    let n = null;
    const cella = (modo === 'sel') ? (fuocoRef.current || attivaRef.current) : null;
    if(cella && cella.isConnected){
      n = cella;                                   // sto sopra una cella: copio il formato della cella
    } else {
      const sel = window.getSelection();
      n = sel && sel.anchorNode;
      // con del testo selezionato prendo il formato del primo carattere scelto, non del punto in cui è partito il trascinamento
      if(sel && sel.rangeCount && !sel.isCollapsed){
        const primo = testiNelRange(sel.getRangeAt(0))[0];
        if(primo) n = primo.nodo;
      }
      if(n && n.nodeType === 3) n = n.parentElement;
    }
    if(!n || !ref.current.contains(n)){ alert('Scegli prima la cella, o metti il cursore nel testo, di cui copiare il formato.'); return; }
    if(!(n.tagName === 'TD' || n.tagName === 'TH')){
      fmtTesto.current = { ...formatoDelTesto(n), cella:false, colSpan:1, rowSpan:1, blocco:null,
        textAlign:'', verticalAlign:'', width:'', lineHeight:'' };
      setFmtTPreso(true); setFmtSticky(false);
      return;
    }
    const st = window.getComputedStyle(n);
    const inl = n.style || {};
    // lo stile scritto sull'elemento è più affidabile di quello calcolato
    const peso = inl.fontWeight || st.fontWeight;
    const corsivo = inl.fontStyle || st.fontStyle;
    const sotto = inl.textDecoration || st.textDecorationLine || '';
    const colore = inl.color || st.color;
    const sfondo = inl.backgroundColor || st.backgroundColor;
    const eCella = n.tagName === 'TD' || n.tagName === 'TH';
    fmtTesto.current = {
      bold: eGrassetto(peso),
      italic: corsivo === 'italic',
      underline: (sotto||'').includes('underline'),
      color: vuoto(colore) ? '' : colore,
      bg: vuoto(sfondo) ? null : sfondo,
      // dalle celle prendo anche il resto dell'aspetto
      cella: eCella,
      textAlign: eCella ? (inl.textAlign || '') : '',
      verticalAlign: eCella ? (inl.verticalAlign || '') : '',
      width: eCella ? (inl.width || '') : '',
      lineHeight: eCella ? (inl.lineHeight || '') : '',
      fontSize: inl.fontSize || '',
      fontFamily: inl.fontFamily || '',
      colSpan: eCella ? (n.colSpan || 1) : 1,
      rowSpan: eCella ? (n.rowSpan || 1) : 1,
      blocco: null
    };
    /* più celle scelte: copio il disegno dell'intero blocco (es. due righe che si alternano),
       così posso ripeterlo su quante righe voglio */
    const scelte = selRef.current.filter(td=>td.isConnected);
    if(scelte.length > 1){
      const tab = scelte[0].closest('table');
      const gr = grigliaDi(tab);
      const pos = scelte.map(td=>gr.dove.get(td)).filter(Boolean);
      if(pos.length){
        const r0=Math.min(...pos.map(p=>p.r)), r1=Math.max(...pos.map(p=>p.r));
        const c0=Math.min(...pos.map(p=>p.c)), c1=Math.max(...pos.map(p=>p.c));
        const m = [];
        for(let r=0; r<=r1-r0; r++){
          m[r] = [];
          for(let c=0; c<=c1-c0; c++){
            const td = cellaIn(gr, r0+r, c0+c);
            m[r][c] = td ? stileDiCella(td) : null;
          }
        }
        fmtTesto.current.blocco = m;
      }
    }
    setFmtTPreso(true); setFmtSticky(false);
  };

  /* riproduce un'unione su una cella di destinazione */
  const unisciDa = (cella, rs, cs) => {
    if(rs < 2 && cs < 2) return;
    const tab = cella.closest('table');
    const gr = grigliaDi(tab);
    const p = gr.dove.get(cella);
    if(!p) return;
    const testi = [];
    const daTogliere = new Set();
    for(let r=p.r; r<p.r+rs; r++){
      for(let c=p.c; c<p.c+cs; c++){
        const td = cellaIn(gr, r, c);
        if(td && td !== cella) daTogliere.add(td);
      }
    }
    daTogliere.forEach(td=>{
      const t = td.innerHTML.replace(/^<br>$/,'').trim();
      if(t) testi.push(t);
      td.remove();
    });
    if(testi.length){
      const mio = cella.innerHTML.replace(/^<br>$/,'').trim();
      cella.innerHTML = [mio, ...testi].filter(Boolean).join(' ') || '<br>';
    }
    cella.colSpan = cs; cella.rowSpan = rs;
  };
  const incollaFormatoTesto = (daSelezione) => {
    const f = fmtTesto.current;
    if(!f){ copiaFormatoTesto(); return; }

    // se ho delle celle selezionate, il formato va su quelle
    const stile = {
      fontWeight: f.bold ? 'bold' : '',
      fontStyle: f.italic ? 'italic' : '',
      textDecoration: f.underline ? 'underline' : '',
      color: f.color || '',
      backgroundColor: f.bg || '',
      fontSize: f.fontSize || '',
      fontFamily: f.fontFamily || ''
    };
    if(f.cella){
      ['textAlign','verticalAlign','width','lineHeight'].forEach(k=>{ stile[k] = f[k] || ''; });
    }
    const destinazioni = celleScelte();

    /* ho copiato un blocco di celle: lo ripeto sulla zona scelta, riga dopo riga */
    if(f.blocco && destinazioni.length){
      const tab = destinazioni[0].closest('table');
      const gr = grigliaDi(tab);
      const nr = f.blocco.length, nc = f.blocco[0].length;
      let dest = destinazioni.filter(td=>td.isConnected);
      if(dest.length === 1 && (nr > 1 || nc > 1)){
        // una cella sola: il blocco si appoggia da lì in giù, come in un foglio di calcolo
        const p0 = gr.dove.get(dest[0]);
        const ext = [];
        if(p0) for(let r=0;r<nr;r++) for(let c=0;c<nc;c++){
          const td = cellaIn(gr, p0.r+r, p0.c+c);
          if(td && ext.indexOf(td) < 0) ext.push(td);
        }
        if(ext.length) dest = ext;
      }
      const pos = dest.map(td=>({td, p:gr.dove.get(td)})).filter(x=>x.p);
      if(pos.length){
        const r0=Math.min(...pos.map(x=>x.p.r)), c0=Math.min(...pos.map(x=>x.p.c));
        pos.forEach(({td,p})=>{
          const st = f.blocco[(p.r-r0) % nr][(p.c-c0) % nc];
          if(!st) return;
          Object.entries(st).forEach(([k,v])=>{
            if(v) td.style[k] = v;
            else td.style.removeProperty(k.replace(/[A-Z]/g, m=>'-'+m.toLowerCase()));
          });
        });
        emit(true); dopoAverApplicato(); return;
      }
    }

    if(destinazioni.length){
      applicaStileCelle(stile);
      if(f.cella && (f.colSpan > 1 || f.rowSpan > 1) && !daSelezione){
        destinazioni.filter(td=>td.isConnected).forEach(td=>unisciDa(td, f.rowSpan, f.colSpan));
        puliscoSel(); setInTable(false); setTblBox(null);
        emit(true);
      }
      dopoAverApplicato();
      return;
    }

    if(!daSelezione){ ref.current.focus(); ripristinaRange(); }
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed){
      if(daSelezione) return;                       // niente selezione: resto in attesa
      alert('Seleziona il testo a cui applicare il formato.'); return;
    }
    if(!ref.current.contains(sel.getRangeAt(0).commonAncestorContainer)) return;
    if(pennelloSulTesto(f)) dopoAverApplicato();      // una passata sola, salvo quando è agganciato
  };

  /* cronologia delle modifiche: tenuta dall'app, così funziona anche dopo il salvataggio */
  const storia = useRef({stack:[], i:-1, bloccato:false, timer:null, doc:null});
  const [puoAnnullare,setPuoAnnullare] = useState(false);
  const [puoRipetere,setPuoRipetere] = useState(false);
  const aggiornaFrecce = () => {
    const st = storia.current;
    setPuoAnnullare(st.i > 0);
    setPuoRipetere(st.i < st.stack.length - 1);
  };
  const registra = (html, subito) => {
    const st = storia.current;
    if(st.bloccato) return;
    clearTimeout(st.timer);
    const diChi = docKey;                      // a quale documento appartiene questo stato
    const salva = () => {
      if(st.doc !== diChi) return;             // documento cambiato: lo stato non vale più
      if(st.stack[st.i] === html) return;
      st.stack = st.stack.slice(0, st.i + 1);
      st.stack.push(html);
      const max = html.length > 200000 ? 12 : 60;   // documenti con foto: meno passi indietro
      while(st.stack.length > max) st.stack.shift();
      st.i = st.stack.length - 1;
      aggiornaFrecce();
    };
    st.pendente = null;
    if(subito) salva(); else { st.pendente = salva; st.timer = setTimeout(()=>{ st.pendente = null; salva(); }, 450); }
  };
  const applicaStato = (html) => {
    const st = storia.current;
    st.bloccato = true;
    ref.current.innerHTML = html;
    avvisa(html);
    puliscoSel(); setModo('sel'); applicaModo('sel'); setInTable(false); setTblBox(null);
    setTimeout(()=>{ st.bloccato = false; aggiornaFrecce(); }, 60);
  };
  const annulla = () => {
    const st = storia.current;
    clearTimeout(st.timer);
    if(st.i <= 0) return;
    st.i--; applicaStato(st.stack[st.i]);
  };
  const ripeti = () => {
    const st = storia.current;
    if(st.i >= st.stack.length - 1) return;
    st.i++; applicaStato(st.stack[st.i]);
  };

  /* colore di sfondo della cella (o delle celle selezionate) */
  const cellaRef = useRef(null);
  const celleCoinvolte = () => {
    const vive = selRef.current.filter(td=>td.isConnected);
    if(vive.length) return vive;
    const c = cellaAttiva();
    if(!c) return [];
    const sel = window.getSelection();
    if(sel && sel.rangeCount && !sel.isCollapsed){
      const tab = c.closest('table');
      const tutte = Array.from(tab.querySelectorAll('td,th'));
      const dentro = tutte.filter(td=>sel.containsNode(td, true));
      if(dentro.length) return dentro;
    }
    return [c];
  };
  const coloraCelle = (v) => {
    celleCoinvolte().forEach(td=>{
      if(v) td.style.backgroundColor = v; else td.style.removeProperty('background-color');
    });
    emit(); setPal(null);
  };

  /* larghezza della colonna in cui si trova il cursore */
  const larghezzaColonna = (delta) => {
    const c = cellaAttiva();
    if(!c) return;
    const idx = Array.prototype.indexOf.call(c.parentNode.children, c);
    const tab = c.closest('table');
    const base = c.getBoundingClientRect().width;
    const nuova = Math.max(45, Math.round(base + delta));
    tab.querySelectorAll('tr').forEach(tr=>{
      const cell = tr.children[idx];
      if(cell) cell.style.width = nuova + 'px';
    });
    emit(); setTimeout(checkCtx, 0);
  };
  /* aggiunge le celle mancanti alle righe più corte */
  const pareggiaRighe = () => {
    const c = cellaCorrente() || cellaAttiva(); if(!c) return;
    const tab = c.closest('table');
    const gr = grigliaDi(tab);
    let aggiunte = 0;
    Array.from(tab.querySelectorAll('tr')).forEach((tr, r)=>{
      let occupate = 0;
      for(let k=0;k<gr.nCol;k++) if(cellaIn(gr, r, k)) occupate++;
      for(let k=occupate; k<gr.nCol; k++){
        const td = document.createElement(tr.querySelector('th') && !tr.querySelector('td') ? 'th' : 'td');
        td.innerHTML = '<br>';
        tr.appendChild(td);
        aggiunte++;
      }
    });
    if(aggiunte){ emit(true); alert('Ho aggiunto ' + aggiunte + (aggiunte===1?' cella mancante.':' celle mancanti.')); }
    else alert('Le righe sono già tutte complete.');
    setTimeout(checkCtx, 0);
  };

  const larghezzaAuto = () => {
    const c = cellaAttiva();
    if(!c) return;
    const tab = c.closest('table');
    tab.querySelectorAll('td,th').forEach(x=>x.style.removeProperty('width'));
    emit(); setTimeout(checkCtx, 0);
  };

  /* a capo dentro la cella, per chi non ha Maiusc+Invio (telefono) */
  const aCapoInCella = () => {
    ref.current.focus(); ripristinaRange();
    document.execCommand('insertLineBreak');
    emit();
  };

  /* tiene il formato di quello che incollo, buttando via il contorno di Word e delle pagine web */
  const ATTR_TENUTI = ['href','src','alt','colspan','rowspan','style','class','data-schizzo'];
  const STILI_TENUTI = ['color','background-color','font-weight','font-style','text-decoration','text-align',
    'font-size','font-family','vertical-align','line-height','width'];
  const CLASSI_MIE = ['grp','grp-t','grp-c','chiuso','cklist','ck','fatto','schizzo'];
  const ripulisciIncollato = (html) => {
    const box = document.createElement('div');
    box.innerHTML = String(html||'');
    box.querySelectorAll('script,style,meta,link,title,noscript,iframe,object,input,button,svg').forEach(el=>el.remove());
    Array.from(box.querySelectorAll('*')).forEach(el=>{
      const tag = el.tagName.toLowerCase();
      if(tag.indexOf(':') >= 0){ el.replaceWith(...el.childNodes); return; }   // <o:p> e simili di Word
      Array.from(el.attributes).forEach(a=>{
        if(ATTR_TENUTI.indexOf(a.name.toLowerCase()) < 0) el.removeAttribute(a.name);
      });
      const classi = (el.getAttribute('class')||'').split(/\s+/).filter(c=>CLASSI_MIE.indexOf(c) >= 0);
      if(classi.length) el.setAttribute('class', classi.join(' ')); else el.removeAttribute('class');
      const st = el.getAttribute('style');
      if(st){
        const tenuti = st.split(';').map(x=>x.trim()).filter(x=>{
          const k = (x.split(':')[0]||'').trim().toLowerCase();
          if(STILI_TENUTI.indexOf(k) < 0) return false;
          if(k === 'width' && tag !== 'td' && tag !== 'th') return false;
          // lo sfondo bianco di Word coprirebbe il foglio: lo lascio perdere
          if(k === 'background-color' && /(#fff(fff)?|255,\s*255,\s*255|white)/i.test(x)) return false;
          return true;
        });
        if(tenuti.length) el.setAttribute('style', tenuti.join('; ')); else el.removeAttribute('style');
      }
      if(tag === 'img' && !/^(data:|https?:)/.test(el.getAttribute('src')||'')) el.remove();
    });
    return box.innerHTML;
  };

  const pickImage = () => fileRef.current.click();

  /* ═══ disegni dentro il testo ═══
     Il disegno finisce nel testo come immagine; i tratti restano salvati sull'immagine stessa,
     così con un doppio clic (o selezionandolo e premendo ✏️) si riapre e si modifica. */
  const [schizzo, setSchizzo] = useState(null);      // {dati, fig, chiave}
  const schizzoDati = useRef(null);
  const lavApi = useRef(null);
  const schizzoSelezionato = () => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    let n = r.startContainer;
    if(n.nodeType === 1 && n.childNodes[r.startOffset] && n.childNodes[r.startOffset].nodeType === 1){
      const c = n.childNodes[r.startOffset];
      if(c.matches && c.matches('figure.schizzo')) return c;
    }
    if(n.nodeType === 3) n = n.parentNode;
    const f = n && n.closest && n.closest('figure.schizzo');
    return (f && ref.current.contains(f)) ? f : null;
  };
  const apriSchizzo = (fig) => {
    salvaRange();
    let dati = {tratti:[], h:700, sfondo:'bianco'};
    const f = fig || schizzoSelezionato();
    if(f){
      try{ dati = JSON.parse(decodeURIComponent(f.getAttribute('data-schizzo') || '')); }catch(err){}
    }
    schizzoDati.current = dati;
    setSchizzo({dati, fig: f || null, chiave: 'schizzo-' + Date.now()});
  };
  const confermaSchizzo = () => {
    const st = schizzo;
    const d = (lavApi.current && lavApi.current.dati) ? lavApi.current.dati() : schizzoDati.current;
    setSchizzo(null);
    if(!st || !d) return;
    const img = disegnoRitaglio(d);
    if(!img){                                     // disegno vuoto: se era già nel testo, lo tolgo
      if(st.fig && st.fig.isConnected){ st.fig.remove(); emit(true); }
      return;
    }
    const dati = encodeURIComponent(JSON.stringify({tratti:d.tratti, h:d.h, sfondo:d.sfondo}));
    const html = `<figure class="schizzo" data-schizzo="${dati}"><img src="${img.src}" alt="disegno" style="width:${img.perc}%"></figure>`;
    if(st.fig && st.fig.isConnected){
      const t = document.createElement('div'); t.innerHTML = html;
      st.fig.replaceWith(t.firstChild);
      emit(true);
      return;
    }
    ref.current.focus(); ripristinaRange();
    document.execCommand('insertHTML', false, html + '<p><br></p>');
    emit(true);
  };
  /* foto incollate (screenshot) o trascinate nel testo: compresse come quelle scelte dal pulsante */
  const inserisciImmagini = async (files) => {
    salvaRange();
    const doveEra = rangeRef.current ? rangeRef.current.cloneRange() : null;
    for(const f of files){
      setBusy('Inserisco la foto…');
      try{
        const dataUrl = await compressImage(f, 1600, 0.88, true);
        ref.current.focus();
        if(doveEra && doveEra.startContainer.isConnected){ const s = window.getSelection(); s.removeAllRanges(); s.addRange(doveEra); }
        document.execCommand('insertHTML', false, `<figure><img src="${dataUrl}" alt="immagine incollata"><figcaption></figcaption></figure><p><br></p>`);
        emit(true);
      }catch(err){ alert('Non sono riuscito a inserire la foto.'); }
    }
    setBusy('');
  };
  const onFile = async (e) => {
    const files = Array.from(e.target.files||[]);
    e.target.value='';
    if(!files.length) return;
    for(const f of files){
      if(!f.type.startsWith('image/')){ alert(`"${f.name}" non è un'immagine. Per video e file usa il pulsante del collegamento.`); continue; }
      setBusy('Comprimo '+f.name+'…');
      try{
        const dataUrl = await compressImage(f);
        const cap = '';
        ref.current.focus();
        document.execCommand('insertHTML', false,
          `<figure><img src="${dataUrl}" alt="${f.name.replace(/"/g,'')}"><figcaption>${cap}</figcaption></figure><p><br></p>`);
        emit();
      }catch(err){ alert('Non sono riuscito a inserire '+f.name); }
    }
    setBusy('');
  };

  const addLink = () => {
    const sel = window.getSelection();
    const testo = sel && sel.toString();
    const url = prompt('Indirizzo del collegamento (va bene anche un video su Drive o YouTube):','https://');
    if(!url || url==='https://') return;
    if(testo){ cmd('createLink', url); }
    else {
      const et = prompt('Testo da mostrare:', url) || url;
      cmd('insertHTML', `<a href="${url.replace(/"/g,'')}">${et}</a>&nbsp;`);
    }
  };

  const peso = kb(value);

  return (
    <div>
      {ritaglio && <ModalRitaglio src={ritaglio.src} onClose={()=>setRitaglio(null)} onApply={applicaRitaglio}/>}
      {schizzo && (
        <div className="overlay" onMouseDown={e=>{ if(e.target===e.currentTarget && confirm('Chiudere senza inserire il disegno?')) setSchizzo(null); }}>
          <div className="modal modal-schizzo">
            <div className="schizzo-testa">
              <h3>{schizzo.fig ? 'Modifica il disegno' : 'Disegna nel testo'}</h3>
              <span className="lav-spacer"></span>
              <button className="btn" onClick={()=>setSchizzo(null)}>Annulla</button>
              <button className="btn primary" onClick={confermaSchizzo}>{schizzo.fig ? 'Aggiorna' : 'Inserisci nel testo'}</button>
            </div>
            <Lavagna compatta apiRef={lavApi} docKey={schizzo.chiave} value={schizzo.dati} onChange={d=>{ schizzoDati.current = d; }}/>
            <p className="schizzo-nota">Nel testo va solo la parte disegnata, ritagliata. Doppio clic sul disegno per riaprirlo.</p>
          </div>
        </div>
      )}
      <div className="rt-tools" onMouseDown={e=>{ if(e.target.closest('button')) e.preventDefault(); }}>
        {inTable && modo==='sel' && selRef.current.filter(td=>td.isConnected).length > 0 && (
          <span className="conta-celle">{selRef.current.filter(td=>td.isConnected).length} celle</span>
        )}
        {/* strumenti divisi in schede, come le linguette di Word: in alto quelli che si usano sempre */}
        <div className="rt-riga1">
          <div className={'rt-base' + (schedaVista === 'base' ? ' aperta' : '')}>
          <button disabled={!puoAnnullare} onMouseDown={e=>{e.preventDefault(); salvaRange();}} onClick={annulla} title="Annulla (Ctrl/Cmd+Z)"><svg className="ic-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M7 5 3 9l4 4"/><path d="M3 9h9a5 5 0 0 1 0 10h-2"/></svg></button>
          <button disabled={!puoRipetere} onMouseDown={e=>{e.preventDefault(); salvaRange();}} onClick={ripeti} title="Ripeti (Ctrl/Cmd+Maiusc+Z)"><svg className="ic-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="m13 5 4 4-4 4"/><path d="M17 9H8a5 5 0 0 0 0 10h2"/></svg></button>
          <span className="rt-sep"></span>
          <button onClick={()=>cmd('bold')} title="Grassetto"><b>B</b></button>
          <button onClick={()=>cmd('italic')} title="Corsivo"><i>I</i></button>
          <button onClick={()=>cmd('underline')} title="Sottolineato"><u>U</u></button>

              <button className={al==='img-flt-sx'?'on':''} onClick={()=>allineaImg('img-flt-sx')} title="A sinistra con il testo che le scorre a fianco">▧ testo a destra</button>
              <button className={al==='img-flt-dx'?'on':''} onClick={()=>allineaImg('img-flt-dx')} title="A destra con il testo che le scorre a fianco">testo a sinistra ▨</button>
              <span className="sep"></span>
              <span className="img-ctx-et">Dimensione</span>
              {[25,50,75,100].map(p=><button key={p} className={d===p?'on':''} onClick={()=>misuraImg(p)}>{p}%</button>)}
              <button className={!d?'on':''} onClick={()=>misuraImg(0)} title="Dimensione originale (al massimo la larghezza della pagina)">auto</button>
              <span className="sep"></span>
              <button onClick={ritagliaImg} title="Ritaglia la foto">✂ Ritaglia</button>
              <button onClick={didascaliaImg} title="Scrivi una didascalia sotto la foto">Didascalia</button>
              <button className="del" onClick={eliminaImg}>elimina</button>
            </>); })()}
        </div>
      </>)}
      <div ref={ref} className={'rt'+(modo==='sel'?' modo-sel':'')+(fmtTPreso?' col-pennello':'')} contentEditable={!ro} suppressContentEditableWarning autoCapitalize="sentences"
        onMouseDown={e=>{
          clearTimeout(pennelloTimer.current);
          // clic su una foto (non su un disegno): la scelgo e compare la sua barra
          if(e.target.tagName === 'IMG' && !e.target.closest('figure.schizzo') && !e.target.closest('td,th')){
            e.preventDefault(); scegliImg(e.target); return;
          }
          lasciaImg();
          // Ctrl/Cmd + selezione: la selezione di prima resta e se ne aggiunge un'altra
          if(e.button === 0 && !(e.target.closest && e.target.closest('td,th'))){
            if((e.ctrlKey || e.metaKey) && !e.shiftKey){
              const s = window.getSelection();
              if(s.rangeCount){
                const r = s.getRangeAt(0);
                if(!r.collapsed && ref.current.contains(r.commonAncestorContainer) && !altreSel.current.some(x=>uguali(x, r))){
                  altreSel.current.push(r.cloneRange()); disegnaAltreSel();
                }
              }
            } else svuotaAltreSel();
          }
          const td = e.target.closest && e.target.closest('td,th');
          if(!td || !ref.current.contains(td)){ 
            if(inModifica.current) chiudiModifica();
            if(modo==='sel'){ puliscoSel(); setInTable(false); setTblBox(null); setMulti(false); }
            return;
          }
          if(modo === 'edit' && td === cellaRef.current) return;   // sto già scrivendo qui
          e.preventDefault();
          const conModificatore = e.ctrlKey || e.metaKey || e.shiftKey;
          selezionaCella(td, {aggiungi: multi || e.ctrlKey || e.metaKey, estendi: e.shiftKey});
          // il trascinamento ridisegna un rettangolo: con Ctrl/Cmd cancellerebbe la scelta appena fatta
          trascina.current = !multi && !conModificatore;
        }}
        onMouseMove={e=>{
          if(e.buttons === 0){ trascina.current = false; return; }   // nessun tasto premuto: sto solo passando sopra
          if(!trascina.current || modo !== 'sel') return;
          if(e.ctrlKey || e.metaKey) return;
          const td = e.target.closest && e.target.closest('td,th');
          if(td && ref.current.contains(td)) estendiFinoA(td);
        }}
        onMouseLeave={()=>{ trascina.current = false; }}
        onTouchStart={e=>{
          if(modo !== 'sel') return;
          const t = e.touches[0];
          const td = cellaDaPunto(t.clientX, t.clientY);
          if(td){ trascina.current = true; }
        }}
        onTouchMove={e=>{
          if(!trascina.current || modo !== 'sel' || multi) return;
          const t = e.touches[0];
          const td = cellaDaPunto(t.clientX, t.clientY);
          if(td && attivaRef.current && td !== attivaRef.current){
            e.preventDefault();          // sto selezionando, non scorrendo
            estendiFinoA(td);
          }
        }}
        onContextMenu={e=>{
          // tasto destro su una voce numerata: riquadro della numerazione per quella voce (come "Imposta valore" di Word)
          const liN = e.target.closest && e.target.closest('li');
          if(liN && ref.current.contains(liN) && liN.parentElement && liN.parentElement.tagName === 'OL' && !e.ctrlKey){
            e.preventDefault();
            proponiNumerazione(true, liN);
            return;
          }
          const td = e.target.closest && e.target.closest('td,th');
          if(td && ref.current.contains(td) && (e.ctrlKey || modo === 'sel')) e.preventDefault();
        }}
        onClick={e=>{
          const t = e.target.closest && e.target.closest('.grp-t');
          if(t && e.nativeEvent.offsetX < 24){
            t.parentNode.classList.toggle('chiuso');
            emit(true);
            return;
          }
          // casella di spunta: si tocca il quadratino a sinistra della riga
          const li = e.target.closest && e.target.closest('li.ck');
          if(li && ref.current.contains(li)){
            const r = li.getBoundingClientRect();
            if(e.clientX - r.left < 28){
              e.preventDefault();
              li.classList.toggle('fatto');
              emit(true);
            }
          }
        }}
        onDoubleClick={e=>{
          const td = e.target.closest && e.target.closest('td,th');
          const sk = e.target.closest && e.target.closest('figure.schizzo');
          if(sk && ref.current.contains(sk)){ e.preventDefault(); apriSchizzo(sk); return; }
          if(td && ref.current.contains(td)){ e.preventDefault(); entraInModifica(td); }
        }}
        data-ph={placeholder||'Scrivi qui…'}
        onInput={()=>{ svuotaAltreSel(); lasciaImg(); if(numPop) setNumPop(null); emit(); }}
        onKeyDown={e=>{
          // copia formato: Alt+O carica il pennello, Ctrl/Cmd+Maiusc+C copia, +V applica
          if(e.altKey && (e.key === 'o' || e.key === 'O' || e.code === 'KeyO')){
            e.preventDefault(); pennelloDaTasto(); return;
          }
          if(e.key === 'Escape' && fmtTPresoRef.current){ e.preventDefault(); spegniPennello(); return; }
          // maiuscola automatica: dopo un punto (o ! ?) e uno spazio, la prima lettera diventa maiuscola
          if(!e.ctrlKey && !e.metaKey && !e.altKey && !e.isComposing && e.key && e.key.length === 1 && e.key !== e.key.toUpperCase() && e.key.toLowerCase() === e.key){
            const sl = window.getSelection();
            if(sl && sl.rangeCount && sl.isCollapsed && ref.current.contains(sl.anchorNode)){
              const r0 = sl.getRangeAt(0);
              let bl = sl.anchorNode.nodeType === 1 ? sl.anchorNode : sl.anchorNode.parentElement;
              bl = (bl && bl.closest && bl.closest('p,div,li,td,th,h1,h2,h3,h4,h5,h6,blockquote,figcaption,pre')) || ref.current;
              if(!ref.current.contains(bl)) bl = ref.current;
              if(!bl.closest('pre,code')){
                const rr = document.createRange(); rr.setStart(bl, 0); rr.setEnd(r0.startContainer, r0.startOffset);
                const prima = rr.toString().slice(-40);
                const m = prima.match(/(\S*?)([.!?])[\s\u00a0]+$/);
                const ABBR = /^(es|ecc|etc|pag|pagg|sig|sigg|dott|dott\.ssa|ing|avv|prof|geom|rag|arch|n|nr|art|cap|cfr|tel|ca|vs|p|pp|s|ss|fig|tab|vol|ad|ex|ns|vs|rif|doc|sez|par|min|max)$/i;
                if(m && !(m[2] === '.' && (ABBR.test(m[1].replace(/^[(\["'«]+/, '')) || /\.$/.test(m[1])))){
                  e.preventDefault();
                  document.execCommand('insertText', false, e.key.toUpperCase());
                  return;
                }
              }
            }
          }
          // Ctrl/Cmd + B, I, U passano dagli stessi comandi dei pulsanti (valgono anche sulle selezioni multiple)
          if((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && /^[biu]$/i.test(e.key || '') && !(cellaCorrente() && !window.getSelection().toString())){
            e.preventDefault();
            const k = e.key.toLowerCase();
            cmd(k === 'b' ? 'bold' : k === 'i' ? 'italic' : 'underline');
            return;
          }
          if((e.ctrlKey || e.metaKey) && e.altKey && (e.key === 'v' || e.key === 'V' || e.code === 'KeyV')){
            e.preventDefault();                       // incolla senza formato
            if(navigator.clipboard && navigator.clipboard.readText){
              navigator.clipboard.readText().then(t=>{
                ref.current.focus(); ripristinaRange();
                document.execCommand('insertText', false, t); emit();
              }).catch(()=>alert('Il browser non mi lascia leggere gli appunti: usa Ctrl+Maiusc+V del sistema.'));
            }
            return;
          }
          if((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.key === 'C')){
            e.preventDefault(); copiaFormatoTesto(); return;
          }
          if((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'v' || e.key === 'V')){
            e.preventDefault(); incollaFormatoTesto(); return;
          }
          if((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')){
            e.preventDefault(); e.shiftKey ? ripeti() : annulla(); return;
          }
          if((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); ripeti(); return; }
          // la modalità celle vale solo dentro una tabella: fuori, le scorciatoie del testo restano attive
          if(modo === 'sel' && attivaRef.current && attivaRef.current.isConnected) return;
          if(proteggiChiusi(e)) return;
          if(invioSulTitolo(e)) return;
          if(esciDalGruppo(e)) return;
          if(rientroElenco(e)) return;
          if(navigaTabella(e)) return;
          scorciatoiaElenco(e);
        }}
        onKeyUp={()=>{ checkCtx(); salvaRange(); }}
        onMouseUp={e=>{
          trascina.current = false;
          checkCtx(); salvaRange();
          { const sl = window.getSelection(); if(e.button === 0 && !e.ctrlKey && sl && sl.isCollapsed) setTimeout(()=>proponiNumerazione(true), 0); }
          /* col pennello aspetto un attimo: se arriva un secondo o terzo clic (parola o riga intera)
             il formato va sulla selezione finale, non sulla prima parola */
          if(fmtTPreso){
            clearTimeout(pennelloTimer.current);
            pennelloTimer.current = setTimeout(()=>incollaFormatoTesto(true), 320);
          }
        }}
        onTouchEnd={()=>{
          trascina.current = false;
          salvaRange();
          /* col dito la selezione si allarga dopo (con le maniglie): niente formato al primo tocco,
             si applica con il pulsante "Applica" dell'avviso */
        }}
        onBlur={()=>{
          salvaRange();
          // uscendo dall'editor chiudo la cella aperta, così la formula viene registrata
          setTimeout(()=>{
            if(inModifica.current && ref.current && !ref.current.contains(document.activeElement)) chiudiModifica();
          }, 150);
        }}
        onFocus={checkCtx}
        onDrop={e=>{
          const fs = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter(f=>/^image\//.test(f.type));
          if(!fs.length) return;
          e.preventDefault();
          try{                                       // la foto va dove è stata lasciata
            const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
            if(r && ref.current.contains(r.startContainer)){ const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
          }catch(err){}
          inserisciImmagini(fs);
        }}
        onPaste={e=>{
          const dt = e.clipboardData||window.clipboardData;
          const testoPiano = dt.getData('text/plain') || '';
          /* screenshot di un'area (Win+Maiusc+S, Cmd+Ctrl+Maiusc+4…) o immagine copiata: va nel testo come foto */
          const immagini = Array.from(dt.items || []).filter(it=>it.kind === 'file' && /^image\//.test(it.type)).map(it=>it.getAsFile()).filter(Boolean);
          if(immagini.length && !testoPiano.trim()){
            e.preventDefault();
            inserisciImmagini(immagini);
            return;
          }
          // dentro una tabella, un testo a colonne riempie le celle a partire da quella scelta
          const inCella = cellaCorrente() || cellFromSelection();
          if(inCella && /\t|\n/.test(testoPiano.trim())){
            e.preventDefault();
            const m = testoPiano.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(r=>r.split('\t'));
            incollaCelle(m);
            return;
          }
          const html = dt.getData('text/html');
          if(html && /<table/i.test(html)){
            e.preventDefault();
            const box = document.createElement('div');
            box.innerHTML = ripulisciIncollato(html);
            const t = box.querySelector('table');
            if(t){
              t.querySelectorAll('table').forEach((n,i)=>{ if(i>0) n.replaceWith(...n.childNodes); });
              document.execCommand('insertHTML', false, t.outerHTML + '<p><br></p>');
              emit();
              return;
            }
          }
          e.preventDefault();
          // il testo arriva con il suo formato: grassetti, colori, elenchi e collegamenti restano
          if(html && html.trim()) document.execCommand('insertHTML', false, ripulisciIncollato(html));
          else document.execCommand('insertText', false, testoPiano);
          emit();
        }}
      />

      </div>

      {peso>700 && <div className="peso">Questo documento pesa circa {peso} KB. Oltre il migliaio di KB il salvataggio può rallentare: valuta di togliere qualche foto.</div>}
    </div>
  );
}

/* ═══════════ righe modificabili ═══════════ */
/* ═══ campi che crescono col testo, senza far saltare la pagina ═══
   Per misurare l'altezza giusta il campo va prima rimpicciolito: per un attimo la pagina si accorciava
   e il browser (soprattutto su iPhone) la faceva scorrere, così mentre scrivevi "si muoveva tutto".
   Ora la posizione della pagina viene rimessa com'era e l'altezza cambia solo se serve davvero. */
function adattaAltezza(el){
  if(!el) return;
  const x = window.scrollX, y = window.scrollY;
  const col = el.closest && el.closest('.col-doc');
  const yc = col ? col.scrollTop : 0;
  const prima = el.style.height;
  el.style.height = 'auto';
  const h = el.scrollHeight + 'px';
  el.style.height = h;
  if(prima !== h){ /* altezza cambiata: niente da fare, la pagina ora è giusta */ }
  if(window.scrollY !== y || window.scrollX !== x) window.scrollTo(x, y);
  if(col && col.scrollTop !== yc) col.scrollTop = yc;
}

function AutoLine({value, onChange, placeholder, className, onEnter, autofocus}){
  const ref = useRef(null);
  const fit = () => adattaAltezza(ref.current);
  useEffect(fit, [value]);
  useEffect(()=>{ const h=()=>fit(); window.addEventListener('resize',h); return ()=>window.removeEventListener('resize',h); },[]);
  useEffect(()=>{
    if(autofocus && ref.current){
      ref.current.focus();
      ref.current.scrollIntoView({block:'center', behavior:'smooth'});
    }
  },[]);
  return (
    <textarea ref={ref} className={className||'line title'} rows={1} value={value} placeholder={placeholder}
      onChange={e=>{ onChange(e.target.value); fit(); }}
      onKeyDown={e=>{
        if(e.key==='Enter' && !e.shiftKey){
          e.preventDefault();
          if(onEnter) onEnter();
        }
      }}/>
  );
}

function AutoNote({value, onChange, placeholder}){
