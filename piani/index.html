function App(){
  const [user,setUser] = useState(HAS_FB? undefined : null);
  /* profilo dell'utente: ruolo e nome, letti dal ramo "utenti". Senza Firebase si lavora da soli, con tutti i permessi */
  const [profilo,setProfilo] = useState(HAS_FB ? undefined : {ruolo:'admin', nome:''});
  const membro = !!(profilo && (profilo.ruolo==='admin' || profilo.ruolo==='editor' || profilo.ruolo==='lettore'));
  const puoScrivere = !!(profilo && (profilo.ruolo==='admin' || profilo.ruolo==='editor'));
  const eAdmin = !!(profilo && profilo.ruolo==='admin');
  const scriveRef = useRef(puoScrivere); scriveRef.current = puoScrivere;
  const nomeRef = useRef(''); nomeRef.current = (profilo && profilo.nome) || '';
  useEffect(()=>{
    if(!HAS_FB) return;
    setProfilo(undefined);
    if(!user) return;
    const r = fbDb.ref(ROOT+'/utenti/'+user.uid);
    let vivo = true, stacca = null;
    const ascolta = () => {
      if(!vivo) return;
      const cb = r.on('value', sn=>{ if(vivo) setProfilo(sn.val() || null); }, ()=>{ if(vivo) setProfilo(null); });
      stacca = () => r.off('value', cb);
    };
    r.once('value').then(sn=>{
      if(sn.val()) return;
      // prima volta: se non c'è ancora nessun utente divento amministratore (lo consentono le regole), altrimenti resto in attesa
      const base = {uid:user.uid, email:user.email||'', nome:(user.email||'').split('@')[0], creato:nowISO()};
      return r.set({...base, ruolo:'admin'}).catch(()=>r.set({...base, ruolo:'attesa'}));
    }).catch(()=>{}).then(ascolta);
    return ()=>{ vivo = false; if(stacca) stacca(); };
  },[user]);
  /* blocco con PIN / Face ID */
  const [bloccato,setBloccato] = useState(()=>!!bloccoCfg());
  const [modalBlocco,setModalBlocco] = useState(false);
  const nascostaDa = useRef(0);
  useEffect(()=>{
    const v = () => {
      if(document.visibilityState === 'hidden'){ nascostaDa.current = Date.now(); return; }
      const c = bloccoCfg(); if(!c || !nascostaDa.current) return;
      const min = c.minuti === undefined ? 5 : c.minuti;
      if(Date.now() - nascostaDa.current >= min * 60000) setBloccato(true);
    };
    document.addEventListener('visibilitychange', v);
    return ()=>document.removeEventListener('visibilitychange', v);
  }, []);
  /* aggiornamento: controllo se online c'è una versione nuova e la propongo con un avviso ben visibile */
  const [nuovaVer,setNuovaVer] = useState(null);
  const [rimandata,setRimandata] = useState(null);
  const [aggiorno,setAggiorno] = useState(false);
  const controllaVer = async (manuale) => {
    try{
      const v = await versioneOnline();
      if(v && v !== window.APP_VER){ setNuovaVer(v); if(manuale) setRimandata(null); return true; }
    }catch(e){}
    return false;
  };
  useEffect(()=>{
    const t0 = setTimeout(()=>controllaVer(), 4000);
    const ogni = setInterval(()=>controllaVer(), 15 * 60000);
    const v = () => { if(document.visibilityState === 'visible') controllaVer(); };
    document.addEventListener('visibilitychange', v);
    return ()=>{ clearTimeout(t0); clearInterval(ogni); document.removeEventListener('visibilitychange', v); };
  }, []);
  const salvaPrimaRef = useRef(()=>{});
  const aggiornaOra = () => {
    setAggiorno(true);
    try{ if(document.activeElement) document.activeElement.blur(); }catch(e){}
    try{ salvaPrimaRef.current(); }catch(e){}           // quello che stavo scrivendo va salvato prima
    setTimeout(()=>{ location.replace(location.pathname + '?v=' + Date.now()); }, 1500);
  };
  const aggiornaApp = async () => { if(!(await controllaVer(true))) aggiornaOra(); };
  const [sezioni,setSezioni] = useState({});
  const [documenti,setDocumenti] = useState({});
  const [pronto,setPronto] = useState(!HAS_FB);

  const [selSez,setSelSez] = useState(null);      // id sezione o 'ATTIVITA'
  const [selDoc,setSelDoc] = useState(null);
  const [q,setQ] = useState('');
  const [modalSez,setModalSez] = useState(null);  // {sezione|null}
  const [modalNew,setModalNew] = useState(false);
  const [salvato,setSalvato] = useState('');
  const [mobileView,setMobileView] = useState('nav'); // nav | doc
  /* sul telefono, se il documento aperto sparisce (eliminato, cestinato, archiviato da un altro dispositivo…)
     si torna all'elenco: prima restava una pagina vuota "Nessun documento aperto" senza via d'uscita */
  useEffect(()=>{
    if(!pronto || mobileView !== 'doc' || selSez === 'ATTIVITA' || selSez === 'SPAZIO' || selSez === 'CALENDARIO' || selSez === 'UTENTI') return;
    if(!selDoc || !documenti[selDoc]) setMobileView('nav');
  }, [mobileView, selDoc, selSez, documenti, pronto]);
  const [menuOpen,setMenuOpen] = useState(false);
  const [pdfBusy,setPdfBusy] = useState(false);
  const [focusId,setFocusId] = useState(null);
  const [fmt,setFmt] = useState(FORMATO_DEF);
  const [modalFmt,setModalFmt] = useState(false);
  const [modalStorico,setModalStorico] = useState(false);
  const [anteprima,setAnteprima] = useState(false);
  const [odgCopiato,setOdgCopiato] = useState('');

  useEffect(()=>{
    if(HAS_FB){
      if(!user || !membro) return;
      const r = fbDb.ref(ROOT+'/formato');
      const cb = r.on('value', sn=>{ if(sn.val()) setFmt({...FORMATO_DEF, ...sn.val()}); }, ()=>{});
      return ()=>r.off('value',cb);
    } else {
      const v = local.get(ROOT+':formato');
      if(v) setFmt({...FORMATO_DEF, ...v});
    }
  },[user,membro]);

  const salvaFmt = (nuovo) => {
    setFmt(nuovo); setModalFmt(false);
    if(!scriveRef.current) return;                 // chi è in sola lettura lo cambia solo per sé, finché resta aperta la pagina
    if(HAS_FB) fbDb.ref(ROOT+'/formato').set(nuovo).catch(()=>{});
    else local.set(ROOT+':formato', nuovo);
  };
  useEffect(()=>{ setMenuOpen(false); },[selDoc,selSez]);
  useEffect(()=>{
    if(!menuOpen) return;
    const h = () => setMenuOpen(false);
    document.addEventListener('click', h);
    return () => document.removeEventListener('click', h);
  },[menuOpen]);
  const [,forceW] = useState(0);
  useEffect(()=>{ const h=()=>forceW(x=>x+1); window.addEventListener('resize',h); return ()=>window.removeEventListener('resize',h); },[]);

  /* auth */
  useEffect(()=>{
    if(!HAS_FB) return;
    return fbAuth.onAuthStateChanged(u=>setUser(u||null));
  },[]);

  /* caricamento dati */
  useEffect(()=>{
    if(HAS_FB){
      if(!user || !membro) return;
      const rs = fbDb.ref(ROOT+'/sezioni');
      const rd = fbDb.ref(ROOT+'/documenti');
      const a = rs.on('value', s=>{ setSezioni(s.val()||{}); setPronto(true); }, ()=>{});
      const b = rd.on('value', s=>setDocumenti(s.val()||{}), ()=>{});
      return ()=>{ rs.off('value',a); rd.off('value',b); };
    } else {
      setSezioni(local.get(ROOT+':sezioni')||{});
      setDocumenti(local.get(ROOT+':documenti')||{});
      setPronto(true);
    }
  },[user,membro]);

  /* scritture */
  const saveSez = useCallback((id,obj)=>{
    if(!scriveRef.current) return;                 // sola lettura: non si scrive niente
    setSezioni(p=>{ const n={...p}; if(obj) n[id]=obj; else delete n[id];
      if(!HAS_FB) local.set(ROOT+':sezioni', n); return n; });
    if(HAS_FB) fbDb.ref(ROOT+'/sezioni/'+id).set(obj||null).catch(()=>{});
  },[]);

  /* copia di sicurezza: tengo le ultime versioni di ogni documento */
  const ultimoBackup = useRef({});
  const archivia = (prima) => {
    if(!prima || !prima.id) return;
    const ora = Date.now();
    const key = prima.id;
    const chiave = 'v' + ora;
    const salvaCopia = () => {
      ultimoBackup.current[key] = ora;
      const copia = {...prima, salvataIl: new Date().toISOString()};
      if(HAS_FB){
        fbDb.ref(ROOT+'/storico/'+key+'/'+chiave).set(copia).catch(()=>{});
        // tengo solo le ultime 10
        fbDb.ref(ROOT+'/storico/'+key).once('value').then(sn=>{
          const v = sn.val() || {};
          const chiavi = Object.keys(v).sort();
          if(chiavi.length > 10) chiavi.slice(0, chiavi.length-10)
            .forEach(k=>fbDb.ref(ROOT+'/storico/'+key+'/'+k).remove());
        }).catch(()=>{});
      } else {
        const st = local.get(ROOT+':storico') || {};
        st[key] = [...(st[key]||[]), copia].slice(-10);
        local.set(ROOT+':storico', st);
      }
    };
    salvaCopia();
  };

  const saveDoc = useCallback((id,obj)=>{
    if(!scriveRef.current) return;                 // sola lettura: non si scrive niente
    if(obj && nomeRef.current) obj = {...obj, modDa: nomeRef.current};   // chi ha fatto l'ultima modifica
    setDocumenti(p=>{
      const prima = p[id];
      // se il documento si accorcia molto o viene eliminato, conservo com'era
      if(prima){
        const vecchio = (prima.corpo||'').length;
        const nuovoLen = obj ? (obj.corpo||'').length : 0;
        const passato = Date.now() - (ultimoBackup.current[id] || 0);
        if(!obj || (vecchio > 200 && nuovoLen < vecchio * 0.7) || passato > 1800000){
          archivia(prima);
        }
      }
      const n={...p}; if(obj) n[id]=obj; else delete n[id];
      if(!HAS_FB) local.set(ROOT+':documenti', n); return n;
    });
    if(HAS_FB) fbDb.ref(ROOT+'/documenti/'+id).set(obj||null)
      .catch(()=>{ setSalvato('Non salvato: permesso negato'); setTimeout(()=>setSalvato(''), 5000); });
    setSalvato('Salvato'); setTimeout(()=>setSalvato(s=>s === 'Salvato' ? '' : s), 1600);
  },[]);

  /* selezione iniziale */
  useEffect(()=>{
    if(!pronto || selSez) return;
    const ids = Object.keys(sezioni).filter(x=>!sezioni[x].cestinata);
    if(ids.length){
      ids.sort((a,b)=>(sezioni[a].ordine||0)-(sezioni[b].ordine||0));
      setSelSez(ids[0]);
    }
  },[pronto,sezioni,selSez]);

  /* primo avvio: sezioni di partenza */
  useEffect(()=>{
    if(!pronto) return;
    if(Object.keys(sezioni).length===0 && !local.get(ROOT+':seed')){
      local.set(ROOT+':seed', true);
      [['Eventi e sagre','Un piano e un bilancio per ogni manifestazione',COLORS[14]],
       ['Comunicazione','Piani editoriali, social, stampa, newsletter',COLORS[5]],
       ['Direttivo e assemblee','Convocazioni, verbali, decisioni',COLORS[0]],
       ['Soci e volontari','Tesseramento, turni, contatti',COLORS[15]],
       ['Bilancio e contributi','Conti, bandi, sponsor',COLORS[17]],
       ['Idee e appunti','Tutto quello che non ha ancora una casa',COLORS[4]]
      ].forEach(([nome,descrizione,colore],i)=>{
        const id=uid(); saveSez(id,{id,nome,descrizione,colore,ordine:i});
      });
    }
  },[pronto,sezioni,saveSez]);

  const sezList = useMemo(()=>Object.values(sezioni).filter(x=>!x.cestinata)
    .sort((a,b)=>(a.ordine||0)-(b.ordine||0)),[sezioni]);
  const radici = useMemo(()=>sezList.filter(s=>!s.parentId),[sezList]);
  const figlieDi = useCallback((id)=>sezList.filter(s=>s.parentId===id),[sezList]);
  const ramoDi = useCallback((id)=>[id, ...sezList.filter(s=>s.parentId===id).map(s=>s.id)],[sezList]);
  const [chiuse,setChiuse] = useState(()=> local.get('proloco:sezChiuse') || {});
  const [cartella,setCartella] = useState(null);   // cartella dove nascono i nuovi documenti
  const [aperte,setAperte] = useState(()=> local.get('proloco:cartAperte') || {});
  const apriChiudi = (id) => setAperte(p=>{
    const n = {...p, [id]: !p[id]};
    local.set('proloco:cartAperte', n);
    return n;
  });
  const [dragSu,setDragSu] = useState(null);       // dove sto trascinando
  const [selMulti,setSelMulti] = useState(false);  // modalità "scegli più documenti"
  const [scelti,setScelti] = useState([]);         // id dei documenti scelti
  const [modalSposta,setModalSposta] = useState(null);
  const alterna = (id) => setChiuse(p=>{ const n={...p, [id]: !p[id]}; local.set('proloco:sezChiuse', n); return n; });
  const docList = useMemo(()=>{
    let l = Object.values(documenti);
    if(selSez === 'CESTINO')
      return l.filter(d=>d.cestinato).sort((a,b)=>(b.cestinato||'').localeCompare(a.cestinato||''));
    if(selSez === 'ARCHIVIO')
      return l.filter(d=>!d.cestinato && d.archiviato).sort((a,b)=>(b.archiviato||'').localeCompare(a.archiviato||''));
    l = l.filter(d=>!d.cestinato && !d.archiviato);
    if(q.trim()){
      const s=q.toLowerCase();
      l = l.filter(d=>(d.titolo||'').toLowerCase().includes(s)
        || stripHtml(d.corpo).toLowerCase().includes(s)
        || (d.partecipanti||'').toLowerCase().includes(s)
        || (d.agenda||[]).some(p=>(p.titolo+' '+p.note).toLowerCase().includes(s))
        || (d.contenuti||[]).some(c=>((c.titolo||'')+' '+(c.note||'')+' '+(c.canale||'')).toLowerCase().includes(s))
        || (d.foglio && d.foglio.celle && Object.values(d.foglio.celle).some(v=>String(v).toLowerCase().includes(s))));
    } else if(selSez && selSez!=='ATTIVITA' && selSez!=='SPAZIO' && selSez!=='CALENDARIO' && selSez!=='UTENTI'){
      l = l.filter(d=>d.sezioneId === selSez);   // i documenti delle cartelle compaiono dentro di esse
    }
    return l.sort((a,b)=>{
      const da = a.data||a.creato.slice(0,10), db_ = b.data||b.creato.slice(0,10);
      return db_.localeCompare(da);
    });
  },[documenti,selSez,q,cartella,ramoDi]);

  const countBySez = useMemo(()=>{
    const c={};
    Object.values(documenti).forEach(d=>{ if(!d.cestinato && !d.archiviato) c[d.sezioneId]=(c[d.sezioneId]||0)+1; });
    return c;
  },[documenti]);
  const nCestino = useMemo(()=>Object.values(documenti).filter(d=>d.cestinato).length,[documenti]);
  const nArchivio = useMemo(()=>Object.values(documenti).filter(d=>!d.cestinato && d.archiviato).length,[documenti]);
  const countRamo = useCallback((id)=>ramoDi(id).reduce((n,x)=>n+(countBySez[x]||0),0),[ramoDi,countBySez]);

  /* cose ancora da fare, sommate fra tutti i documenti della sezione e delle sue cartelle */
  const todoBySez = useMemo(()=>{
    const c={};
    Object.values(documenti).forEach(d=>{
      if(d.cestinato || d.archiviato) return;
      const n = daFare(d); if(n) c[d.sezioneId]=(c[d.sezioneId]||0)+n;
    });
    return c;
  },[documenti]);
  const todoRamo = useCallback((id)=>ramoDi(id).reduce((n,x)=>n+(todoBySez[x]||0),0),[ramoDi,todoBySez]);

  const azioniAperte = useMemo(()=>{
    const out=[];
    Object.values(documenti).forEach(d=>{
      if(d.cestinato || d.archiviato) return;        // archivio e cestino restano fuori
      const az = d.azioni||[];
      const nomeMacro = {};
      az.forEach(a=>{ if(a.macro) nomeMacro[a.id] = a.testo; });
      az.forEach(a=>{
        if(a.macro) return;                       // le macro raggruppano, non sono attività
        if(!a.fatto && (a.testo||'').trim()) out.push({...a, doc:d, macro: a.parentId ? nomeMacro[a.parentId] : null});
      });
    });
    return out.sort((a,b)=>{
      if(!a.scadenza) return 1; if(!b.scadenza) return -1;
      return a.scadenza.localeCompare(b.scadenza);
    });
  },[documenti]);

  const prossimeUscite = useMemo(()=>{
    const oggi = oggiLoc(), fra = piuGiorni(oggi, 7);
    let n = 0;
    Object.values(documenti).forEach(d=>{
      if(d.cestinato || d.archiviato) return;
      if(d.tipo==='riunione' && d.data && d.data >= oggi && d.data <= fra && d.stato !== 'svolta') n++;
      (d.contenuti||[]).forEach(c=>{ if(c.data && c.data >= oggi && c.data <= fra && c.stato !== 'pubblicato') n++; });
    });
    return n;
  },[documenti]);

  const spazio = useMemo(()=>{
    const docs = Object.values(documenti);
    const dettagli = docs.map(d=>{
      const tot = pesoDi(d);
      const img = pesoImmagini(d.corpo);
      return {doc:d, tot, img};
    }).sort((a,b)=>b.tot-a.tot);
    const totale = dettagli.reduce((s,x)=>s+x.tot,0) + pesoDi(sezioni);
    const immagini = dettagli.reduce((s,x)=>s+x.img,0);
    return {dettagli, totale, immagini, testo: Math.max(0, totale-immagini), n: docs.length};
  },[documenti,sezioni]);

  const spostaDoc = (docId, destId) => {
    const d = documenti[docId];
    if(!d || !destId || d.sezioneId === destId) return;
    saveDoc(d.id, {...d, sezioneId: destId, aggiornato: nowISO()});
  };

  /* ═══ archivio e cestino ═══ */
  const eliminaDavvero = useCallback((id)=>{
    saveDoc(id, null);
    setTimeout(()=>{                       // via anche le copie di sicurezza di quel documento
      if(HAS_FB) fbDb.ref(ROOT+'/storico/'+id).remove().catch(()=>{});
      else { const st = local.get(ROOT+':storico') || {}; delete st[id]; local.set(ROOT+':storico', st); }
    }, 600);
  },[saveDoc]);

  /* all'apertura dell'app butto via quello che nel cestino ha passato i 30 giorni */
  useEffect(()=>{
    if(!pronto) return;
    const limite = Date.now() - GIORNI_CESTINO*86400000;
    const vecchio = t => { const n = new Date(t).getTime(); return !isNaN(n) && n < limite; };
    const scaduti = Object.values(documenti).filter(d=>d.cestinato && vecchio(d.cestinato));
    scaduti.forEach(d=>eliminaDavvero(d.id));
    Object.values(sezioni).forEach(x=>{ if(x.cestinata && vecchio(x.cestinata)) saveSez(x.id, null); });
  },[pronto,documenti,sezioni,eliminaDavvero,saveSez]);

  const cestinaDoc = (id) => {
    const d = documenti[id]; if(!d || d.cestinato) return;
    saveDoc(id, {...d, cestinato: nowISO(), archiviato: null, aggiornato: nowISO()});
  };
  const archiviaDoc = (id, si) => {
    const d = documenti[id]; if(!d) return;
    saveDoc(id, {...d, archiviato: si ? nowISO() : null, aggiornato: nowISO()});
  };
  /* riportando su un documento risalgo anche le sezioni che erano finite nel cestino con lui */
  const ripristinaSezione = (sid) => {
    const visti = {};
    let x = sezioni[sid];
    while(x && !visti[x.id]){
      visti[x.id] = true;
      if(x.cestinata) saveSez(x.id, {...x, cestinata: null});
      x = x.parentId ? sezioni[x.parentId] : null;
    }
  };
  const ripristinaDoc = (id) => {
    const d = documenti[id]; if(!d) return;
    let sid = d.sezioneId;
    if(!sezioni[sid]){
      const prima = Object.values(sezioni).find(x=>!x.cestinata);
      sid = prima ? prima.id : sid;                 // la sezione non c'è più: lo metto nella prima
    } else ripristinaSezione(sid);
    saveDoc(id, {...d, sezioneId: sid, cestinato: null, archiviato: null, aggiornato: nowISO()});
  };
  const svuotaCestino = () => {
    const dentro = Object.values(documenti).filter(d=>d.cestinato);
    const sez = Object.values(sezioni).filter(x=>x.cestinata);
    if(!dentro.length && !sez.length){ alert('Il cestino è già vuoto.'); return; }
    if(!confirm(`Eliminare per sempre ${dentro.length} document${dentro.length===1?'o':'i'}? Non si torna indietro.`)) return;
    dentro.forEach(d=>eliminaDavvero(d.id));
    sez.forEach(x=>saveSez(x.id, null));
    setSelDoc(null);
  };

  const doc = selDoc ? documenti[selDoc] : null;
  const sezCorrente = doc ? sezioni[doc.sezioneId] : (selSez!=='ATTIVITA'? sezioni[selSez] : null);

  const patchDoc = (patch) => {
    if(!doc) return;
    saveDoc(doc.id, {...doc, ...patch, aggiornato: nowISO()});
  };

  /* editor rich text con debounce
     Il testo in attesa è sempre legato al foglio da cui arriva (lo dice l'editor),
     non a quello aperto quando parte il timer. Cambiando foglio, quello in attesa si salva subito. */
  const bodyTimer = useRef(null);
  const corpoInAttesa = useRef(null);          // {id, html}
  const documentiRef = useRef(documenti);
  documentiRef.current = documenti;
  const salvaCorpo = () => {
    clearTimeout(bodyTimer.current);
    const p = corpoInAttesa.current;
    corpoInAttesa.current = null;
    if(!p) return;
    const d = documentiRef.current[p.id];
    if(!d || d.corpo === p.html) return;       // foglio sparito o niente di nuovo
    saveDoc(p.id, {...d, corpo:p.html, aggiornato: nowISO()});
  };
  const onBody = (html, idDoc) => {
    const id = idDoc || (doc && doc.id);
    if(!id) return;
    if(corpoInAttesa.current && corpoInAttesa.current.id !== id) salvaCorpo();   // mai mischiare due fogli
    corpoInAttesa.current = {id, html};
    clearTimeout(bodyTimer.current);
    bodyTimer.current = setTimeout(salvaCorpo, 700);
  };

  /* il disegno: salvato sul foglio da cui arriva, come il testo */
  const onDisegno = (dis, id) => {
    const d = documentiRef.current[id];
    if(!d) return;
    saveDoc(id, {...d, disegno: dis, aggiornato: nowISO()});
  };

  const onFoglio = (fg, id) => {
    const d = documentiRef.current[id];
    if(!d) return;
    saveDoc(id, {...d, foglio: fg, aggiornato: nowISO()});
  };

  /* cambiando documento, salvo subito quello che era in attesa (prima veniva buttato) */
  useEffect(()=>{ salvaCorpo(); },[selDoc]);
  salvaPrimaRef.current = salvaCorpo;
  useEffect(()=>{
    const via = () => salvaCorpo();
    const nascosta = () => { if(document.visibilityState === 'hidden') salvaCorpo(); };
    window.addEventListener('pagehide', via);
    document.addEventListener('visibilitychange', nascosta);
    return () => { window.removeEventListener('pagehide', via); document.removeEventListener('visibilitychange', nascosta); };
  },[]);

  const creaDoc = (tipo,tpl,titolo,dataRif) => {
    // se ho premuto ＋ su una cartella, il documento nasce lì
    const sid = cartella || ((selSez && sezioni[selSez] && !sezioni[selSez].cestinata)
      ? selSez : (sezList[0]&&sezList[0].id));
    if(!sid){ alert('Crea prima una sezione.'); return; }
    const d = emptyDoc(sid, tipo, tpl, dataRif);
    d.titolo = titolo || '';
    saveDoc(d.id, d);
    if(!sezioni[selSez]) setSelSez(sid);
    setSelDoc(d.id); setModalNew(false); setMobileView('doc'); setCartella(null);
  };

  const eliminaDoc = () => {
    if(!doc) return;
    const nome = doc.titolo || 'documento senza titolo';
    if(doc.cestinato){
      if(confirm(`Eliminare "${nome}" per sempre? Non si torna indietro.`)){ eliminaDavvero(doc.id); setSelDoc(null); }
      return;
    }
    if(confirm(`Mettere "${nome}" nel cestino? Resta lì ${GIORNI_CESTINO} giorni, poi sparisce da solo.`)){
      cestinaDoc(doc.id); setSelDoc(null);
    }
  };

  const duplicaDoc = () => {
    if(!doc) return;
    const d = {...JSON.parse(JSON.stringify(doc)), id:uid(), titolo:(doc.titolo||'Documento')+' (copia)',
      creato:nowISO(), aggiornato:nowISO(), data: today(), stato:'da preparare',
      cestinato:null, archiviato:null};
    if(doc.tipo==='piano'){ d.stato = 'in preparazione'; d.data = doc.data || ''; (d.contenuti||[]).forEach(c=>{ c.id = uid(); c.stato = 'idea'; }); }
    (d.azioni||[]).forEach(a=>{a.fatto=false;});
    saveDoc(d.id,d); setSelDoc(d.id);
  };

  const esportaSezione = async (formato) => {
    const lista = docList;
    if(!lista.length){ alert('Non c\'è niente da esportare.'); return; }
    const titolo = q.trim()? `Ricerca "${q}"` : (sezCorrente? sezCorrente.nome : APP_NOME);
    const inner = `<h1>${titolo}</h1>` + lista.map(d=>'<div class="doc-sep">'+applicaStampa(docToHtml(d, sezioni[d.sezioneId]), d.stampa)+'</div>').join('');
    if(formato==='word'){ exportWord(titolo, titolo, inner, fmt); return; }
    setPdfBusy(true);
    await exportPdf(titolo, inner, titolo, fmt);
    setPdfBusy(false);
  };

  if(user===undefined) return <div style={{padding:40,color:'var(--muted)'}}>Caricamento…</div>;
  if(HAS_FB && !user) return <div className="login-sfondo"><Login/></div>;
  if(HAS_FB && profilo===undefined) return <div style={{padding:40,color:'var(--muted)'}}>Caricamento…</div>;
  if(HAS_FB && !membro) return <div className="login-sfondo"><SchermoAttesa user={user} profilo={profilo}/></div>;
  const apriDoc = (d) => { setSelSez(d.sezioneId); setSelDoc(d.id); setQ(''); setMobileView('doc'); };

  /* ordine del giorno come testo semplice, per mandarlo in un messaggio */
  const testoOdg = (d) => {
    const righe = [];
    const info = [d.data ? fmtDate(d.data) : '', d.ora || '', d.luogo || ''].filter(Boolean).join(' · ');
    righe.push((d.titolo || 'Riunione') + (info ? ' — ' + info : ''));
    if(d.obiettivo) righe.push('Obiettivo: ' + d.obiettivo);
    righe.push('', 'Ordine del giorno:');
    (d.agenda || []).filter(p=>(p.titolo||'').trim() || (p.note||'').trim()).forEach((p, i)=>{
      righe.push(`${i + 1}. ${(p.titolo || '').trim()}`);
      (p.note || '').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>righe.push('   - ' + x));
    });
    return righe.join('\n');
  };
  const copiaOdg = async (d) => {
    const t = testoOdg(d);
    let ok = false;
    try{ await navigator.clipboard.writeText(t); ok = true; }catch(e){
      try{ const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0';
        document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); }catch(err){}
    }
    setOdgCopiato(ok ? 'ok' : 'err'); setTimeout(()=>setOdgCopiato(''), 2200);
  };
  const condividiOdg = async (d) => { try{ await navigator.share({ title: d.titolo || 'Ordine del giorno', text: testoOdg(d) }); }catch(e){} };

  /* ── colonna documento ── */
  const renderDoc = () => {
    if(selSez==='SPAZIO'){
      const perc = spazio.totale / LIMITE_DB * 100;
      const cls = perc > 80 ? ' alarm' : perc > 50 ? ' warn' : '';
      const quotaImg = spazio.totale ? Math.round(spazio.immagini/spazio.totale*100) : 0;
      return (
        <div className="actions-wrap">
          <h1 style={{fontFamily:'var(--serif)',fontSize:30,margin:'0 0 4px'}}>Spazio</h1>
          <p style={{color:'var(--muted)',marginTop:0}}>Quanto stanno occupando i tuoi documenti sul database.</p>

          <div className="spazio-hero">
            <div className="spazio-num">
              {fmtPeso(spazio.totale)}<small>su 1 GB disponibili</small>
            </div>
            <div className="barra"><i className={cls} style={{width: Math.max(0.4, Math.min(100, perc))+'%'}}></i></div>
            <div className="spazio-sub">
              {perc < 0.1 ? 'Meno dello 0,1% dello spazio' : `${perc.toFixed(perc<1?2:1).replace('.',',')}% dello spazio`}
              {' · '}restano {fmtPeso(Math.max(0, LIMITE_DB - spazio.totale))}
            </div>
          </div>

          <div className="quote">
            <div className="quota"><div className="k">Documenti</div><div className="v">{spazio.n}</div></div>
            <div className="quota"><div className="k">Testo</div><div className="v">{fmtPeso(spazio.testo)}</div></div>
            <div className="quota"><div className="k">Immagini</div><div className="v">{fmtPeso(spazio.immagini)}</div></div>
            <div className="quota"><div className="k">Peso medio</div><div className="v">{spazio.n? fmtPeso(Math.round(spazio.totale/spazio.n)) : '—'}</div></div>
          </div>

          {spazio.immagini > 0 && (
            <p className="spazio-sub" style={{marginTop:4}}>
              Le foto sono il {quotaImg}% del totale: è quasi sempre lì che cresce lo spazio.
            </p>
          )}

          <div className="sec-h"><h3>Documenti più pesanti</h3><div className="rule"></div></div>
          {spazio.dettagli.length===0 && <div className="empty"><strong>Ancora niente</strong>Il conto parte dal primo documento.</div>}
          {spazio.dettagli.slice(0,8).map(x=>(
            <div className="top-doc" key={x.doc.id}>
              <button className="link-btn t" style={{textAlign:'left'}}
                onClick={()=>{setSelSez(x.doc.sezioneId); setSelDoc(x.doc.id); setMobileView('doc');}}>
                {x.doc.titolo || 'Senza titolo'}
              </button>
              {x.img > 0 && <span className="img">{fmtPeso(x.img)} di foto</span>}
              <span className="p">{fmtPeso(x.tot)}</span>
            </div>
          ))}

          <div className="nota-box">
            Il conto è una stima calcolata sui documenti che hai qui: il valore ufficiale sta nella console
            Firebase, sotto Realtime Database → Utilizzo, e sarà un po' più alto perché include anche
            la struttura interna del database.<br/><br/>
            Oltre al limite di 1 GB, il piano gratuito dà 10 GB di traffico al mese. Ogni volta che apri
            l'app scarichi tutti i documenti, quindi con appunti di solo testo sei lontanissimo dal limite,
            mentre molte foto pesanti lo consumano più in fretta.
          </div>
        </div>
      );
    }

    if(selSez==='CALENDARIO')
      return <VistaCalendario documenti={documenti} sezioni={sezioni} onApri={apriDoc} saveDoc={saveDoc} ro={!puoScrivere}/>;
    if(selSez==='UTENTI' && HAS_FB && eAdmin) return <VistaUtenti io={user}/>;

    if(selSez==='ATTIVITA'){
      return (
        <div className="actions-wrap">
          <h1 style={{fontFamily:'var(--serif)',fontSize:30,margin:'0 0 4px'}}>Attività aperte</h1>
          <p style={{color:'var(--muted)',marginTop:0}}>Tutto quello che è rimasto da fare, da tutti i piani e le riunioni.</p>
          {azioniAperte.length===0 && <div className="empty"><strong>Niente in sospeso</strong>Le attività che segni nei piani e nelle riunioni compaiono qui.</div>}
          {azioniAperte.map(a=>{
            const dd = daysTo(a.scadenza);
            const cls = dd===null? '' : dd<0? ' late' : dd<=3? ' soon' : '';
            return (
              <div className="act" key={a.id}>
                <input type="checkbox" className="chk" style={{marginTop:2}} onChange={()=>{
                  const d = a.doc;
                  saveDoc(d.id, {...d, azioni:d.azioni.map(x=>x.id===a.id?{...x,fatto:true}:x), aggiornato:nowISO()});
                }}/>
                <div style={{flex:1,minWidth:0}}>
                  <div>{a.testo}</div>
                  <div className="src">
                    {a.macro && <span className="who">{a.macro} › </span>}
                    {a.responsabile && <span className="who">{a.responsabile} · </span>}
                    <button className="link-btn" onClick={()=>{setSelSez(a.doc.sezioneId); setSelDoc(a.doc.id); setMobileView('doc');}}>
                      {a.doc.titolo||'Documento senza titolo'}
                    </button>
                  </div>
                </div>
                <div className={'due'+cls}>
                  {a.scadenza ? fmtDate(a.scadenza) + (dd<0? ` · ${-dd}g fa` : dd===0? ' · oggi' : '') : '—'}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    if(!doc && (selSez==='CESTINO' || selSez==='ARCHIVIO')){
      const cest = selSez==='CESTINO';
      return (
        <div className="empty" style={{paddingTop:'20vh'}}>
          <strong>{cest? 'Cestino' : 'Archivio'}</strong>
          {cest
            ? `Quello che elimini resta qui ${GIORNI_CESTINO} giorni: aprilo per ripristinarlo, o eliminalo subito per sempre. Lo spazio si libera solo quando sparisce davvero.`
            : 'Documenti messi da parte: non compaiono negli elenchi, nella ricerca, nelle attività aperte né nei conteggi. Aprine uno per rimetterlo a posto.'}
        </div>
      );
    }

    if(!doc) return (
      <div className="empty" style={{paddingTop:'22vh'}}>
        <strong>Nessun documento aperto</strong>
        Scegli un documento a sinistra, oppure creane uno nuovo.
        <div className="solo-tel-blocco"><button className="btn" onClick={()=>setMobileView('nav')}>← Torna all'elenco</button></div>
      </div>
    );

    const isMeet = doc.tipo==='riunione';
    const isPiano = doc.tipo==='piano', isFoglio = doc.tipo==='foglio';
    const inner = () => applicaStampa(docToHtml(doc, sezioni[doc.sezioneId]), doc.stampa);
    const fname = (doc.titolo||'documento') + (doc.data? ' '+doc.data : '');

    return (
      <>
        <div className="doc-bar">
          <button className="btn ghost sm mobile-back" onClick={()=>setMobileView('nav')}>← Elenco</button>
          {isMeet && (
            <select className="btn sm" value={doc.stato} onChange={e=>patchDoc({stato:e.target.value})}>
              <option>da preparare</option><option>preparata</option><option>svolta</option>
            </select>
          )}
          {isPiano && (
            <select className="btn sm" value={doc.stato||'in preparazione'} onChange={e=>patchDoc({stato:e.target.value})}>
              <option>in preparazione</option><option>in corso</option><option>concluso</option>
            </select>
          )}
          <span className="spacer"></span>
          <span className="saved">{salvato}</span>
          <button className="btn sm hide-mobile" onClick={()=>setAnteprima(true)} title="Vedi le pagine e sistemale per la stampa">Anteprima</button>
          <button className="btn sm hide-mobile" onClick={()=>exportWord(fname, doc.titolo||'Documento', inner(), fmt)}>Word</button>
          <button className="btn sm hide-mobile" disabled={pdfBusy} onClick={async()=>{
            setPdfBusy(true);
            await exportPdf(doc.titolo||'Documento', inner(), fname, fmt);
            setPdfBusy(false);
          }}>{pdfBusy ? 'PDF…' : 'PDF'}</button>
          <button className="btn ghost sm hide-mobile" onClick={duplicaDoc} title="Duplica come nuovo">Duplica</button>
          {!doc.cestinato && <button className="btn ghost sm hide-mobile" onClick={()=>archiviaDoc(doc.id, !doc.archiviato)}
            title={doc.archiviato? 'Rimettilo negli elenchi' : 'Mettilo da parte senza eliminarlo'}>
            {doc.archiviato? 'Disarchivia' : 'Archivia'}</button>}
          <button className="btn ghost sm danger hide-mobile" onClick={eliminaDoc}>
            {doc.cestinato? 'Elimina per sempre' : 'Elimina'}</button>
          <div className="doc-menu" onClick={e=>e.stopPropagation()}>
            <button className="btn ghost sm" onClick={e=>{e.stopPropagation(); setMenuOpen(o=>!o);}} title="Altro">⋯</button>
            {menuOpen && (
              <div className="doc-menu-pop">
                <button className="solo-mobile" onClick={()=>{setMenuOpen(false); setAnteprima(true);}}>Anteprima di stampa</button>
                <button className="solo-mobile" disabled={pdfBusy} onClick={async()=>{ setMenuOpen(false); setPdfBusy(true);
                  await exportPdf(doc.titolo||'Documento', inner(), fname, fmt); setPdfBusy(false); }}>Esporta PDF</button>
                <button className="solo-mobile" onClick={()=>{setMenuOpen(false); exportWord(fname, doc.titolo||'Documento', inner(), fmt);}}>Esporta Word</button>
                <button onClick={()=>{setMenuOpen(false); setModalStorico(true);}}>Versioni precedenti…</button>
                <button onClick={()=>{setMenuOpen(false); setModalFmt(true);}}>Formato export…</button>
                <button onClick={()=>{setMenuOpen(false); duplicaDoc();}}>Duplica</button>
                {doc.cestinato
                  ? <button onClick={()=>{setMenuOpen(false); ripristinaDoc(doc.id);}}>Ripristina</button>
                  : <button onClick={()=>{setMenuOpen(false); archiviaDoc(doc.id, !doc.archiviato);}}>
                      {doc.archiviato? 'Togli dall\'archivio' : 'Archivia'}</button>}
                <button className="danger" onClick={()=>{setMenuOpen(false); eliminaDoc();}}>
                  {doc.cestinato? 'Elimina per sempre' : 'Elimina'}</button>
              </div>
            )}
          </div>
        </div>

        {!puoScrivere && <div className="banner-sola">Sei in sola lettura: puoi consultare, copiare ed esportare, ma non modificare.</div>}
        <div className={'doc'+(isFoglio?' doc-largo':'')}>
          {doc.cestinato && (
            <div className="banner-doc cest">
              <span>🗑 <b>Nel cestino</b> — si elimina da solo fra {giorniCestino(doc.cestinato)} giorni.</span>
              <span className="spacer"></span>
              <button className="btn sm" onClick={()=>ripristinaDoc(doc.id)}>Ripristina</button>
              <button className="btn sm danger" onClick={eliminaDoc}>Elimina per sempre</button>
            </div>
          )}
          {!doc.cestinato && doc.archiviato && (
            <div className="banner-doc arch">
              <span>📦 <b>Archiviato</b> — resta fuori dagli elenchi, dalla ricerca e dai conteggi.</span>
              <span className="spacer"></span>
              <button className="btn sm" onClick={()=>archiviaDoc(doc.id, false)}>Togli dall'archivio</button>
            </div>
          )}
          <input className="title-in" value={doc.titolo} placeholder="Titolo del documento"
            onChange={e=>patchDoc({titolo:e.target.value})}/>
          {doc.modDa && <div className="mod-da">Ultima modifica: {doc.modDa}{doc.aggiornato ? ' · ' + new Date(doc.aggiornato).toLocaleString('it-IT', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : ''}</div>}

          <div className="meta-grid">
            <div className="f">
              <label>Sezione</label>
              <select value={doc.sezioneId} onChange={e=>patchDoc({sezioneId:e.target.value})}>
                {radici.map(r=>[
                  <option key={r.id} value={r.id}>{r.nome}</option>,
                  ...figlieDi(r.id).map(f=><option key={f.id} value={f.id}>{'\u00a0\u00a0\u00a0'}↳ {f.nome}</option>)
                ])}
              </select>
            </div>
            <div className="f">
              <label>Tipo</label>
              <select value={doc.tipo||'nota'} onChange={e=>{
                // cambio tipo in corsa: non si perde niente, i campi dell'altro tipo restano salvati e tornano se ci ripensi
                const t = e.target.value, p = {tipo:t};
                if(t === 'riunione'){ if(!doc.stato) p.stato = 'da preparare'; if(!doc.data) p.data = today(); }
                if(t === 'disegno' && !doc.disegno) p.disegno = {tratti:[], h:1414, sfondo:'bianco'};
                if(t === 'piano'){ if(!doc.contenuti) p.contenuti = []; if(['in preparazione','in corso','concluso'].indexOf(doc.stato) < 0) p.stato = 'in preparazione'; }
                if(t === 'foglio' && !doc.foglio) p.foglio = MODELLI_FOGLIO.vuoto.crea();
                patchDoc(p);
              }}>
                <option value="piano">Piano</option>
                <option value="foglio">Foglio di calcolo</option>
                <option value="riunione">Riunione</option>
                <option value="nota">Appunto</option>
                <option value="disegno">Disegno</option>
              </select>
            </div>
            <div className="f"><label>{isPiano ? 'Data evento / lancio' : 'Data'}</label>
              <input type="date" value={doc.data||''} onChange={e=>patchDoc({data:e.target.value})}/></div>
            {isMeet && <div className="f"><label>Ora</label>
              <input type="time" value={doc.ora||''} onChange={e=>patchDoc({ora:e.target.value})}/></div>}
            {isMeet && <div className="f"><label>Luogo</label>
              <input value={doc.luogo||''} placeholder="Sede, sala civica, online…" onChange={e=>patchDoc({luogo:e.target.value})}/></div>}
            {isMeet && <div className="f" style={{gridColumn:'1 / -1'}}><label>Partecipanti</label>
              <input value={doc.partecipanti||''} placeholder="Nomi separati da virgola"
                onChange={e=>patchDoc({partecipanti:e.target.value})}/></div>}
            <div className="f" style={{gridColumn:'1 / -1'}}>
              <label>{isMeet?'Obiettivo della riunione':isPiano?'Obiettivo del piano':'In sintesi'}</label>
              <input value={doc.obiettivo||''} placeholder={isMeet?'Cosa deve uscire da questo incontro':isPiano?'Es. 2.000 presenze e 50 nuovi soci':'Una riga per ricordarti di cosa parla'}
                onChange={e=>patchDoc({obiettivo:e.target.value})}/>
            </div>
          </div>

          {isMeet && (
            <>
              <div className="sec-h"><h3>Ordine del giorno</h3><div className="rule"></div>
                {(doc.agenda||[]).some(p=>(p.titolo||'').trim()) && (<>
                  <button className="link-btn odg-btn" onClick={()=>copiaOdg(doc)} title="Copia l'ordine del giorno come testo, da incollare in un messaggio o in una mail">
                    {odgCopiato === 'ok' ? '✓ Copiato' : odgCopiato === 'err' ? 'Non riuscito' : '⧉ Copia'}</button>
                  {typeof navigator !== 'undefined' && navigator.share && (
                    <button className="link-btn odg-btn" onClick={()=>condividiOdg(doc)} title="Invia l'ordine del giorno con WhatsApp, Messaggi, mail…">↗ Invia</button>)}
                </>)}
              </div>
              {(doc.agenda||[]).map((p,i)=>(
                <AgendaRow key={p.id} p={p} i={i}
                  autofocus={focusId===p.id}
                  onEnter={()=>{
                    const nuovo={id:uid(),titolo:'',note:''};
                    const a=(doc.agenda||[]).slice(); a.splice(i+1,0,nuovo);
                    patchDoc({agenda:a}); setFocusId(nuovo.id);
                  }}
                  mv={{
                    onUp:()=>{ const a=doc.agenda.slice(); [a[i-1],a[i]]=[a[i],a[i-1]]; patchDoc({agenda:a}); },
                    onDown:()=>{ const a=doc.agenda.slice(); [a[i+1],a[i]]=[a[i],a[i+1]]; patchDoc({agenda:a}); },
                    primo: i===0, ultimo: i===doc.agenda.length-1
                  }}
                  onChange={np=>patchDoc({agenda:doc.agenda.map(x=>x.id===p.id?np:x)})}
                  onRemove={()=>patchDoc({agenda:doc.agenda.filter(x=>x.id!==p.id)})}/>
              ))}
              <button className="add-line" onClick={()=>{
                const n={id:uid(),titolo:'',note:''};
                patchDoc({agenda:[...(doc.agenda||[]), n]}); setFocusId(n.id);
              }}>+ Aggiungi punto</button>
            </>
          )}

          {doc.tipo==='disegno' ? (
            <>
              <div className="sec-h"><h3>Disegno</h3><div className="rule"></div></div>
              <Lavagna docKey={doc.id} value={doc.disegno} onChange={dis=>onDisegno(dis, doc.id)}/>
              <div className="sec-h"><h3>Appunti</h3><div className="rule"></div></div>
              <RichText docKey={doc.id} value={doc.corpo} onChange={onBody} ro={!puoScrivere} placeholder="Note sul disegno…"/>
            </>
          ) : isPiano ? (
            <>
              <div className="sec-h"><h3>Calendario dei contenuti</h3><div className="rule"></div></div>
              <PianoContenuti key={doc.id} doc={doc} ro={!puoScrivere} onChange={c=>patchDoc({contenuti:c})}/>
              <div className="sec-h"><h3>Strategia</h3><div className="rule"></div></div>
              <RichText docKey={doc.id} value={doc.corpo} onChange={onBody} ro={!puoScrivere} placeholder="Obiettivi, pubblico, messaggi, canali…"/>
            </>
          ) : isFoglio ? (
            <>
              <Foglio docKey={doc.id} value={doc.foglio} ro={!puoScrivere} onChange={fg=>onFoglio(fg, doc.id)}/>
              <div className="sec-h"><h3>Note</h3><div className="rule"></div></div>
              <RichText docKey={doc.id} value={doc.corpo} onChange={onBody} ro={!puoScrivere} placeholder="Spiegazioni, ipotesi, cose da ricordare…"/>
            </>
          ) : (
            <>
              <div className="sec-h"><h3>{isMeet?'Note della riunione':'Appunti'}</h3><div className="rule"></div></div>
              <RichText docKey={doc.id} value={doc.corpo} onChange={onBody} ro={!puoScrivere}
                placeholder={isMeet?'Cosa è stato detto, numeri, osservazioni…':'Scrivi qui…'}/>
            </>
          )}

          {isMeet && (
            <>
              <div className="sec-h"><h3>Decisioni</h3><div className="rule"></div></div>
              {(doc.decisioni||[]).map((d,i)=>(
                <div className="row" key={d.id}>
                  <div className="num">{i+1}</div>
                  <div className="body">
                    <AutoLine value={d.testo} placeholder="Cosa è stato deciso"
                      autofocus={focusId===d.id}
                      onEnter={()=>{
                        const nuova={id:uid(),testo:''};
                        const a=(doc.decisioni||[]).slice(); a.splice(i+1,0,nuova);
                        patchDoc({decisioni:a}); setFocusId(nuova.id);
                      }}
                      onChange={v=>patchDoc({decisioni:doc.decisioni.map(x=>x.id===d.id?{...x,testo:v}:x)})}/>
                  </div>
                  <Frecce primo={i===0} ultimo={i===doc.decisioni.length-1}
                    onUp={()=>{ const a=doc.decisioni.slice(); [a[i-1],a[i]]=[a[i],a[i-1]]; patchDoc({decisioni:a}); }}
                    onDown={()=>{ const a=doc.decisioni.slice(); [a[i+1],a[i]]=[a[i],a[i+1]]; patchDoc({decisioni:a}); }}/>
                  <button className="x" onClick={()=>patchDoc({decisioni:doc.decisioni.filter(x=>x.id!==d.id)})}>✕</button>
                </div>
              ))}
              <button className="add-line" onClick={()=>{
                const n={id:uid(),testo:''};
                patchDoc({decisioni:[...(doc.decisioni||[]), n]}); setFocusId(n.id);
              }}>+ Aggiungi decisione</button>
            </>
          )}

          {(() => {
            const tutte = (doc.azioni||[]).filter(a=>!a.macro && (a.testo||'').trim());
            const aperte = tutte.filter(a=>!a.fatto).length;
            return (
              <div className="sec-h">
                <h3>Attività</h3>
                {tutte.length > 0 && (
                  <button className="link-btn" onClick={()=>{
                    const tuttoFatto = aperte === 0;
                    patchDoc({azioni: doc.azioni.map(a=> a.macro ? a : {...a, fatto: !tuttoFatto})});
                  }}>{aperte === 0 ? 'togli tutte le spunte' : 'spunta tutte'}</button>
                )}
                {tutte.length > 0 && <span className="conta-att">{tutte.length - aperte} di {tutte.length}</span>}
                <div className="rule"></div>
              </div>
            );
          })()}
          {(() => {
            const az = doc.azioni || [];
            const set = (nuove) => patchDoc({azioni:nuove});
            const upd = (id, nv) => set(az.map(x=>x.id===id?nv:x));
            const figlie = (mid) => az.filter(x=>!x.macro && x.parentId===mid);
            const nuovaAz = (parentId=null) => ({id:uid(),testo:'',note:'',responsabile:'',scadenza:'',fatto:false,parentId});

            // blocchi di primo livello: una macro con le sue figlie, oppure un'attività singola
            const blocchi = [];
            az.forEach(a=>{
              if(a.macro) blocchi.push({capo:a, figlie:figlie(a.id)});
              else if(!a.parentId) blocchi.push({capo:a, figlie:[]});
            });
            const appiattisci = (bl) => bl.reduce((acc,b)=>acc.concat([b.capo], b.figlie), []);

            const muoviBlocco = (i, d) => {
              const j = i + d;
              if(j<0 || j>=blocchi.length) return;
              const bl = blocchi.slice();
              [bl[i], bl[j]] = [bl[j], bl[i]];
              set(appiattisci(bl));
            };
            const muoviFiglia = (bi, fi, d) => {
              const j = fi + d;
              const b = blocchi[bi];
              if(j<0 || j>=b.figlie.length) return;
              const bl = blocchi.map((x,k)=> k===bi ? {capo:x.capo, figlie:x.figlie.slice()} : x);
              const f = bl[bi].figlie;
              [f[fi], f[j]] = [f[j], f[fi]];
              set(appiattisci(bl));
            };

            const inserisciBlocco = (i) => {          // nuova attività di primo livello dopo il blocco i
              const nuova = nuovaAz();
              const bl = blocchi.slice();
              bl.splice(i+1, 0, {capo:nuova, figlie:[]});
              set(appiattisci(bl)); setFocusId(nuova.id);
            };
            const inserisciFiglia = (bi, pos) => {    // nuova sotto-attività dentro la macro bi
              const nuova = nuovaAz(blocchi[bi].capo.id);
              const bl = blocchi.map((x,k)=> k===bi ? {capo:{...x.capo, chiusa:false}, figlie:x.figlie.slice()} : x);
              bl[bi].figlie.splice(pos, 0, nuova);
              set(appiattisci(bl)); setFocusId(nuova.id);
            };

            return (
              <>
                {blocchi.map((b, i) => {
                  const mvBlocco = {
                    onUp:()=>muoviBlocco(i,-1), onDown:()=>muoviBlocco(i,1),
                    primo: i===0, ultimo: i===blocchi.length-1
                  };
                  if(!b.capo.macro){
                    return (
                      <ActionRow key={b.capo.id} a={b.capo} mv={mvBlocco}
                        autofocus={focusId===b.capo.id}
                        onEnter={()=>inserisciBlocco(i)}
                        onChange={nv=>upd(b.capo.id,nv)}
                        onRemove={()=>set(az.filter(x=>x.id!==b.capo.id))}/>
                    );
                  }
                  return (
                    <div key={b.capo.id}>
                      <MacroRow m={b.capo} totali={b.figlie.length} fatte={b.figlie.filter(x=>x.fatto).length}
                        mv={mvBlocco}
                        autofocus={focusId===b.capo.id}
                        chiusa={!!b.capo.chiusa}
                        onToggle={()=>upd(b.capo.id, {...b.capo, chiusa: !b.capo.chiusa})}
                        onEnter={()=>inserisciFiglia(i, b.figlie.length)}
                        onChange={nv=>upd(b.capo.id,nv)}
                        onSpuntaTutte={()=>{
                          const tuttoFatto = b.figlie.every(x=>x.fatto);
                          const ids = b.figlie.map(x=>x.id);
                          set(az.map(x=> ids.indexOf(x.id)>=0 ? {...x, fatto: !tuttoFatto} : x));
                        }}
                        onAdd={()=>inserisciFiglia(i, b.figlie.length)}
                        onRemove={()=>{
                          if(b.figlie.length && !confirm(`Eliminare "${b.capo.testo||'la macro-attività'}" e le sue ${b.figlie.length} sotto-attività?`)) return;
                          set(az.filter(x=>x.id!==b.capo.id && x.parentId!==b.capo.id));
                        }}/>
                      {!b.capo.chiusa && b.figlie.map((c, fi)=>(
                        <ActionRow key={c.id} a={c} sub
                          autofocus={focusId===c.id}
                          onEnter={()=>inserisciFiglia(i, fi+1)}
                          mv={{
                            onUp:()=>muoviFiglia(i,fi,-1), onDown:()=>muoviFiglia(i,fi,1),
                            primo: fi===0, ultimo: fi===b.figlie.length-1
                          }}
                          onChange={nv=>upd(c.id,nv)}
                          onRemove={()=>set(az.filter(x=>x.id!==c.id))}/>
                      ))}
                    </div>
                  );
                })}
                <div className="add-row">
                  <button className="add-line" onClick={()=>{ const n=nuovaAz(); set([...az,n]); setFocusId(n.id); }}>+ Aggiungi attività</button>
                  <button className="add-line alt" onClick={()=>{ const n={id:uid(),testo:'',note:'',macro:true}; set([...az,n]); setFocusId(n.id); }}>+ Aggiungi macro-attività</button>
                </div>
              </>
            );
          })()}
        </div>
      </>
    );
  };

  const mobileHide = (col) => (window.innerWidth<=900 && mobileView==='doc' && col!=='doc') ? ' hide-m'
    : (window.innerWidth<=900 && mobileView==='nav' && col==='doc') ? ' hide-m' : '';

  return (
    <div className={'app'+(puoScrivere?'':' sola')}>
      {/* colonna sezioni */}
      <div className={'col-sections'+mobileHide('nav')}>
        <div className="brand">
          <span className={'dot'+(HAS_FB?'':' off')} title={HAS_FB?'Sincronizzato':'Solo su questo dispositivo'}></span>
          <h1>{APP_NOME}</h1>
        </div>
        <div className="nav">
          <div className="nav-group">
            <button className={'nav-item'+(selSez==='CALENDARIO'?' on':'')} onClick={()=>{setSelSez('CALENDARIO');setSelDoc(null);setQ('');setMobileView('doc');}}>
              <span className="chip" style={{background:'#2b5d80'}}></span>
              <span className="name">Calendario</span>
              <span className="n">{prossimeUscite||''}</span>
            </button>
            <button className={'nav-item'+(selSez==='ATTIVITA'?' on':'')} onClick={()=>{setSelSez('ATTIVITA');setSelDoc(null);setQ('');setMobileView('doc');}}>
              <span className="chip" style={{background:'var(--amber)'}}></span>
              <span className="name">Attività aperte</span>
              <span className="n">{azioniAperte.length||''}</span>
            </button>
            <button className={'nav-item'+(selSez==='ARCHIVIO'?' on':'')} onClick={()=>{setSelSez('ARCHIVIO');setSelDoc(null);setQ('');setMobileView('nav');}}>
              <span className="chip" style={{background:'#5b7a8c'}}></span>
              <span className="name">Archivio</span>
              <span className="n">{nArchivio||''}</span>
            </button>
            <button className={'nav-item'+(selSez==='CESTINO'?' on':'')} onClick={()=>{setSelSez('CESTINO');setSelDoc(null);setQ('');setMobileView('nav');}}>
              <span className="chip" style={{background:'#b9c4bd'}}></span>
              <span className="name">Cestino</span>
              <span className="n">{nCestino||''}</span>
            </button>
            <button className={'nav-item'+(selSez==='SPAZIO'?' on':'')} onClick={()=>{setSelSez('SPAZIO');setSelDoc(null);setQ('');setMobileView('doc');}}>
              <span className="chip" style={{background:'var(--muted)'}}></span>
              <span className="name">Spazio</span>
              <span className="n">{fmtPeso(spazio.totale)}</span>
            </button>
            {HAS_FB && eAdmin && (
              <button className={'nav-item'+(selSez==='UTENTI'?' on':'')} onClick={()=>{setSelSez('UTENTI');setSelDoc(null);setQ('');setMobileView('doc');}}>
                <span className="chip" style={{background:'#7d5ba6'}}></span>
                <span className="name">Utenti</span>
              </button>
            )}
          </div>
          <div className="nav-group">
            <div className="nav-label">Sezioni</div>
            {radici.map(s=>(
              <button key={s.id} className={'nav-item'+(selSez===s.id?' on':'')+(dragSu===s.id?' drop':'')}
                onClick={()=>{setSelSez(s.id);setSelDoc(null);setQ('');setCartella(null);}}
                onDragOver={e=>{e.preventDefault(); setDragSu(s.id);}}
                onDragLeave={()=>setDragSu(null)}
                onDrop={e=>{e.preventDefault(); spostaDoc(e.dataTransfer.getData('text/plain'), s.id); setDragSu(null);}}>
                <span className="chip" style={{background:s.colore}}></span>
                <span className="name">{s.nome}</span>
                {todoRamo(s.id)>0 && <span className="n todo" title="cose ancora da fare qui dentro">{todoRamo(s.id)}</span>}
                <span className="n">{countRamo(s.id)||''}</span>
                <span className="edit" onClick={e=>{e.stopPropagation(); setModalSez({sezione:s});}}>✎</span>
              </button>
            ))}
            <button className="nav-add" onClick={()=>setModalSez({sezione:null})}>+ Nuova sezione</button>
          </div>
        </div>
        {HAS_FB && profilo && <div className="chi-sono" title={user.email}><b>{profilo.nome || user.email}</b> · {RUOLI[profilo.ruolo] || profilo.ruolo}</div>}
        {!HAS_FB && <div className="chi-sono" title="Manca la configurazione di Firebase in cima al file">Prova: dati solo su questo dispositivo</div>}
        <div className="sidebar-foot" {...(HAS_FB ? {style:{borderTop:0}} : {})}>
          <button onClick={()=>setModalFmt(true)}>Formato export</button>
          <button onClick={()=>setModalBlocco(true)} title="PIN e Face ID / Touch ID">Blocco</button>
          <button onClick={aggiornaApp} title={'Versione: ' + (window.APP_VER||'—') + ' — controlla e scarica l\'ultima'}>Aggiorna app</button>
          {HAS_FB && <button onClick={()=>fbAuth.signOut()}>Esci</button>}
        </div>
        <div className="sidebar-foot" style={{borderTop:0,paddingTop:0}}>
          <span className="ver" title="Versione del file caricato">{window.APP_VER||'—'}</span>
        </div>
      </div>

      {/* colonna elenco */}
      <div className={'col-list'+mobileHide('list')}>
        <div className="list-head">
          <h2>{q.trim()? 'Risultati' : selSez==='ATTIVITA'? 'Attività' : selSez==='SPAZIO'? 'Spazio' : selSez==='CALENDARIO'? 'Calendario' : selSez==='UTENTI'? 'Utenti'
             : selSez==='CESTINO'? 'Cestino' : selSez==='ARCHIVIO'? 'Archivio'
             : (sezCorrente? sezCorrente.nome : 'Documenti')}</h2>
          <p>{q.trim()? `${docList.length} documenti trovati`
             : selSez==='SPAZIO' ? 'Occupazione del database'
             : selSez==='ATTIVITA' ? 'Vista trasversale'
             : selSez==='CALENDARIO' ? 'Tutte le date in un colpo d\'occhio'
             : selSez==='UTENTI' ? 'Chi può entrare e cosa può fare'
             : selSez==='CESTINO' ? `${docList.length} document${docList.length===1?'o':'i'} · si eliminano da soli dopo ${GIORNI_CESTINO} giorni`
             : selSez==='ARCHIVIO' ? `${docList.length} document${docList.length===1?'o':'i'} messi da parte`
             : (sezCorrente&&sezCorrente.descrizione) || `${docList.length} documenti`}</p>
          <input className="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Cerca in tutti i documenti…"/>
        </div>
        {selMulti && (
          <div className="barra-sel">
            <span>{scelti.length} scelti</span>
            <button className="btn sm" disabled={!scelti.length}
              onClick={()=>setModalSposta({ids:scelti})}>Sposta in…</button>
            <button className="btn ghost sm" onClick={()=>{setSelMulti(false); setScelti([]);}}>Annulla</button>
          </div>
        )}
        {selSez==='CESTINO' ? (
          <div className="new-row">
            <span className="spazio-sub" style={{flex:1}}>Qui i documenti si recuperano per {GIORNI_CESTINO} giorni.</span>
            <button className="btn sm danger" disabled={!docList.length} onClick={svuotaCestino}>Svuota il cestino</button>
          </div>
        ) : selSez==='ARCHIVIO' ? (
          <div className="new-row">
            <span className="spazio-sub" style={{flex:1}}>Documenti messi da parte: restano fuori da elenchi, ricerca e conteggi.</span>
          </div>
        ) : (
        <div className="new-row">
          <button className="btn primary sm" style={{flex:1}} onClick={()=>setModalNew(true)}>+ Nuovo documento</button>
          <button className={'btn sm'+(selMulti?' primary':'')} title="Scegli più documenti da spostare"
            onClick={()=>{ setSelMulti(m=>!m); setScelti([]); }}>☑</button>
          <button className="btn sm" onClick={()=>esportaSezione('word')} title="Esporta l'elenco in Word">Word</button>
          <button className="btn sm" disabled={pdfBusy} onClick={()=>esportaSezione('pdf')} title="Esporta l'elenco in PDF">{pdfBusy?'PDF…':'PDF'}</button>
        </div>
        )}
        <div className="list">
          {!q.trim() && selSez && selSez!=='ATTIVITA' && selSez!=='SPAZIO' && selSez!=='CESTINO' && selSez!=='ARCHIVIO' && selSez!=='CALENDARIO' && selSez!=='UTENTI' && figlieDi(selSez).map(f=>{
            const dentro = Object.values(documenti)
              .filter(d=>d.sezioneId===f.id && !d.cestinato && !d.archiviato)
              .sort((a,b)=>((b.data||b.creato||'').localeCompare(a.data||a.creato||'')));
            const espansa = !!aperte[f.id];
            return (
              <div key={f.id} className={'gruppo-cart'+(espansa?' aperta':'')} style={{borderLeft:'3px solid '+f.colore}}>
                <button className={'riga-cart'+(dragSu===f.id?' drop':'')} style={{background: tinta(f.colore, espansa ? 0.09 : 0.055)}}
                  onClick={()=>apriChiudi(f.id)}
                  onDragOver={e=>{e.preventDefault(); setDragSu(f.id);}}
                  onDragLeave={()=>setDragSu(null)}
                  onDrop={e=>{
                    e.preventDefault();
                    const ids = e.dataTransfer.getData('text/plain').split(',').filter(Boolean);
                    ids.forEach(id=>spostaDoc(id, f.id));
                    setDragSu(null); setScelti([]);
                    setAperte(p=>({...p,[f.id]:true}));
                  }}>
                  <span className="tri">{espansa ? '▾' : '▸'}</span>
                  <span className="ic" style={{color:f.colore}}>▣</span>
                  <span className="t">{f.nome}</span>
                  {dentro.reduce((n,d)=>n+daFare(d),0) > 0 &&
                    <span className="q todo" title="cose ancora da fare in questa cartella">{dentro.reduce((n,d)=>n+daFare(d),0)}</span>}
                  <span className="q">{dentro.length || ''}</span>
                  <span className="ed" title="Nuovo documento qui"
                    onClick={e=>{e.stopPropagation(); setCartella(f.id); setAperte(p=>({...p,[f.id]:true})); setModalNew(true);}}>＋</span>
                  <span className="ed" title="Rinomina"
                    onClick={e=>{e.stopPropagation(); setModalSez({sezione:f});}}>✎</span>
                </button>
                {espansa && dentro.length === 0 && (
                  <div className="cart-vuota">Nessun documento — trascinane uno qui</div>
                )}
                {espansa && dentro.map(d=>{
                  const aperteAz = daFare(d);
                  return (
                    <button key={d.id} className={'card dentro'+(selDoc===d.id?' on':'')+(scelti.indexOf(d.id)>=0?' scelto':'')}
                      draggable
                      onDragStart={e=>{
                        const ids = scelti.indexOf(d.id)>=0 ? scelti : [d.id];
                        e.dataTransfer.setData('text/plain', ids.join(','));
                        e.dataTransfer.effectAllowed='move';
                      }}
                      onClick={e=>{
                        if(selMulti || e.ctrlKey || e.metaKey){
                          if(!selMulti) setSelMulti(true);
                          setScelti(p=> p.indexOf(d.id)>=0 ? p.filter(x=>x!==d.id) : [...p, d.id]);
                          return;
                        }
                        setSelDoc(d.id); setMobileView('doc');
                      }}>
                      {selMulti && <span className={'segno'+(scelti.indexOf(d.id)>=0?' on':'')}>✓</span>}
                      <div className="t">{d.titolo||'Senza titolo'}</div>
                      <div className="m">
                        {d.data && <span>{fmtDate(d.data)}</span>}
                        {d.tipo==='riunione' && <span className="tag meet">{d.stato||'riunione'}</span>}
                        {d.tipo==='disegno' && <span className="tag draw">disegno</span>}
                        {d.tipo==='piano' && <span className="tag piano">piano{(d.contenuti||[]).length ? ' · ' + (d.contenuti||[]).length + ' uscite' : ''}</span>}
                        {d.tipo==='foglio' && <span className="tag foglio">foglio</span>}
                        {aperteAz>0 && <span className="tag todo">{aperteAz} da fare</span>}
                      </div>
                      <span className="card-menu" title="Sposta"
                        onClick={e=>{e.stopPropagation(); setModalSposta({ids:[d.id]});}}>⋯</span>
                    </button>
                  );
                })}
              </div>
            );
          })}
          {docList.length===0 && !figlieDi(selSez||'').length && (
            <div className="empty">
              <strong>{q.trim()?'Nessun risultato'
                : selSez==='CESTINO'?'Cestino vuoto'
                : selSez==='ARCHIVIO'?'Archivio vuoto'
                : 'Sezione vuota'}</strong>
              {q.trim()?'Prova con un\'altra parola.'
                : selSez==='CESTINO'?'Qui finisce quello che elimini, e resta recuperabile per 30 giorni.'
                : selSez==='ARCHIVIO'?'Archivia un documento dal suo menu per toglierlo dagli elenchi senza perderlo.'
                : 'Crea il primo documento per iniziare.'}
            </div>
          )}
          {docList.map(d=>{
            // le macro-attività raggruppano soltanto: non sono cose da fare
            const aperte = daFare(d);
            return (
              <button key={d.id} className={'card'+(selDoc===d.id?' on':'')+(scelti.indexOf(d.id)>=0?' scelto':'')}
                draggable
                onDragStart={e=>{
                  const ids = scelti.indexOf(d.id)>=0 ? scelti : [d.id];
                  e.dataTransfer.setData('text/plain', ids.join(','));
                  e.dataTransfer.effectAllowed='move';
                }}
                onDragEnd={()=>setDragSu(null)}
                onClick={e=>{
                  if(selMulti || e.ctrlKey || e.metaKey){
                    if(!selMulti) setSelMulti(true);
                    setScelti(p=> p.indexOf(d.id)>=0 ? p.filter(x=>x!==d.id) : [...p, d.id]);
                    return;
                  }
                  setSelDoc(d.id); setMobileView('doc');
                }}>
                {selMulti && <span className={'segno'+(scelti.indexOf(d.id)>=0?' on':'')}>✓</span>}
                <div className="t">{d.titolo||'Senza titolo'}</div>
                <div className="m">
                  {d.data && <span>{fmtDate(d.data)}</span>}
                  {d.tipo==='riunione' && <span className="tag meet">{d.stato||'riunione'}</span>}
                        {d.tipo==='disegno' && <span className="tag draw">disegno</span>}
                        {d.tipo==='piano' && <span className="tag piano">piano{(d.contenuti||[]).length ? ' · ' + (d.contenuti||[]).length + ' uscite' : ''}</span>}
                        {d.tipo==='foglio' && <span className="tag foglio">foglio</span>}
                  {aperte>0 && !d.cestinato && <span className="tag todo">{aperte} da fare</span>}
                  {d.cestinato && <span className="tag cest">restano {giorniCestino(d.cestinato)} giorni</span>}
                  {!d.cestinato && d.archiviato && <span className="tag arch">archiviato</span>}
                  {(q.trim() || selSez==='CESTINO' || selSez==='ARCHIVIO') && sezioni[d.sezioneId] &&
                    <span>{sezioni[d.sezioneId].nome}</span>}
                </div>
                {(d.cestinato || d.archiviato) &&
                  <span className="card-az" title="Rimettilo al suo posto"
                    onClick={e=>{e.stopPropagation(); ripristinaDoc(d.id);}}>↩ ripristina</span>}
                <span className="card-menu" title="Sposta"
                  onClick={e=>{e.stopPropagation(); setModalSposta({ids:[d.id]});}}>⋯</span>
              </button>
            );
          })}
          {!cartella && !q.trim() && selSez && selSez!=='ATTIVITA' && selSez!=='SPAZIO' && selSez!=='CESTINO' && selSez!=='ARCHIVIO' && selSez!=='CALENDARIO' && selSez!=='UTENTI' && (
            <button className="riga-cart nuova" onClick={()=>setModalSez({sezione:null, parent:selSez})}>
              <span className="ic">＋</span><span className="t">Nuova cartella</span>
            </button>
          )}
        </div>
      </div>

      {/* colonna documento */}
      <div className={'col-doc'+mobileHide('doc')}>{renderDoc()}</div>

      {modalSez && (
        <SectionModal
          sezione={modalSez.sezione}
          radici={radici}
          figlieDi={figlieDi}
          parentIniziale={modalSez.parent}
          count={modalSez.sezione? countRamo(modalSez.sezione.id) : 0}
          onClose={()=>setModalSez(null)}
          onSave={vals=>{
            if(modalSez.sezione){ saveSez(modalSez.sezione.id, {...modalSez.sezione, ...vals}); }
            else { const id=uid(); saveSez(id,{id,...vals,ordine:sezList.length}); setSelSez(id); }
            setModalSez(null);
          }}
          onDelete={()=>{
            const sid = modalSez.sezione.id;
            const ids = ramoDi(sid);
            const ora = nowISO();
            Object.values(documenti)
              .filter(d=>ids.indexOf(d.sezioneId)>=0 && !d.cestinato)
              .forEach(d=>saveDoc(d.id,{...d, cestinato: ora, aggiornato: ora}));
            ids.forEach(x=>{ const sez = sezioni[x]; if(sez) saveSez(x, {...sez, cestinata: ora}); });
            setModalSez(null);
            if(ids.indexOf(selSez)>=0){ setSelSez(null); setSelDoc(null); }
          }}/>
      )}
      {modalNew && <NewDocModal onCreate={creaDoc} onClose={()=>setModalNew(false)}/>}
      {modalFmt && <FormatoModal fmt={fmt} onSave={salvaFmt} onClose={()=>setModalFmt(false)}/>}
      {modalBlocco && <ImpostazioniBlocco email={user && user.email} onClose={()=>setModalBlocco(false)}/>}
      {nuovaVer && rimandata !== nuovaVer && (
        <div className="agg-pop">
          <div className="agg-box">
            <h3>Nuova versione disponibile</h3>
            <p>È pronta una versione aggiornata dell'app:</p>
            <p className="ver-nuova">{nuovaVer}</p>
            <p style={{fontSize:12.5,color:'var(--muted)',marginTop:10}}>Ora stai usando: {window.APP_VER||'—'}.<br/>Quello che stai scrivendo viene salvato prima di aggiornare.</p>
            <div className="modal-foot" style={{justifyContent:'center'}}>
              <button className="btn" disabled={aggiorno} onClick={()=>setRimandata(nuovaVer)}>Più tardi</button>
              <button className="btn primary" disabled={aggiorno} onClick={aggiornaOra}>{aggiorno ? 'Salvo e aggiorno…' : 'Aggiorna ora'}</button>
            </div>
          </div>
        </div>
      )}
      {bloccato && bloccoCfg() && <SchermoBlocco cfg={bloccoCfg()} onSblocca={()=>setBloccato(false)}
        onPassword={()=>{ local.set(BLOCCO_KEY, null); setBloccato(false); if(HAS_FB) fbAuth.signOut(); }}/>}
      {modalSposta && (
        <SpostaModal quanti={modalSposta.ids.length} radici={radici} figlieDi={figlieDi}
          correnteId={cartella || selSez}
          onClose={()=>setModalSposta(null)}
          onSposta={(destId)=>{
            modalSposta.ids.forEach(id=>spostaDoc(id, destId));
            setModalSposta(null); setScelti([]); setSelMulti(false);
          }}/>
      )}
      {anteprima && doc && <AnteprimaStampa doc={doc} sezione={sezioni[doc.sezioneId]} fmt={fmt}
        onClose={()=>setAnteprima(false)}
        onSave={(st, resta)=>{ patchDoc({stampa: st}); if(!resta) setAnteprima(false); }}/>}
      {modalStorico && doc && (
        <StoricoModal doc={doc} onClose={()=>setModalStorico(false)}
          onRipristina={(v)=>{
            saveDoc(doc.id, {...doc, corpo: v.corpo, titolo: v.titolo || doc.titolo,
              agenda: v.agenda || doc.agenda, decisioni: v.decisioni || doc.decisioni,
              azioni: v.azioni || doc.azioni, aggiornato: nowISO()});
            setModalStorico(false);
            setSelDoc(null); setTimeout(()=>setSelDoc(doc.id), 60);   // ricarico l'editor
          }}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
