  const bloccoTenendoCursore = (c, v) => {
    const sel = window.getSelection();
    let segni = false;
    if(sel && sel.rangeCount && ref.current.contains(sel.anchorNode)){
      const r = sel.getRangeAt(0);
      const m1 = document.createElement('span'); m1.setAttribute('data-seg','a'); m1.textContent = '​';
      const m2 = document.createElement('span'); m2.setAttribute('data-seg','b'); m2.textContent = '​';
      try{
        const rb = r.cloneRange(); rb.collapse(false); rb.insertNode(m2);
        const ra = r.cloneRange(); ra.collapse(true); ra.insertNode(m1);
        const nr = document.createRange(); nr.setStartBefore(m1); nr.setEndAfter(m2);
        sel.removeAllRanges(); sel.addRange(nr);
        segni = true;
      }catch(err){ m1.remove(); m2.remove(); }
    }
    document.execCommand(c, false, v || null);
    riordinaBlocchi();
    if(!segni) return;
    const a = ref.current.querySelector('[data-seg="a"]'), b = ref.current.querySelector('[data-seg="b"]');
    try{
      if(a && b){
        const nr = document.createRange(); nr.setStartAfter(a); nr.setEndBefore(b);
        sel.removeAllRanges(); sel.addRange(nr);
      }
    }catch(err){}
    ref.current.querySelectorAll('[data-seg]').forEach(m=>{
      const p = m.parentNode; m.remove();
      if(p && p.nodeType === 1 && /^(P|DIV|LI|H1|H2|H3|H4|H5|H6|SPAN|B|I|U)$/.test(p.tagName) && !p.textContent && !p.querySelector('br,img')) p.appendChild(document.createElement('br'));
    });
    if(a && b && sel.rangeCount){                         // il cursore deve restare dentro un nodo di testo vero
      const r = sel.getRangeAt(0);
      if(r.collapsed && r.startContainer.nodeType === 1){
        const figli = r.startContainer.childNodes, i = r.startOffset;
        const t = (figli[i-1] && figli[i-1].nodeType === 3) ? [figli[i-1], figli[i-1].length] : (figli[i] && figli[i].nodeType === 3 ? [figli[i], 0] : null);
        if(t){ const nr = document.createRange(); nr.setStart(t[0], t[1]); nr.collapse(true); sel.removeAllRanges(); sel.addRange(nr); }
      }
    }
  };

  /* il contenitore di righe in cui sta il cursore: il foglio, un gruppo o una cella */
  const contenitoreDelCursore = (nodo) => {
    const sel = window.getSelection();
    let n = nodo || (sel && sel.anchorNode);
    if(!n || !ref.current.contains(n)) return ref.current;
    if(n.nodeType === 3) n = n.parentElement;
    while(n && n !== ref.current && !n.classList.contains('grp-c') && n.tagName !== 'TD' && n.tagName !== 'TH')
      n = n.parentElement;
    return n || ref.current;
  };

  /* dopo un comando di blocco rimetto in ordine: elenchi fuori dai paragrafi
     e righe rimaste sciolte di nuovo dentro un paragrafo loro */
  const riordinaBlocchi = () => {
    sistemaElenchi();
    impaginaSciolti(contenitoreDelCursore());
  };

  /* ═══ più pezzi di testo selezionati insieme (Ctrl o Cmd + selezione, come in Word) ═══
     Il browser tiene una selezione sola: quelle fatte prima, tenendo premuto Ctrl/Cmd, le conservo io,
     le mostro evidenziate e gli strumenti di formato le applicano a tutte. */
  const altreSel = useRef([]);
  const inMultiplo = useRef(false);
  const disegnaAltreSel = () => {
    try{
      if(!(window.CSS && CSS.highlights && window.Highlight)) return;
      if(altreSel.current.length) CSS.highlights.set('quaderno-multi', new Highlight(...altreSel.current));
      else CSS.highlights.delete('quaderno-multi');
    }catch(e){}
  };
  const svuotaAltreSel = () => { if(altreSel.current.length){ altreSel.current = []; disegnaAltreSel(); } };
  const uguali = (a, b) => a.compareBoundaryPoints(Range.START_TO_START, b) === 0 && a.compareBoundaryPoints(Range.END_TO_END, b) === 0;
  const suOgniSelezione = (fn) => {
    if(inMultiplo.current || !altreSel.current.length) return false;
    const sel = window.getSelection();
    const tutte = altreSel.current.filter(r=>r.startContainer.isConnected && !r.collapsed);
    let cur = null;
    if(sel.rangeCount && ref.current.contains(sel.getRangeAt(0).commonAncestorContainer)) cur = sel.getRangeAt(0);
    else if(rangeRef.current) cur = rangeRef.current;
    if(cur && !cur.collapsed && !tutte.some(r=>uguali(r, cur))) tutte.push(cur.cloneRange());
    // dall'ultima alla prima: così le modifiche non spostano quelle ancora da fare
    tutte.sort((a, b)=>b.compareBoundaryPoints(Range.START_TO_START, a));
    inMultiplo.current = true;
    try{
      tutte.forEach(r=>{ try{ ref.current.focus(); sel.removeAllRanges(); sel.addRange(r); salvaRange(); fn(); }catch(e){} });
    } finally { inMultiplo.current = false; svuotaAltreSel(); }
    return true;
  };

  const cmd = (c,v)=>{
    if(suOgniSelezione(()=>cmd(c, v))) return;
    if(STILE_CMD[c] && applicaStileCelle(STILE_CMD[c], true)) return;   // celle selezionate
    ref.current.focus();
    /* grassetto e corsivo li metto io, pezzo per pezzo: il comando del browser non riusciva a cambiare
       il testo che ha già uno stile suo (es. "font-weight: 400" lasciato dal pennello o da un copia-incolla),
       e Ctrl+B sembrava non fare niente */
    if(c === 'bold' || c === 'italic'){
      const sl = window.getSelection();
      if(sl && sl.rangeCount && !sl.isCollapsed && ref.current.contains(sl.getRangeAt(0).commonAncestorContainer)){
        const pezzi = testiNelRange(sl.getRangeAt(0)).filter(p=>p.nodo.textContent.slice(p.a, p.b).trim());
        if(pezzi.length){
          const tutti = pezzi.every(p=>{ const cs = getComputedStyle(p.nodo.parentElement);
            return c === 'bold' ? eGrassetto(cs.fontWeight) : (cs.fontStyle === 'italic' || cs.fontStyle === 'oblique'); });
          const st = c === 'bold' ? {fontWeight: tutti ? 'normal' : 'bold'} : {fontStyle: tutti ? 'normal' : 'italic'};
          if(applicaStileTesto(st)){ setTimeout(aggiornaFmtVisto, 0); return; }
        }
      }
    }
    // elenchi e titoli valgono solo per la riga del cursore, non per quelle scritte sopra
    const eBlocco = /^(insertUnorderedList|insertOrderedList|formatBlock)$/.test(c);
    if(eBlocco){ perRigheProprie(); bloccoTenendoCursore(c, v); }
    else document.execCommand(c,false,v||null);
    emit();
    if(c === 'insertOrderedList') setTimeout(()=>proponiNumerazione(), 0);
  };

  /* applica stili alle celle selezionate, senza entrarci dentro (come nel foglio di calcolo) */
  const celleScelte = () => {
    const vive = selRef.current.filter(td=>td.isConnected);
    if(modo === 'sel') return vive;
    // sto scrivendo dentro una cella: se non ho selezionato del testo, il comando vale per tutta la cella
    const sel = window.getSelection();
    const cella = cellFromSelection();
    if(cella && (!sel || sel.isCollapsed)) return [cella];
    return [];
  };
  const applicaStileCelle = (stile, alterna) => {
    const celle = celleScelte();
    if(!celle.length) return false;
    celle.forEach(td=>{
      Object.entries(stile).forEach(([k,v])=>{
        const attuale = td.style[k];
        if(alterna && attuale === v) td.style.removeProperty(k.replace(/[A-Z]/g, m=>'-'+m.toLowerCase()));
        else td.style[k] = v;
      });
    });
    emit(true);
    return true;
  };

  /* applica stili al testo selezionato avvolgendolo, senza dipendere dai comandi del browser */
  /* stile su un pezzo di testo selezionato (colore, corpo, carattere…).
     Pezzo di testo per pezzo di testo: una selezione su più paragrafi o voci d'elenco
     resta com'era come struttura (prima veniva estratta e rimessa tutta in una riga). */
  /* ═══ niente stili doppi uno dentro l'altro ═══
     Cambiando il corpo a un testo che stava già in uno span con un altro corpo, il vecchio
     restava "fuori": il testo si vedeva giusto ma la riga restava alta come il corpo vecchio
     (righe a distanze diverse, caselle storte). Ora il vecchio stile viene tolto da sopra. */
  const kebab = k => k.replace(/[A-Z]/g, m=>'-'+m.toLowerCase());
  const spezzaIntorno = (A, figlio) => {
    // divide A in [prima][A con solo figlio][dopo], tenendo lo stesso stile sui pezzi fuori
    const prima = document.createRange(); prima.setStart(A, 0); prima.setEndBefore(figlio);
    const dopo = document.createRange(); dopo.setStartAfter(figlio); dopo.setEnd(A, A.childNodes.length);
    const fPrima = prima.extractContents(), fDopo = dopo.extractContents();
    const pieno = f => f.textContent.length > 0 || (f.querySelector && f.querySelector('img,br'));
    if(pieno(fPrima)){ const c = A.cloneNode(false); c.appendChild(fPrima); A.parentNode.insertBefore(c, A); }
    if(pieno(fDopo)){ const c = A.cloneNode(false); c.appendChild(fDopo); A.parentNode.insertBefore(c, A.nextSibling); }
  };
  const togliStileSopra = (sp, chiavi) => {
    let figlio = sp, A = sp.parentElement;
    while(A && A !== ref.current && !RX_BLOCCO_TESTO.test(A.tagName)){
      const su = A.parentElement;
      if(A.tagName === 'SPAN' && !A.className && chiavi.some(k=>A.style[k])){
        spezzaIntorno(A, figlio);
        chiavi.forEach(k=>A.style.removeProperty(kebab(k)));
        if(!A.getAttribute('style')){                  // span rimasto senza stile: lo tolgo
          while(A.firstChild) A.parentNode.insertBefore(A.firstChild, A);
          A.remove();
        } else figlio = A;
      } else figlio = A;
      A = su;
    }
  };
  /* pulizia dei documenti già scritti: uno span che ha il corpo (o il carattere) ma il cui testo
     ha tutto un corpo suo più interno non serve a niente, e allarga la riga: lo tolgo */
  const pulisciStiliDoppi = () => {
    if(!ref.current) return false;
    let cambiato = false;
    ['fontSize','fontFamily'].forEach(k=>{
      Array.from(ref.current.querySelectorAll('span[style]')).reverse().forEach(A=>{
        if(!A.isConnected || !A.style[k] || A.className) return;
        const w = document.createTreeWalker(A, NodeFilter.SHOW_TEXT);
        let t, tutti = true, alcuno = false;
        while((t = w.nextNode())){
          if(!t.textContent.length) continue;
          alcuno = true;
          let x = t.parentElement, coperto = false;
          while(x && x !== A){ if(x.style && x.style[k]){ coperto = true; break; } x = x.parentElement; }
          if(!coperto){ tutti = false; break; }
        }
        if(alcuno && tutti){
          A.style.removeProperty(kebab(k));
          if(!A.getAttribute('style')){ while(A.firstChild) A.parentNode.insertBefore(A.firstChild, A); A.remove(); }
          cambiato = true;
        }
      });
    });
    return cambiato;
  };

  const applicaStileTesto = (stile) => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount || sel.isCollapsed) return false;
    const r = sel.getRangeAt(0);
    if(!ref.current.contains(r.commonAncestorContainer)) return false;
    const pezzi = testiNelRange(r);
    if(!pezzi.length) return false;
    const spans = [];
    try{
      pezzi.forEach(pz=>{
        let t = pz.nodo;
        if(pz.b < t.textContent.length) t.splitText(pz.b);
        if(pz.a > 0) t = t.splitText(pz.a);
        const sp = document.createElement('span');
        Object.entries(stile).forEach(([k,v])=>{ if(v) sp.style[k] = v; });
        t.parentNode.insertBefore(sp, t);
        sp.appendChild(t);
        spans.push(sp);
      });
      const chiavi = Object.keys(stile).filter(k=>stile[k]);
      spans.forEach(sp=>togliStileSopra(sp, chiavi));
      const padri = new Set(spans.map(x=>x.parentNode));
      unisciSpanUguali(padri);
      const vivi = spans.filter(x=>x.isConnected);
      const nr = document.createRange();
      nr.setStartBefore(vivi[0]); nr.setEndAfter(vivi[vivi.length-1]);
      sel.removeAllRanges(); sel.addRange(nr);
    }catch(err){ return false; }
    emit(true);
    return true;
  };

  /* il tocco su un pulsante fa perdere la selezione: la salvo e la rimetto */
  const rangeRef = useRef(null);
  const salvaRange = () => {
    const sel = window.getSelection();
    if(sel && sel.rangeCount && ref.current && ref.current.contains(sel.anchorNode)){
      rangeRef.current = sel.getRangeAt(0).cloneRange();
    }
  };
  const ripristinaRange = () => {
    const r = rangeRef.current;
    if(!r) return;
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  };

  /* colore del testo ed evidenziatore: servono gli stili CSS, non i vecchi tag <font> */
  const cmdCss = (c,v)=>{
    if(suOgniSelezione(()=>cmdCss(c, v))) return;
    if(c === 'foreColor' && applicaStileCelle({color:v})) { setPal(null); return; }
    ref.current.focus(); ripristinaRange();
    if(c === 'foreColor' && applicaStileTesto({color:v})) { setPal(null); return; }
    try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
    document.execCommand(c, false, v);
    try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
    emit(); setPal(null);
  };
  const apriSelettore = (target) => {
    targetRef.current = target;
    salvaRange();
    const attuale = target==='evid' ? '#fcf3b0' : '#17211d';
    colorRef.current.value = attuale;
    colorRef.current.click();
  };
  const coloreScelto = (v) => {
    ricorda(v);
    if(targetRef.current==='cella'){ ricordaCella(v); coloraCelle(v); }
    else if(targetRef.current==='evid'){ ricordaEvid(v); evidenzia(v); }
    else { ricordaTesto(v); cmdCss('foreColor', v); }
  };

  const evidenzia = (v) => {
    if(suOgniSelezione(()=>evidenzia(v))) return;
    if(applicaStileCelle({backgroundColor: v === 'transparent' ? '' : v})) { setPal(null); return; }
    ref.current.focus(); ripristinaRange();
    if(v !== 'transparent' && applicaStileTesto({backgroundColor:v})) { setPal(null); return; }
    try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
    if(!document.execCommand('hiliteColor', false, v)) document.execCommand('backColor', false, v);
    try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
    emit(); setPal(null);
  };

  /* blocchi (paragrafi, voci di elenco, titoli) toccati dalla selezione */
  const blocchiSelezionati = () => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount || !ref.current.contains(sel.anchorNode)) return [];
    const su = (n) => {
      while(n && n!==ref.current){
        if(n.nodeType===1 && /^(P|DIV|LI|H2|H3|BLOCKQUOTE|TD|TH|TABLE)$/.test(n.tagName)) return n;
        n = n.parentNode;
      }
      return null;
    };
    const r = sel.getRangeAt(0);
    const a = su(r.startContainer), b = su(r.endContainer);
    if(!a && !b) return [ref.current];
    if(a===b || !b) return [a].filter(Boolean);
    const tutti = Array.from(ref.current.querySelectorAll('p,div,li,h2,h3,blockquote,table'));
    const i = tutti.indexOf(a), j = tutti.indexOf(b);
    if(i<0 || j<0) return [a,b].filter(Boolean);
    let lista = tutti.slice(Math.min(i,j), Math.max(i,j)+1);

    // trascinando fin sotto l'ultima riga il cursore finisce all'inizio del blocco successivo:
    // se in quel blocco non è stato preso nemmeno un carattere, non fa parte della selezione
    if(!sel.isCollapsed && lista.length > 1 && lista[lista.length-1] === b){
      const dentroUltimo = document.createRange();
      dentroUltimo.selectNodeContents(b);
      dentroUltimo.setEnd(r.endContainer, r.endOffset);
      if(!dentroUltimo.toString().replace(/\u00a0/g,'').trim()) lista = lista.slice(0, -1);
    }
    return lista;
  };

  /* ═══ blocchi toccati dalla selezione ═══
     Restituisce SOLO i blocchi in cui la selezione prende davvero del testo.
     Un elenco conta come un blocco unico; dentro una cella si resta dentro la cella. */
  const blocchiDiPrimoLivello = () => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount || !ref.current) return [];
    const r = sel.getRangeAt(0);
    if(!ref.current.contains(r.commonAncestorContainer)) return [];
    let cont = r.commonAncestorContainer;
    if(cont.nodeType === 3) cont = cont.parentElement;
    cont = (cont.closest && cont.closest('.grp-c, td, th, li')) || ref.current;
    if(cont.tagName === 'LI') cont = cont.closest('.grp-c, td, th') || ref.current;
    if(!ref.current.contains(cont)) cont = ref.current;

    return Array.from(cont.children).filter(el=>{
      if(el.nodeType !== 1) return false;
      let tocca = false;
      try{ tocca = r.intersectsNode(el); }catch(err){ tocca = false; }
      if(!tocca) return false;
      if(sel.isCollapsed) return true;
      /* quanto testo di questo blocco è davvero selezionato: se nulla, il blocco resta fuori.
         È il caso della selezione che arriva fino all'inizio della riga successiva. */
      try{
        const inter = document.createRange();
        inter.selectNodeContents(el);
        if(inter.compareBoundaryPoints(Range.START_TO_START, r) < 0) inter.setStart(r.startContainer, r.startOffset);
        if(inter.compareBoundaryPoints(Range.END_TO_END, r) > 0) inter.setEnd(r.endContainer, r.endOffset);
        if(inter.collapsed) return false;
        if(inter.toString().replace(/\u00a0/g,'').trim()) return true;
        return !!el.querySelector('table,img');
      }catch(err){ return true; }
    });
  };

  const dentroGruppo = () => {
    const sel = window.getSelection();
    let n = sel && sel.anchorNode;
    if(n && n.nodeType === 3) n = n.parentElement;
    return (n && ref.current.contains(n)) ? n.closest('.grp') : null;
  };

  /* ═══ raggruppamento ═══
     Regola: se c'è una selezione, entra nel gruppo SOLO quello che è selezionato.
     Le scorciatoie (tabella o elenco con il titolo di sopra) valgono solo col semplice cursore. */
  const eBloccoVuoto = el => !el.textContent.replace(/\u00a0/g,'').trim() && !el.querySelector('table,img');

  const montaGruppo = (titoloHtml, corpi, titoloEl, daTogliere) => {
    if(!corpi.length) return false;
    const ancora = corpi[0];
    if(!ancora.parentNode) return false;
    const grp = document.createElement('div'); grp.className = 'grp';
    const tit = document.createElement('div'); tit.className = 'grp-t';
    const cnt = document.createElement('div'); cnt.className = 'grp-c';
    tit.innerHTML = titoloHtml || 'Titolo del gruppo';
    ancora.parentNode.insertBefore(grp, ancora);
    grp.appendChild(tit);
    corpi.forEach(b=>cnt.appendChild(b));
    grp.appendChild(cnt);
    (daTogliere||[]).forEach(el=>{ if(el.parentNode) el.remove(); });
    if(titoloEl && titoloEl.parentNode) titoloEl.remove();
    rigaSottoGruppi();
    puliscoSel(); setInTable(false); setTblBox(null);
    emit(true);
    return true;
  };

  /* prende la riga sopra come titolo, saltando le righe vuote lasciate dall'editor */
  const conTitoloSopra = (corpo, nomeDiScorta) => {
    let prima = corpo.previousElementSibling;
    const daTogliere = [];
    while(prima && eBloccoVuoto(prima) && !prima.classList.contains('grp')){
      daTogliere.push(prima);
      prima = prima.previousElementSibling;
    }
    const valido = prima && !prima.classList.contains('grp') && prima.tagName !== 'TABLE' && !eBloccoVuoto(prima);
    return montaGruppo(valido ? prima.innerHTML : nomeDiScorta, [corpo], valido ? prima : null, daTogliere);
  };

  /* ═══ contenitori "invisibili" ═══
     Il testo incollato da Word o da una pagina web arriva spesso chiuso dentro un <div> unico:
     a video non si vede, ma per l'editor tutto il documento diventava UN blocco solo, e
     "Raggruppa" non riusciva a prendere le singole sezioni. Qui quei contenitori vengono aperti
     (il contenuto resta identico) e si tolgono gli avanzi di Word e i gruppi vuoti. */
  const RX_DENTRO_BLOCCHI = /^(P|DIV|H1|H2|H3|H4|H5|H6|UL|OL|TABLE|BLOCKQUOTE|PRE|FIGURE|HR|SECTION|ARTICLE)$/;
  const srotolaContenitori = (radice) => {
    const root = radice || ref.current;
    if(!root) return false;
    let cambiato = false, giro = true;
    while(giro){
      giro = false;
      Array.from(root.querySelectorAll('div, section, article')).forEach(el=>{
        if(!el.isConnected || el.className || el.closest('td,th,figure')) return;
        const p = el.parentElement;
        if(!p || !(p === root || p.classList.contains('grp-c'))) return;   // solo quelli al primo livello del foglio o di un gruppo
        if(!Array.from(el.children).some(c=>RX_DENTRO_BLOCCHI.test(c.tagName))) return;
        const stile = el.getAttribute('style');
        while(el.firstChild){
          const c = el.firstChild;
          // il testo sciolto del contenitore va in un paragrafo suo
          if(c.nodeType === 3 && c.textContent.trim()){ const pp = document.createElement('p'); pp.appendChild(c); if(stile) pp.setAttribute('style', stile); p.insertBefore(pp, el); }
          else if(c.nodeType === 3 || c.nodeType === 8) c.remove();
          else p.insertBefore(c, el);
        }
        el.remove();
        cambiato = giro = true;
      });
    }
    return cambiato;
  };
  const sistemaGruppi = () => {
    if(!ref.current) return false;
    let cambiato = false;
    // avanzi di Word (commenti condizionali) e paragrafi rimasti vuoti per colpa loro
    const w = document.createTreeWalker(ref.current, NodeFilter.SHOW_COMMENT);
    const commenti = []; let c; while((c = w.nextNode())) commenti.push(c);
    commenti.forEach(x=>{ const pp = x.parentNode; x.remove(); cambiato = true;
      if(pp && pp !== ref.current && pp.tagName === 'P' && !pp.textContent.trim() && !pp.querySelector('img,br,table')) pp.remove(); });
    Array.from(ref.current.querySelectorAll('.grp')).forEach(g=>{
      if(!g.isConnected) return;
      let t = Array.from(g.children).find(x=>x.classList.contains('grp-t'));
      const cnt = Array.from(g.children).find(x=>x.classList.contains('grp-c'));
      // gruppo senza titolo: il primo blocco che non è il contenuto diventa il titolo
      if(!t){
        const cand = Array.from(g.children).find(x=>!x.classList.contains('grp-c'));
        if(cand){ const nt = document.createElement('div'); nt.className = 'grp-t'; nt.innerHTML = cand.innerHTML; cand.replaceWith(nt); t = nt; cambiato = true; }
      }
      // titoli vuoti in più (Invio sul titolo con la versione vecchia) e righe vuote sciolte nel gruppo: via
      Array.from(g.children).forEach(x=>{
        if(x === t || x.classList.contains('grp-c')) return;
        if(!x.textContent.replace(/[\s\u00a0\u200b]/g,'') && !x.querySelector('img,table')){ x.remove(); cambiato = true; }
      });
      // gruppo chiamato "Elenco" per sbaglio, con dentro come primo blocco un elenco di una voce sola: quella voce è il titolo
      if(t && cnt && t.textContent.trim() === 'Elenco'){
        const pr = cnt.firstElementChild;
        const voci = pr && /^(UL|OL)$/.test(pr.tagName) ? Array.from(pr.children).filter(x=>x.tagName === 'LI') : [];
        if(voci.length === 1 && voci[0].textContent.trim() && !voci[0].querySelector('ul,ol,table') && pr.nextElementSibling){
          const n = pr.tagName === 'OL' ? (parseInt(voci[0].getAttribute('value') || pr.getAttribute('start') || '1', 10) || 1) + '. ' : '';
          t.innerHTML = n + voci[0].innerHTML; pr.remove(); cambiato = true;
        }
      }
      // gruppo vuoto (niente titolo e niente contenuto): via
      const testo = (t ? t.textContent : '') + (cnt ? cnt.textContent : '');
      if(!testo.replace(/[\s ]/g,'') && !(cnt && cnt.querySelector('img,table'))){ g.remove(); cambiato = true; }
    });
    return cambiato;
  };
  /* apre i contenitori tenendo ferma la selezione (con due segnalini invisibili) */
  const srotolaConSelezione = () => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount || !ref.current.contains(sel.getRangeAt(0).commonAncestorContainer)) return srotolaContenitori();
    const r = sel.getRangeAt(0);
    const m1 = document.createElement('span'), m2 = document.createElement('span');
    m1.setAttribute('data-seg','a'); m2.setAttribute('data-seg','b');
    try{ const rb = r.cloneRange(); rb.collapse(false); rb.insertNode(m2); const ra = r.cloneRange(); ra.collapse(true); ra.insertNode(m1); }catch(e){ return srotolaContenitori(); }
    const cambiato = srotolaContenitori();
    try{ const nr = document.createRange(); nr.setStartAfter(m1); nr.setEndBefore(m2); sel.removeAllRanges(); sel.addRange(nr); }catch(e){}
    m1.remove(); m2.remove();
    return cambiato;
  };

  /* più titoli nella selezione: un gruppo per ogni titolo, con dentro quello che c'è fino al titolo dopo
     (come nel resoconto di agosto) */
  const eTitolo = (el) => {
    if(!el || el.nodeType !== 1) return false;
    if(/^H[1-4]$/.test(el.tagName)) return true;
    if(el.tagName !== 'P') return false;
    const t = el.textContent.replace(/[\s ]/g,'');
    if(!t || t.length > 70) return false;
    // un paragrafo corto tutto in grassetto conta come titolo
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n, tutto = true;
    while((n = w.nextNode())){ if(!n.textContent.trim()) continue; if(!eGrassetto(getComputedStyle(n.parentElement).fontWeight)){ tutto = false; break; } }
    return tutto && el.textContent.trim() === el.textContent.trim().toUpperCase();
  };
  const raggruppaPerTitoli = (bl) => {
    const titoli = bl.filter(eTitolo);
    if(titoli.length < 2) return false;
    const ultimo = bl[bl.length - 1];
    let fatti = 0;
    titoli.forEach((t, i)=>{
      const fine = i + 1 < titoli.length ? titoli[i + 1] : null;
      const corpi = [];
      let x = t.nextElementSibling;
      // fino al titolo dopo (o all'ultimo blocco selezionato), righe vuote comprese
      while(x && x !== fine && (bl.indexOf(x) >= 0 || eBloccoVuoto(x))){
        corpi.push(x);
        if(x === ultimo) break;
        x = x.nextElementSibling;
      }
      // le righe vuote in coda restano fuori
      while(corpi.length && eBloccoVuoto(corpi[corpi.length - 1])) corpi.pop();
      while(corpi.length && eBloccoVuoto(corpi[0])) corpi.shift().remove();
      if(!corpi.length) return;
      const grp = document.createElement('div'); grp.className = 'grp';
      const tit = document.createElement('div'); tit.className = 'grp-t';
      const cnt = document.createElement('div'); cnt.className = 'grp-c';
      tit.innerHTML = '<b>' + t.innerHTML + '</b>';
      t.parentNode.insertBefore(grp, t);
      grp.appendChild(tit);
      corpi.forEach(b=>cnt.appendChild(b));
      grp.appendChild(cnt);
      t.remove();
      fatti++;
    });
    if(!fatti) return false;
    rigaSottoGruppi();
    puliscoSel(); setInTable(false); setTblBox(null);
    emit(true);
    return true;
  };

  const raggruppa = () => {
    srotolaConSelezione();                       // il testo incollato chiuso in un <div> unico va aperto prima
    const sel = window.getSelection();
    const r = (sel && sel.rangeCount) ? sel.getRangeAt(0) : null;
    const haSelezione = !!(r && !sel.isCollapsed
      && ref.current.contains(r.commonAncestorContainer)
      && sel.toString().replace(/\u00a0/g,'').trim());

    let bl = blocchiDiPrimoLivello().filter(el=>
      el !== ref.current && !el.classList.contains('grp-t') && !el.classList.contains('grp-c')
      && el.tagName !== 'TD' && el.tagName !== 'TH');
    // niente blocchi già contenuti in altri della lista, per non annidare
    bl = bl.filter(el => !bl.some(altro => altro !== el && altro.contains(el)));

    /* ── con una selezione: esattamente i blocchi selezionati, niente di quello che sta sotto ── */
    if(haSelezione){
      if(bl.length >= 3 && raggruppaPerTitoli(bl)) return;
      if(bl.length >= 2){
        const primo = bl[0];
        /* il primo blocco è un elenco di una voce sola (es. "1. ANDAMENTO DEL CREDITO"): quella voce è il titolo.
           Prima diventava un gruppo chiamato "Elenco". */
        const voci = /^(UL|OL)$/.test(primo.tagName) ? Array.from(primo.children).filter(x=>x.tagName === 'LI') : [];
        if(voci.length === 1 && voci[0].textContent.replace(/\s+/g,' ').trim() && !voci[0].querySelector('ul,ol,table')){
          const n = primo.tagName === 'OL' ? (parseInt(voci[0].getAttribute('value') || primo.getAttribute('start') || '1', 10) || 1) + '. ' : '';
          montaGruppo(n + voci[0].innerHTML, bl.slice(1), primo, null);
          return;
        }
        if(/^(UL|OL|TABLE)$/.test(primo.tagName)){
          // il primo blocco non è una riga di testo: lo lascio dentro e metto un titolo di scorta
          montaGruppo(primo.tagName === 'TABLE' ? 'Tabella' : 'Elenco', bl, null, null);
        } else {
          montaGruppo(primo.innerHTML, bl.slice(1), primo, null);
        }
        return;
      }
      if(bl.length === 1 && /^(UL|OL|TABLE|BLOCKQUOTE|PRE)$/.test(bl[0].tagName)){
        conTitoloSopra(bl[0], bl[0].tagName === 'TABLE' ? 'Tabella' : 'Elenco');
        return;
      }
      if(bl.length === 1){
        alert('Hai selezionato una riga sola. Allunga la selezione fino a comprendere anche le righe da mettere dentro: la prima diventa il titolo del gruppo.');
        return;
      }
      const dentroTabella = r.commonAncestorContainer &&
        ((r.commonAncestorContainer.nodeType === 3 ? r.commonAncestorContainer.parentElement : r.commonAncestorContainer).closest('table'));
      alert(dentroTabella
        ? 'Sei dentro una tabella: togli la selezione e lascia solo il cursore in una cella, così raggruppo tutta la tabella con la riga che sta sopra.'
        : 'Da qui non riesco a raggruppare: seleziona le righe del documento da mettere nel gruppo.');
      return;
    }

    /* ── solo cursore, niente selezione: le scorciatoie ── */
    // 1) il cursore è dentro una tabella: la raggruppo con la riga che la precede
    const cella = cellaCorrente() || cellFromSelection();
    const tabCorrente = cella ? cella.closest('table') : (bl.length === 1 && bl[0].tagName === 'TABLE' ? bl[0] : null);
    if(tabCorrente && ref.current.contains(tabCorrente) && !tabCorrente.closest('.grp-c')){
      conTitoloSopra(tabCorrente, 'Tabella');
      return;
    }

    // 2) il cursore è su una riga di testo e subito sotto c'è una tabella o un elenco
    if(bl.length === 1 && !/^(UL|OL|TABLE)$/.test(bl[0].tagName)){
      const titolo = bl[0];
      let dopo = titolo.nextElementSibling;
      const vuoti = [];
      while(dopo && eBloccoVuoto(dopo)){ vuoti.push(dopo); dopo = dopo.nextElementSibling; }
      if(dopo && /^(TABLE|UL|OL)$/.test(dopo.tagName)){
        montaGruppo(titolo.innerHTML, [dopo], titolo, vuoti);
        return;
      }
    }

    // 3) il cursore è dentro un elenco: elenco più riga di sopra
    if(bl.length === 1 && /^(UL|OL|BLOCKQUOTE|PRE)$/.test(bl[0].tagName)){
      conTitoloSopra(bl[0], 'Elenco');
      return;
    }

    alert('Seleziona le righe da raggruppare: la prima diventa il titolo e le altre finiscono dentro. Con il solo cursore raggruppo la tabella o l\'elenco che hai sotto.');
  };

  const [tuttiChiusi,setTuttiChiusi] = useState(false);
  const alternaTutti = () => {
    const gruppi = Array.from(ref.current.querySelectorAll('.grp'));
    if(!gruppi.length){ alert('In questo documento non ci sono gruppi.'); return; }
    const daChiudere = gruppi.some(g=>!g.classList.contains('chiuso'));
    gruppi.forEach(g=>g.classList.toggle('chiuso', daChiudere));
    setTuttiChiusi(daChiudere);
    emit(true);
  };

  const sciogli = () => {
    const g = dentroGruppo();
    if(!g){ alert('Metti il cursore dentro un gruppo, o seleziona le righe da farne uscire.'); return; }

    // righe selezionate dentro il contenuto: le porto fuori senza toccare il resto
    const sel = window.getSelection();
    const dentroCnt = blocchiSelezionati().filter(el=>{
      const c = el.closest && el.closest('.grp-c');
      return c && g.contains(c) && el !== c && !el.classList.contains('grp-t');
    });
    if(dentroCnt.length && sel && !sel.isCollapsed){
      const puliti = dentroCnt.filter(el => !dentroCnt.some(a => a !== el && a.contains(el)));
      puliti.forEach(el => g.parentNode.insertBefore(el, g.nextSibling));
      const cnt0 = g.querySelector('.grp-c');
      if(cnt0 && !cnt0.children.length){          // gruppo rimasto vuoto: lo sciolgo del tutto
        const t0 = g.querySelector('.grp-t');
        const p0 = document.createElement('p'); p0.innerHTML = t0 ? t0.innerHTML : '';
        g.parentNode.insertBefore(p0, g); g.remove();
      }
      emit(true);
      return;
    }

    const tit = g.querySelector('.grp-t'), cnt = g.querySelector('.grp-c');
    const p = document.createElement('p');
    p.innerHTML = tit ? tit.innerHTML : '';
    g.parentNode.insertBefore(p, g);
    if(cnt) while(cnt.firstChild) g.parentNode.insertBefore(cnt.firstChild, g);
    g.remove();
    emit(true);
  };

  const setAllineamento = (v) => {
    if(applicaStileCelle({textAlign: v || ''})) { setPal(null); return; }
    ref.current.focus(); ripristinaRange();
    const bl = blocchiSelezionati();
    if(!bl.length){ setPal(null); return; }
    bl.forEach(el=>{ if(v) el.style.textAlign = v; else el.style.removeProperty('text-align'); });
    emit(true); setPal(null);
  };
  /* formati numerici sulle celle scelte */
  const formattaNumero = (opzione) => {
    const celle = celleScelte();
    if(!celle.length){ alert('Scegli prima una o più celle.'); setPal(null); return; }
    let toccate = 0;
    celle.forEach(td=>{
      const testo = td.textContent;
      const n = leggiNumero(testo);
      if(n === null) return;
      const eraPerc = /%/.test(testo);
      let dec = contaDecimali(testo);
      let valore = n, perc = eraPerc, sep = /['’]/.test(testo) ? "'" : 'punto';

      if(opzione === 'migliaia'){ sep = 'punto'; }
      else if(opzione === 'apostrofo'){ sep = "'"; }
      else if(opzione === 'percento'){ perc = true; }
      else if(opzione === 'daRapporto'){ valore = n * 100; perc = true; dec = Math.max(0, dec - 2); }
      else if(opzione === 'piuDec'){ dec = Math.min(6, dec + 1); }
      else if(opzione === 'menoDec'){ dec = Math.max(0, dec - 1); }
      else if(opzione === 'grezzo'){ sep = 'nessuno'; perc = false; }

      td.textContent = scriviNumero(valore, dec, sep, perc);
      toccate++;
    });
    if(!toccate) alert('In queste celle non ho trovato numeri da formattare.');
    else emit(true);
    setPal(null);
  };

  const setVerticale = (v) => {
    if(!applicaStileCelle({verticalAlign: v || ''}))
      alert('Scegli prima una o più celle.');
    setPal(null);
  };

  /* cambia il simbolo dell'elenco in cui si trova il cursore */
  const listaCorrente = () => {
    const sel = window.getSelection();
    let n = sel && sel.anchorNode;
    if(n && n.nodeType === 3) n = n.parentElement;
    const li = n && n.closest && n.closest('li');
    return (li && ref.current.contains(li)) ? li.parentElement : null;
  };
  const setSegnoElenco = (v) => {
    const lista = listaCorrente();
    if(!lista){ alert('Metti prima il cursore in un elenco.'); setPal(null); return; }
    if(v) lista.style.listStyleType = v; else lista.style.removeProperty('list-style-type');
    emit(true); setPal(null);
  };

  /* ═══ interlinea ═══
     Vale per ogni riga (paragrafo, voce d'elenco, titolo) in cui la selezione prende del testo,
     e solo per quelle: prima, partendo da un testo fuori paragrafo, finiva sull'intero foglio
     (e non veniva nemmeno salvata), e selezionando fino a un gruppo cambiava tutto il gruppo.
     Toglie anche le interlinee rimaste dentro la riga (es. testo incollato da Word), che vincevano su quella scelta. */
  const RX_RIGA = /^(P|LI|H1|H2|H3|H4|H5|H6|BLOCKQUOTE|PRE|FIGCAPTION|DIV|TD|TH)$/;
  const righeDellaSelezione = () => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return [];
    let r = sel.getRangeAt(0);
    if(!ref.current.contains(r.commonAncestorContainer)) return [];
    // testo scritto fuori da un paragrafo: prima lo metto in un paragrafo suo
    const sciolto = (n) => {
      const x = n.nodeType === 3 ? n.parentNode : n;
      const b = x && x.closest ? x.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre,figcaption,td,th,.grp-t') : null;
      return !b || !ref.current.contains(b);
    };
    if(sciolto(r.startContainer) || sciolto(r.endContainer)){
      perRigheProprie();
      r = sel.getRangeAt(0);
    }
    const soloCursore = sel.isCollapsed || !r.toString().replace(/[\s\u00a0]/g,'');   // nessun testo scelto: vale la riga del cursore
    const tocca = (el) => {
      try{ if(!r.intersectsNode(el)) return false; }catch(err){ return false; }
      if(soloCursore) return true;
      const i = document.createRange();
      i.selectNodeContents(el);
      if(i.compareBoundaryPoints(Range.START_TO_START, r) < 0) i.setStart(r.startContainer, r.startOffset);
      if(i.compareBoundaryPoints(Range.END_TO_END, r) > 0) i.setEnd(r.endContainer, r.endOffset);
      return !i.collapsed && (!!i.toString().replace(/[\s\u00a0]/g,'') || !!el.querySelector('img'));
    };
    const cand = Array.from(ref.current.querySelectorAll('*')).filter(el=>RX_RIGA.test(el.tagName) && tocca(el));
    // solo le righe "vere": un contenitore (gruppo, cella con paragrafi dentro…) lascia il posto alle righe che contiene
    let righe = cand.filter(el => el.tagName === 'LI' || !cand.some(x => x !== el && el.contains(x)));
    if(soloCursore && righe.length > 1) righe = righe.slice(0, 1);
    if(!righe.length && soloCursore){
      const n = r.startContainer.nodeType === 3 ? r.startContainer.parentNode : r.startContainer;
      const b = n.closest && n.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre,figcaption,div,td,th');
      if(b && b !== ref.current && ref.current.contains(b)) righe = [b];
    }
    return righe;
  };
  const setInterlinea = (v) => {
    if(applicaStileCelle({lineHeight: v || ''})) { setPal(null); return; }
    ref.current.focus(); ripristinaRange();
    const righe = righeDellaSelezione();
    if(!righe.length){ setPal(null); alert('Metti il cursore nella riga, o seleziona le righe, di cui cambiare l\'interlinea.'); return; }
    righe.forEach(el=>{
      if(v) el.style.lineHeight = v; else el.style.removeProperty('line-height');
      // le interlinee dentro la riga (su pezzi di testo) non devono più comandare
      el.querySelectorAll('[style]').forEach(x=>{
        if(x.closest('table') && !el.closest('table')) return;       // le tabelle dentro la riga restano come sono
        if(RX_RIGA.test(x.tagName) && x.tagName !== 'DIV') return;   // righe annidate: le gestisce il loro turno
        x.style.removeProperty('line-height');
      });
      if(!el.getAttribute('style')) el.removeAttribute('style');
    });
    salvaRange();
    emit(true); setPal(null); ref.current.focus();
  };
  /* ═══ spazio prima / dopo il paragrafo ═══
     L'interlinea è lo spazio DENTRO la riga; la distanza tra un titolo e la riga sotto
     è invece il margine dei paragrafi: si regola qui, come "Spaziatura prima/dopo" di Word. */
  const setSpazio = (lato, v) => {
    ref.current.focus(); ripristinaRange();
    const righe = righeDellaSelezione();
    if(!righe.length){ setPal(null); alert('Metti il cursore nella riga, o seleziona le righe, di cui cambiare lo spazio.'); return; }
    const k = lato === 'prima' ? 'marginTop' : 'marginBottom';
    righe.forEach(el=>{
      if(v !== null) el.style[k] = v; else el.style.removeProperty(k === 'marginTop' ? 'margin-top' : 'margin-bottom');
      if(!el.getAttribute('style')) el.removeAttribute('style');
    });
    salvaRange();
    emit(true); setPal(null); ref.current.focus();
  };
  /* attacca la riga a quella di sopra: niente spazio né sotto la riga sopra né sopra questa */
  const attaccaSopra = () => {
    ref.current.focus(); ripristinaRange();
    const righe = righeDellaSelezione();
    if(!righe.length){ setPal(null); alert('Metti il cursore nella riga da avvicinare a quella di sopra.'); return; }
    const prima = righe[0];
    // la riga sopra: il blocco che precede (se questa è la prima voce di un elenco, quello che precede l'elenco)
    let base = prima;
    if(prima.tagName === 'LI' && !prima.previousElementSibling && prima.parentElement) base = prima.parentElement;
    let sopra = base.previousElementSibling;
    while(sopra && !sopra.textContent.replace(/[\s\u00a0]/g,'') && !sopra.querySelector('img,table')) sopra = sopra.previousElementSibling;
    base.style.marginTop = '0px';
    if(base !== prima) prima.style.marginTop = '0px';
    if(sopra){
      sopra.style.marginBottom = '0px';
      if(/^(UL|OL)$/.test(sopra.tagName) && sopra.lastElementChild) sopra.lastElementChild.style.marginBottom = '0px';
    }
    salvaRange();
    emit(true); setPal(null); ref.current.focus();
  };
  const spazioAttuale = (lato) => {
    const r = rangeRef.current;
    let n = r && r.startContainer;
    if(!n || !ref.current || !ref.current.contains(n)) return '';
    if(n.nodeType === 3) n = n.parentNode;
    const b = n.closest && n.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre,figcaption,td,th');
    if(!b || !ref.current.contains(b)) return '';
    return lato === 'prima' ? b.style.marginTop : b.style.marginBottom;
  };

  /* l'interlinea della riga dove sta il cursore, per segnarla nel menu */
  const interlineaAttuale = () => {
    const r = rangeRef.current;
    let n = r && r.startContainer;
    if(!n || !ref.current || !ref.current.contains(n)) return '';
    if(n.nodeType === 3) n = n.parentNode;
    const b = n.closest && n.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre,figcaption,td,th');
    return (b && ref.current.contains(b) && b.style.lineHeight) ? b.style.lineHeight : '';
  };

  /* corpo del carattere: vale sulle celle scelte, sul testo selezionato o sul paragrafo */
  /* corpo scritto a mano nella casella */
  const [corpoScritto, setCorpoScritto] = useState('');
  const [corpoFocus, setCorpoFocus] = useState(false);
  const corpoFatto = useRef(false);                 // già applicato con Invio: l'uscita dalla casella non lo rifà
  const corpoRef = useRef(null);
  const applicaCorpoScritto = (forza) => {
    if(!forza && corpoFatto.current){ corpoFatto.current = false; return; }
    const testo = (corpoScritto || '').trim().replace(',', '.');
    setCorpoFocus(false);
    if(!testo) return;
    const n = Math.round(parseFloat(testo) * 2) / 2;          // al mezzo punto, come Word
    if(!n || isNaN(n)) return;
    if(n < 1 || n > 400){ alert('Scrivi un corpo tra 1 e 400.'); return; }
    if(fmtVisto.corpo && parseFloat(fmtVisto.corpo) === n) return;   // è già quello
    setCorpo(n);
    setTimeout(()=>{ salvaRange(); aggiornaFmtVisto(); }, 0);
  };
  const setCorpo = (px) => {
    if(!px) return;
    if(suOgniSelezione(()=>setCorpo(px))) return;
    const st = {fontSize: px + 'px'};
    if(applicaStileCelle(st)) return;
    ref.current.focus(); ripristinaRange();
    if(applicaStileTesto(st)) return;
    const bl = blocchiSelezionati();
    if(!bl.length) return;
    bl.forEach(el=>{ if(el.style) el.style.fontSize = px + 'px'; });
    emit(true);
  };
  const setFamiglia = (v) => {
    if(suOgniSelezione(()=>setFamiglia(v))) return;
    const st = {fontFamily: v};
    if(applicaStileCelle(st)) return;
    ref.current.focus(); ripristinaRange();
    if(v && applicaStileTesto(st)) return;
    const bl = blocchiSelezionati();
    if(!bl.length) return;
    bl.forEach(el=>{
      if(!el.style) return;
      if(v) el.style.fontFamily = v; else el.style.removeProperty('font-family');
    });
    emit(true);
  };

  /* elenco con le caselle da spuntare: si accende e si spegne sullo stesso elenco */
  const elencoSpunte = () => {
    ref.current.focus(); ripristinaRange();
    let lista = listaCorrente();
    if(lista && lista.classList.contains('cklist')){
      lista.classList.remove('cklist');
      Array.from(lista.children).forEach(li=>li.classList.remove('ck','fatto'));
      emit(true); return;
    }
    if(!lista){
      perRigheProprie();
      bloccoTenendoCursore('insertUnorderedList');
      lista = listaCorrente();
    }
    if(!lista){ alert('Non sono riuscito a creare l\'elenco: metti il cursore su una riga di testo.'); return; }
    lista.classList.add('cklist');
    Array.from(lista.children).forEach(li=>li.classList.add('ck'));
    emit(true);
  };
  const spuntaTutte = (valore) => {
    const voci = ref.current ? Array.from(ref.current.querySelectorAll('ul.cklist > li')) : [];
    if(!voci.length){ alert('In questo documento non ci sono caselle da spuntare.'); return; }
    voci.forEach(li=>li.classList.toggle('fatto', valore));
    emit(true);
  };

  /* Tab dentro un elenco: rientra di un livello, Maiusc+Tab torna indietro */
  const rientroElenco = (e) => {
    if(e.key !== 'Tab') return false;
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return false;
    let n = sel.anchorNode;
    if(n && n.nodeType === 3) n = n.parentElement;
    const li = n && n.closest && n.closest('li');
    if(!li || !ref.current.contains(li)) return false;
    e.preventDefault();
    document.execCommand(e.shiftKey ? 'outdent' : 'indent');
    emit(true);
    return true;
  };

  /* ═══ numerazione: continua o ricomincia (come il pulsantino di Word) ═══
     Quando nasce un elenco numerato, o si clicca sulla sua prima voce, compare un riquadrino
     accanto alla riga: si sceglie se proseguire dal numero dell'elenco precedente o ripartire da 1. */
  const [numPop, setNumPop] = useState(null);
  const numRef = useRef(null);                 // {li, ol} su cui agisce il riquadrino
  const inizioDi = ol => { const v = parseInt(ol.getAttribute('start'), 10); return isNaN(v) ? 1 : v; };
  const vociDi = ol => Array.from(ol.children).filter(x=>x.tagName === 'LI').length;
  const zonaDi = el => el.closest('.grp-c, td, th') || ref.current;
  const olPrecedente = (ol) => {
    const zona = zonaDi(ol);
    const tutte = Array.from(ref.current.querySelectorAll('ol'))
      .filter(o => o !== ol && !o.parentElement.closest('li') && zonaDi(o) === zona
        && (o.compareDocumentPosition(ol) & Node.DOCUMENT_POSITION_FOLLOWING));
    return tutte.length ? tutte[tutte.length - 1] : null;
  };
  const liNumeratoCorrente = () => {
    const sel = window.getSelection();
    let n = sel && sel.anchorNode;
    if(!n || !ref.current || !ref.current.contains(n)) return null;
    if(n.nodeType === 3) n = n.parentElement;
    const li = n.closest && n.closest('li');
    return (li && li.parentElement && li.parentElement.tagName === 'OL' && ref.current.contains(li)) ? li : null;
  };
  const proponiNumerazione = (soloSePrima, liForzato) => {
    const li = liForzato || liNumeratoCorrente();
    if(!li || !wrapRef.current){ setNumPop(null); return; }
    const ol = li.parentElement;
    if(ol.parentElement && ol.parentElement.closest('li')){ setNumPop(null); return; }   // sottoelenco: niente
    const voci = Array.from(ol.children).filter(x=>x.tagName === 'LI');
    const primo = voci[0] === li;
    if(soloSePrima && !primo && !liForzato){ setNumPop(null); return; }
    const prec = primo ? olPrecedente(ol) : null;
    // scelta possibile solo se c'è un elenco prima da continuare, o se l'elenco non parte da 1
    // appena creato un elenco senza nulla prima da continuare, non disturbo:
    // cliccando sulla prima voce (o col tasto destro su una voce) il riquadro compare comunque, per scegliere il numero
    if(primo && !prec && inizioDi(ol) === 1 && !soloSePrima && !liForzato){ setNumPop(null); return; }
    const continuaDa = primo ? (prec ? inizioDi(prec) + vociDi(prec) : null) : inizioDi(ol) + voci.indexOf(li);
    const continuato = primo ? (prec ? inizioDi(ol) === continuaDa : false) : true;
    // accanto alla fine del testo della riga: non copre né la riga sopra né quella sotto
    const w = wrapRef.current.getBoundingClientRect();
    const rl = li.getBoundingClientRect();
    let destra = rl.left;
    try{
      const rr = document.createRange(); rr.selectNodeContents(li);
      const rett = Array.from(rr.getClientRects()).filter(x=>x.width || x.height);
      if(rett.length) destra = Math.max(...rett.filter(x=>x.top < rl.top + 30).map(x=>x.right));
    }catch(err){}
    const larghezza = 380;
    let left = destra - w.left + 14;
    if(left + larghezza > w.width) left = Math.max(0, w.width - larghezza);
    numRef.current = {li, ol};
    const numero = inizioDi(ol) + voci.indexOf(li);
    setNumPop({ top: rl.top - w.top - 3, left, continuaDa, continuato, primo, numero, scritto: String(numero) });
  };
