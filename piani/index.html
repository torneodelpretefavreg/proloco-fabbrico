        if(!a.macro && a.scadenza && (a.testo||'').trim())
          out.push({id:'a|'+d.id+'|'+a.id, k:'attivita', data:a.scadenza, ora:'', titolo:a.testo, colore:'#a86a1f', doc:d, fatto:!!a.fatto,
            sotto:[a.responsabile, d.titolo].filter(Boolean).join(' · ')});
      });
    });
    return out;
  }, [documenti]);
  const visti = voci.filter(v=>!spenti[v.k]);
  const sposta = (id, data) => {
    const [k, did, sub] = id.split('|');
    const d = documenti[did]; if(!d) return;
    if(k === 'r' || k === 'e') saveDoc(did, {...d, data, aggiornato: nowISO()});
    else if(k === 'c') saveDoc(did, {...d, contenuti:(d.contenuti||[]).map(c=>c.id === sub ? {...c, data} : c), aggiornato: nowISO()});
    else if(k === 'a') saveDoc(did, {...d, azioni:(d.azioni||[]).map(a=>a.id === sub ? {...a, scadenza:data} : a), aggiornato: nowISO()});
    setGiorno(data);
  };
  const oggi = oggiLoc(), fra = piuGiorni(oggi, 14);
  const ord = (a,b) => (a.data + (a.ora||'99')).localeCompare(b.data + (b.ora||'99'));
  const inArrivo = visti.filter(v=>v.data >= oggi && v.data <= fra && !v.fatto).sort(ord);
  const scaduti = visti.filter(v=>v.data < oggi && !v.fatto && (v.k === 'contenuti' || v.k === 'attivita')).sort(ord);
  const delGiorno = giorno ? visti.filter(v=>v.data === giorno).sort(ord) : [];
  const riga = (v, conData) => (
    <VoceRiga key={v.id} colore={v.colore} fatto={v.fatto} quando={(conData ? giornoCorto(v.data) + ' ' : '') + (v.ora || (conData ? '' : '—'))}
      titolo={v.titolo} sotto={v.sotto} onClick={()=>onApri(v.doc)}/>
  );
  return (
    <div className="cal-wrap">
      <h1 style={{fontFamily:'var(--serif)',fontSize:30,margin:'0 0 4px'}}>Calendario</h1>
      <p style={{color:'var(--muted)',marginTop:0}}>Uscite dei contenuti, eventi, riunioni e scadenze di tutti i documenti. Trascina una voce per cambiarle giorno.</p>
      <div className="filtri">
        {TIPI_VOCE.map(([k, n, col])=>(
          <button key={k} className={spenti[k] ? 'spento' : ''} onClick={()=>alterna(k)} title={spenti[k] ? 'Mostra' : 'Nascondi'}><i style={{background:col}}></i>{n}</button>
        ))}
      </div>
      <CalMese mese={mese} onMese={setMese} voci={visti} giorno={giorno} ro={ro} onGiorno={g=>setGiorno(g === giorno ? null : g)}
        onVoce={v=>onApri(v.doc)} onSposta={sposta}/>
      {giorno && (
        <div className="cal-giorno">
          <h5><span>{nomeGiorno(giorno)}</span></h5>
          {delGiorno.map(v=>riga(v, false))}
          {!delGiorno.length && <div className="spazio-sub" style={{padding:'4px 0 8px'}}>Giornata libera.</div>}
        </div>
      )}
      {scaduti.length > 0 && (<>
        <div className="sec-h"><h3 style={{color:'var(--red)'}}>In ritardo</h3><div className="rule"></div></div>
        {scaduti.map(v=>riga(v, true))}
      </>)}
      <div className="sec-h"><h3>Prossimi 14 giorni</h3><div className="rule"></div></div>
      {inArrivo.map(v=>riga(v, true))}
      {!inArrivo.length && <div className="empty"><strong>Niente in programma</strong>Le uscite dei piani, le riunioni e le scadenze compaiono qui.</div>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   FOGLIO DI CALCOLO
   Le celle sono salvate per nome (A1, B2…): dentro c'è quello che è stato scritto,
   numero, testo o formula (=SOMMA(C3:C7)). I risultati si calcolano a video.
   ═══════════════════════════════════════════════════════════════ */
const FG_NR = 30, FG_NC = 10, FG_MAXC = 52, FG_LARG = 104;
const fgLettera = (c) => { let s = ''; c++; while(c > 0){ const m = (c-1) % 26; s = String.fromCharCode(65+m) + s; c = Math.floor((c-1)/26); } return s; };
const fgIndice = (l) => { let n = 0; for(const ch of String(l).toUpperCase()) n = n*26 + (ch.charCodeAt(0)-64); return n-1; };
const fgRef = (r, c) => fgLettera(c) + (r+1);
const fgPos = (ref) => { const m = /^([A-Z]{1,2})(\d{1,4})$/.exec(ref); return m ? {r: parseInt(m[2],10)-1, c: fgIndice(m[1])} : null; };
const fgLeggi = (v) => ({ nr: Math.max(1, (v && v.nr) || FG_NR), nc: Math.max(1, (v && v.nc) || FG_NC),
  celle: (v && v.celle) || {}, fmt: (v && v.fmt) || {}, larg: (v && v.larg) || {} });
const fgZona = (testo) => {
  const [a, b] = String(testo).split(':'); const p = fgPos(a), q = fgPos(b || a); const out = [];
  if(!p || !q) return out;
  for(let r = Math.min(p.r,q.r); r <= Math.max(p.r,q.r); r++) for(let c = Math.min(p.c,q.c); c <= Math.max(p.c,q.c); c++) out.push(fgRef(r,c));
  return out;
};
/* numero scritto in una cella: 1.234,5 · 15% (= 0,15) · € 20 */
const fgNumero = (s) => { const n = leggiNumero(s); if(n === null) return null; return /%\s*$/.test(String(s).trim()) ? n/100 : n; };
const fgDecimali = (v, max) => { const s = String(Math.round(Math.abs(v)*1e6)/1e6); const i = s.indexOf('.'); return (i < 0 || s.indexOf('e') >= 0) ? 0 : Math.min(max, s.length-i-1); };
const fgDecPredef = (v, nf) => nf === 'eur' ? 2 : nf === 'perc' ? fgDecimali(v*100, 2) : nf === 'num' ? fgDecimali(v, 2) : fgDecimali(v, 6);
const fgMostra = (v, fm) => {
  if(typeof v !== 'number') return (v === undefined || v === null) ? '' : String(v);
  const nf = fm && fm.nf;
  const dec = (fm && typeof fm.dec === 'number') ? fm.dec : fgDecPredef(v, nf);
  if(nf === 'eur') return scriviNumero(v, dec, 'punto', false) + ' €';
  if(nf === 'perc') return scriviNumero(v*100, dec, 'punto', true);
  if(nf === 'num') return scriviNumero(v, dec, 'punto', false);
  return scriviNumero(v, dec, 'nessuno', false);
};

const FG_FUN = (()=>{
  const piatto = a => a.reduce((o, x)=>o.concat(Array.isArray(x) ? piatto(x) : [x]), []);
  const numeri = a => piatto(a).filter(x=>typeof x === 'number');
  const criterio = (crit) => {
    if(typeof crit === 'number') return v => v === crit;
    const m = /^(<=|>=|<>|<|>|=)?(.*)$/.exec(String(crit));
    const op = m[1] || '=', t = m[2].trim(), n = leggiNumero(t);
    return v => {
      if(n !== null && typeof v === 'number') return op === '=' ? v === n : op === '<>' ? v !== n : op === '<' ? v < n : op === '>' ? v > n : op === '<=' ? v <= n : v >= n;
      const a = String(v).trim().toLowerCase(), b = t.toLowerCase();
      return op === '<>' ? a !== b : op === '=' ? a === b : false;
    };
  };
  const F = Object.create(null);
  const def = (nomi, fn) => nomi.forEach(n=>{ F[n] = fn; });
  def(['SOMMA','SUM'], (...a)=>numeri(a).reduce((s,x)=>s+x, 0));
  def(['MEDIA','AVERAGE'], (...a)=>{ const l = numeri(a); return l.length ? l.reduce((s,x)=>s+x, 0)/l.length : 0; });
  def(['MIN'], (...a)=>{ const l = numeri(a); return l.length ? Math.min(...l) : 0; });
  def(['MAX'], (...a)=>{ const l = numeri(a); return l.length ? Math.max(...l) : 0; });
  def(['CONTA_NUMERI','CONTA','COUNT'], (...a)=>numeri(a).length);
  def(['CONTA_VALORI','COUNTA'], (...a)=>piatto(a).filter(x=>x !== '' && x !== null && x !== undefined).length);
  def(['ARROTONDA','ROUND'], (x, n)=>{ const p = Math.pow(10, n || 0); return Math.round((+x)*p)/p; });
  def(['ASS','ABS'], x=>Math.abs(+x));
  def(['INT'], x=>Math.floor(+x));
  def(['RADQ','SQRT'], x=>Math.sqrt(+x));
  def(['PRODOTTO','PRODUCT'], (...a)=>numeri(a).reduce((s,x)=>s*x, 1));
  def(['SE','IF'], (c, a, b)=>c ? a : (b === undefined ? '' : b));
  def(['E','AND'], (...a)=>piatto(a).every(Boolean));
  def(['O','OR'], (...a)=>piatto(a).some(Boolean));
  def(['SOMMA_SE','SUMIF'], (zona, crit, somma)=>{ const z = piatto([zona]), s = somma === undefined ? z : piatto([somma]), ok = criterio(crit);
    return z.reduce((t, v, i)=>(v !== '' && ok(v) && typeof s[i] === 'number') ? t + s[i] : t, 0); });
  def(['CONTA_SE','COUNTIF'], (zona, crit)=>{ const ok = criterio(crit); return piatto([zona]).filter(v=>v !== '' && ok(v)).length; });
  return F;
})();

function fgFormula(expr, val){
  try{
    const str = [];
    let f = String(expr).replace(/ /g,' ').replace(/"([^"]*)"/g, (t, s)=>{ str.push(s); return '\u0001' + (str.length-1) + '\u0001'; });
    f = f.toUpperCase().replace(/\$/g,'');
    f = f.replace(/(\d)\s*,\s*(\d)/g, '$1.$2').replace(/;/g, ',');           // 1,5 è un decimale; gli argomenti si separano col punto e virgola
    f = f.replace(/(\d+(?:\.\d+)?)\s*%/g, '($1/100)');
    f = f.replace(/\b(CONTA|SOMMA)\.(NUMERI|VALORI|SE)\b/g, '$1_$2');
    f = f.replace(/<>/g, '!=').replace(/([^<>!=])=(?!=)/g, '$1==').replace(/\^/g, '**');
    if(!/^[-+*\/%().,<>=!&|?:\d\sA-Z_\u0001]*$/.test(f)) return '#ERRORE';
    f = f.replace(/\b([A-Z]{1,2}\d{1,4})(?:\s*:\s*([A-Z]{1,2}\d{1,4}))?\b(?!\s*\()/g, (t, a, b)=>b ? '__R("' + a + '","' + b + '")' : '__V("' + a + '")');
    f = f.replace(/\u0001(\d+)\u0001/g, (t, i)=>'__S[' + i + ']');
    const amb = Object.create(FG_FUN);
    const leggi = (ref) => { const v = val(ref); if(typeof v === 'string' && v[0] === '#') throw new Error(v); return v; };
    amb.__V = (ref) => { const v = leggi(ref); return v === '' ? 0 : v; };
    amb.__R = (a, b) => fgZona(a + ':' + b).map(leggi);
    amb.__S = str;
    const v = (new Function('F', 'with(F){ return (' + f + '); }'))(amb);
    if(typeof v === 'number') return isFinite(v) ? Math.round(v*1e10)/1e10 : (isNaN(v) ? '#ERRORE' : '#DIV/0');
    if(typeof v === 'boolean') return v ? 'VERO' : 'FALSO';
    if(typeof v === 'string') return v;
    return '#ERRORE';
  }catch(e){ return (e && e.message && e.message[0] === '#') ? e.message : '#ERRORE'; }
}
/* restituisce la funzione che dà il valore di una cella (numero, testo o errore), con le formule calcolate una volta sola */
function fgCalcolatore(celle){
  const memo = {}, inCorso = {};
  const val = (ref) => {
    if(ref in memo) return memo[ref];
    const raw = celle[ref];
    if(raw === undefined || raw === null || raw === '') return (memo[ref] = '');
    const s = String(raw);
    if(s[0] !== '=' || s.length < 2){ const n = fgNumero(s); return (memo[ref] = n === null ? s : n); }
    if(inCorso[ref]) return '#CICLO';
    inCorso[ref] = true;
    const v = fgFormula(s.slice(1), val);
    inCorso[ref] = false;
    return (memo[ref] = v);
  };
  return val;
}
/* sposta i riferimenti di una formula (copia, riempimento, ordinamento); i riferimenti con $ restano fermi */
const fgSposta = (formula, dr, dc) => {
  if(typeof formula !== 'string' || formula[0] !== '=' || (!dr && !dc)) return formula;
  return formula.replace(/"[^"]*"|(^|[^\w$])(\$?)([A-Za-z]{1,2})(\$?)(\d{1,4})(?![\w(])/g, (t, pre, ac, col, ar, riga)=>{
    if(col === undefined) return t;
    const c = fgIndice(col) + (ac ? 0 : dc), r = parseInt(riga,10) - 1 + (ar ? 0 : dr);
    if(c < 0 || r < 0) return pre + '#RIF';
    return pre + ac + fgLettera(c) + ar + (r+1);
  });
};
/* inserisce (n > 0) o toglie (n < 0) righe o colonne a partire da "at", aggiornando le formule */
function fgRistruttura(f, asse, at, n){
  const mappa = (i, ruolo, proprio) => {
    if(n > 0){
      // riga (o colonna) aggiunta subito dopo una zona il cui totale sta più avanti: la zona si allunga, così la voce nuova entra nel totale
      if(ruolo === 'fine' && i === at - 1 && proprio !== undefined && proprio >= at) return i + n;
      return i >= at ? i + n : i;
    }
    const fine = at - n;
    if(i < at) return i;
    if(i >= fine) return i + n;
    return ruolo === 'inizio' ? at : ruolo === 'fine' ? at - 1 : null;
  };
  const rx1 = /^(\$?)([A-Za-z]{1,2})(\$?)(\d{1,4})$/;
  const muovi = (pezzo, ruolo, proprio) => {
    const m = rx1.exec(pezzo); if(!m) return null;
    let c = fgIndice(m[2]), r = parseInt(m[4],10) - 1;
    if(asse === 'r'){ r = mappa(r, ruolo, proprio); if(r === null || r < 0) return null; }
    else { c = mappa(c, ruolo, proprio); if(c === null || c < 0) return null; }
    return {t: m[1] + fgLettera(c) + m[3] + (r+1), r, c};
  };
  const formula = (s, proprio) => s.replace(/"[^"]*"|(^|[^\w$])(\$?[A-Za-z]{1,2}\$?\d{1,4})(?:(\s*:\s*)(\$?[A-Za-z]{1,2}\$?\d{1,4}))?(?![\w(])/g, (t, pre, a, due, b)=>{
    if(a === undefined) return t;
    if(b){
      const x = muovi(a, 'inizio'), y = muovi(b, 'fine', proprio);
      if(!x || !y || (asse === 'r' ? x.r > y.r : x.c > y.c)) return pre + '#RIF';
      return pre + x.t + due + y.t;
    }
    const x = muovi(a, 'singolo');
    return pre + (x ? x.t : '#RIF');
  });
  const celle = {}, fmt = {}, larg = {};
  const nuovaChiave = (k) => { const p = fgPos(k); if(!p) return null; const i = mappa(asse === 'r' ? p.r : p.c, 'singolo'); if(i === null) return null; return asse === 'r' ? fgRef(i, p.c) : fgRef(p.r, i); };
  Object.keys(f.celle).forEach(k=>{ const nk = nuovaChiave(k); if(!nk) return; const v = f.celle[k], p = fgPos(k);
    celle[nk] = (typeof v === 'string' && v[0] === '=') ? formula(v, asse === 'r' ? p.r : p.c) : v; });
  Object.keys(f.fmt).forEach(k=>{ const nk = nuovaChiave(k); if(nk) fmt[nk] = f.fmt[k]; });
  if(asse === 'c') Object.keys(f.larg).forEach(l=>{ const i = mappa(fgIndice(l), 'singolo'); if(i !== null) larg[fgLettera(i)] = f.larg[l]; });
  else Object.assign(larg, f.larg);
  return { ...f, celle, fmt, larg, nr: asse === 'r' ? Math.max(1, f.nr + n) : f.nr, nc: asse === 'c' ? Math.max(1, Math.min(FG_MAXC, f.nc + n)) : f.nc };
}
/* costruisce un foglio da righe già pronte (per i modelli) */
function fgDaRighe(righe, extra){
  const x = extra || {};
  const celle = {}, fmt = {}; let nc = 0;
  righe.forEach((riga, r)=>riga.forEach((t, c)=>{ if(t !== '' && t !== null && t !== undefined){ celle[fgRef(r,c)] = String(t); nc = Math.max(nc, c+1); } }));
  const metti = (zone, cosa) => (zone || []).forEach(z=>fgZona(z).forEach(ref=>{ fmt[ref] = {...(fmt[ref] || {}), ...cosa}; }));
  metti(x.grassetto, {b:1}); metti(x.euro, {nf:'eur'}); metti(x.testa, {b:1, bg:'#e9ede9'}); metti(x.totali, {b:1, bg:'#e4efe8'});
  return { nr: Math.max(FG_NR, righe.length + 10), nc: Math.max(8, nc + 2), celle, fmt, larg: x.larg || {} };
}
/* il foglio come tabella, per Word e PDF */
function foglioHtml(fg){
  const f = fgLeggi(fg), val = fgCalcolatore(f.celle);
  let maxR = -1, maxC = -1;
  Object.keys(f.celle).forEach(k=>{ const p = fgPos(k); if(p){ maxR = Math.max(maxR, p.r); maxC = Math.max(maxC, p.c); } });
  if(maxR < 0) return '';
  let h = '<table>';
  for(let r = 0; r <= maxR; r++){
    h += '<tr>';
    for(let c = 0; c <= maxC; c++){
      const ref = fgRef(r,c), v = val(ref), fm = f.fmt[ref] || {};
      const st = [];
      if(fm.al) st.push('text-align:' + (fm.al === 'c' ? 'center' : fm.al === 'r' ? 'right' : 'left')); else if(typeof v === 'number') st.push('text-align:right');
      if(fm.b) st.push('font-weight:bold'); if(fm.i) st.push('font-style:italic'); if(fm.bg) st.push('background-color:' + fm.bg);
      h += `<td${st.length ? ` style="${st.join(';')}"` : ''}>${escHtml(fgMostra(v, fm)) || '&nbsp;'}</td>`;
    }
    h += '</tr>';
  }
  return h + '</table>';
}

const FG_SFONDI = ['#fcf3b0','#d6f0dd','#d6e8f5','#fadde3','#fbe3c7','#e9ede9'];

function Foglio({value, onChange, docKey, ro}){
  const [f, setF] = useState(()=>fgLeggi(value));
  const fRef = useRef(f); fRef.current = f;
  const inviato = useRef(JSON.stringify(fgLeggi(value)));
  const timer = useRef(null);
  const storia = useRef({passi:[], avanti:[]});
  const [sel, setSelVero] = useState({r:0, c:0, r2:0, c2:0});
  const selRef = useRef(sel);
  const setSel = (s) => { selRef.current = s; setSelVero(s); };
  const [edit, setEditVero] = useState(null);            // {r, c, testo, barra}
  const editRef = useRef(null);
  const setEdit = (e) => { editRef.current = e; setEditVero(e); };
  const wrapRef = useRef(null), inRef = useRef(null), barraRef = useRef(null);
  const trascina = useRef(null);
  const appunti = useRef(null);
  const [, forza] = useState(0);

  /* salvataggio poco dopo l'ultima modifica, come per i disegni */
  const salva = (nuovo) => {
    clearTimeout(timer.current);
    timer.current = setTimeout(()=>{ timer.current = null; inviato.current = JSON.stringify(nuovo); onChange(nuovo); }, 500);
  };
  const cambia = (nuovo, senzaStoria) => {
    if(ro) return;
    if(!senzaStoria){ const st = storia.current; st.passi.push(fRef.current); if(st.passi.length > 60) st.passi.shift(); st.avanti = []; }
    fRef.current = nuovo; setF(nuovo); salva(nuovo);
  };
  useEffect(()=>{
    const d = fgLeggi(value);
    inviato.current = JSON.stringify(d); storia.current = {passi:[], avanti:[]};
    fRef.current = d; setF(d); setEdit(null); setSel({r:0, c:0, r2:0, c2:0});
  }, [docKey]);
  useEffect(()=>{                                   // modifica arrivata da un altro dispositivo: la prendo se non sto scrivendo
    if(editRef.current || timer.current) return;
    const d = fgLeggi(value), s = JSON.stringify(d);
    if(s !== inviato.current && s !== JSON.stringify(fRef.current)){ inviato.current = s; fRef.current = d; setF(d); }
  }, [value]);
  useEffect(()=>()=>{                               // uscendo dal foglio, quello che era in attesa si salva subito
    if(timer.current){ clearTimeout(timer.current); timer.current = null; if(JSON.stringify(fRef.current) !== inviato.current) onChange(fRef.current); }
  }, [docKey]);

  const val = useMemo(()=>fgCalcolatore(f.celle), [f.celle]);
  const z = { r0: Math.min(sel.r, sel.r2), r1: Math.max(sel.r, sel.r2), c0: Math.min(sel.c, sel.c2), c1: Math.max(sel.c, sel.c2) };
  const zonaOra = () => { const s = selRef.current; return { r0: Math.min(s.r, s.r2), r1: Math.max(s.r, s.r2), c0: Math.min(s.c, s.c2), c1: Math.max(s.c, s.c2) }; };
  const refsZona = () => { const q = zonaOra(), out = []; for(let r = q.r0; r <= q.r1; r++) for(let c = q.c0; c <= q.c1; c++) out.push(fgRef(r,c)); return out; };
  const larghezza = (c) => f.larg[fgLettera(c)] || FG_LARG;

  const fuocoGriglia = () => { try{ if(wrapRef.current) wrapRef.current.focus({preventScroll:true}); }catch(e){} };
  const mostra = (r, c) => setTimeout(()=>{
    const td = wrapRef.current && wrapRef.current.querySelector('td[data-p="' + r + '_' + c + '"]');
    if(!td) return;
    const w = wrapRef.current, a = td.getBoundingClientRect(), b = w.getBoundingClientRect();
    if(a.top < b.top + 26) w.scrollTop -= (b.top + 26 - a.top); else if(a.bottom > b.bottom - 4) w.scrollTop += (a.bottom - b.bottom + 4);
    if(a.left < b.left + 42) w.scrollLeft -= (b.left + 42 - a.left); else if(a.right > b.right - 4) w.scrollLeft += (a.right - b.right + 4);
  }, 0);
  const vai = (r, c, estendi) => {
    const cur = fRef.current;
    r = Math.max(0, Math.min(cur.nr-1, r)); c = Math.max(0, Math.min(cur.nc-1, c));
    setSel(estendi ? {...selRef.current, r2:r, c2:c} : {r, c, r2:r, c2:c});
    mostra(r, c);
  };

  /* il formato si adatta a quello che scrivi: 15% diventa una percentuale, € 20 una cifra in euro */
  const formatoDa = (t, fmt, ref) => {
    if(t[0] === '=' || fgNumero(t) === null || (fmt[ref] && fmt[ref].nf)) return;
    if(/%\s*$/.test(t.trim())) fmt[ref] = {...(fmt[ref] || {}), nf:'perc'};
    else if(/€/.test(t)) fmt[ref] = {...(fmt[ref] || {}), nf:'eur'};
  };
  const scrivi = (r, c, testo) => {
    const ref = fgRef(r,c), cur = fRef.current;
    const t = String(testo == null ? '' : testo);
    if((cur.celle[ref] || '') === t) return;
    const celle = {...cur.celle}, fmt = {...cur.fmt};
    if(t.trim() === '') delete celle[ref]; else { celle[ref] = t; formatoDa(t, fmt, ref); }
    cambia({...cur, celle, fmt});
  };
  const apri = (r, c, testo, barra) => { if(ro) return; setSel({r, c, r2:r, c2:c}); setEdit({r, c, testo: testo === undefined ? (fRef.current.celle[fgRef(r,c)] || '') : testo, barra: !!barra, k: Date.now()}); };
  const conferma = (dr, dc, senzaFuoco) => {
    const e = editRef.current; if(!e) return;
    setEdit(null);
    scrivi(e.r, e.c, e.testo);
    if(dr || dc){
      if(dr > 0 && e.r + dr >= fRef.current.nr) cambia({...fRef.current, nr: fRef.current.nr + 1}, true);   // in fondo: il foglio si allunga
      vai(e.r + dr, e.c + dc);
    }
    if(!senzaFuoco) fuocoGriglia();
  };
  const lasciaEdit = () => { setEdit(null); fuocoGriglia(); };
  useEffect(()=>{                                   // cella appena aperta: cursore in fondo al testo
    if(!edit || edit.barra || !inRef.current) return;
    inRef.current.focus(); const n = inRef.current.value.length; try{ inRef.current.setSelectionRange(n, n); }catch(e){}
  }, [edit && edit.k]);

  const annulla = () => { const st = storia.current; if(!st.passi.length) return; st.avanti.push(fRef.current); const p = st.passi.pop(); fRef.current = p; setF(p); salva(p); };
  const ripeti = () => { const st = storia.current; if(!st.avanti.length) return; st.passi.push(fRef.current); const p = st.avanti.pop(); fRef.current = p; setF(p); salva(p); };

  /* formati sulle celle scelte */
  const conFormato = (fn) => {
    const cur = fRef.current, fmt = {...cur.fmt};
    refsZona().forEach(ref=>{ const n = fn({...(fmt[ref] || {})}, ref); Object.keys(n).forEach(k=>{ if(n[k] === undefined || n[k] === null || n[k] === '' || n[k] === 0 && k !== 'dec') delete n[k]; });
      if(Object.keys(n).length) fmt[ref] = n; else delete fmt[ref]; });
    cambia({...cur, fmt});
  };
  const fmtAttiva = f.fmt[fgRef(sel.r, sel.c)] || {};
  const alterna = (k) => { const acceso = !!fmtAttiva[k]; conFormato(o=>({...o, [k]: acceso ? 0 : 1})); };
  const numFmt = (nf) => conFormato(o=>{ const n = {...o, nf}; delete n.dec; return n; });
  const decimali = (d) => conFormato((o, ref)=>{ const v = val(ref); if(typeof v !== 'number') return o;
    const ora = typeof o.dec === 'number' ? o.dec : fgDecPredef(v, o.nf); return {...o, dec: Math.max(0, Math.min(6, ora + d))}; });

  const svuota = () => { const cur = fRef.current, celle = {...cur.celle}; let toccato = false; refsZona().forEach(ref=>{ if(ref in celle){ delete celle[ref]; toccato = true; } }); if(toccato) cambia({...cur, celle}); };

  /* Σ: una cella sola → somma dei numeri sopra (o a sinistra); più celle → totali nella riga sotto (o nella colonna a destra) */
  const sommaAuto = () => {
    const q = zonaOra(), cur = fRef.current, celle = {...cur.celle}; let fatte = 0, nr = cur.nr, nc = cur.nc;
    const numero = (r, c) => r >= 0 && c >= 0 && typeof val(fgRef(r,c)) === 'number';
    if(q.r0 === q.r1 && q.c0 === q.c1){
      let r = q.r0 - 1; while(numero(r, q.c0)) r--;
      if(r < q.r0 - 1){ celle[fgRef(q.r0, q.c0)] = '=SOMMA(' + fgRef(r+1, q.c0) + ':' + fgRef(q.r0-1, q.c0) + ')'; fatte++; }
      else { let c = q.c0 - 1; while(numero(q.r0, c)) c--;
        if(c < q.c0 - 1){ celle[fgRef(q.r0, q.c0)] = '=SOMMA(' + fgRef(q.r0, c+1) + ':' + fgRef(q.r0, q.c0-1) + ')'; fatte++; } }
      if(!fatte){ alert('Sopra o a sinistra di questa cella non ci sono numeri da sommare.'); return; }
    } else if(q.r0 === q.r1){
      celle[fgRef(q.r0, q.c1+1)] = '=SOMMA(' + fgRef(q.r0, q.c0) + ':' + fgRef(q.r0, q.c1) + ')'; nc = Math.max(nc, q.c1 + 2);
    } else {
      for(let c = q.c0; c <= q.c1; c++) celle[fgRef(q.r1+1, c)] = '=SOMMA(' + fgRef(q.r0, c) + ':' + fgRef(q.r1, c) + ')';
      nr = Math.max(nr, q.r1 + 2);
    }
    cambia({...cur, celle, nr, nc: Math.min(FG_MAXC, nc)});
  };
  /* riempi: la prima riga (o colonna) della selezione viene copiata nelle altre, con le formule che si adattano */
  const riempi = (verso) => {
    const q = zonaOra(), cur = fRef.current, celle = {...cur.celle}, fmt = {...cur.fmt};
    if(verso === 'giu' ? q.r0 === q.r1 : q.c0 === q.c1){ alert(verso === 'giu' ? 'Seleziona la cella da copiare insieme a quelle sotto.' : 'Seleziona la cella da copiare insieme a quelle a destra.'); return; }
    for(let r = q.r0; r <= q.r1; r++) for(let c = q.c0; c <= q.c1; c++){
      if(verso === 'giu' ? r === q.r0 : c === q.c0) continue;
      const da = verso === 'giu' ? fgRef(q.r0, c) : fgRef(r, q.c0), a = fgRef(r,c);
      const v = cur.celle[da];
      if(v === undefined) delete celle[a]; else celle[a] = fgSposta(v, verso === 'giu' ? r - q.r0 : 0, verso === 'giu' ? 0 : c - q.c0);
      if(cur.fmt[da]) fmt[a] = cur.fmt[da]; else delete fmt[a];
    }
    cambia({...cur, celle, fmt});
  };
  const ordina = (cresc) => {
    const cur = fRef.current, q = zonaOra();
    let r0 = q.r0, r1 = q.r1, c0 = q.c0, c1 = q.c1; const col = selRef.current.c;
    if(r0 === r1){                                   // una cella sola: ordino tutte le righe scritte sotto l'intestazione
      let ultima = 0; Object.keys(cur.celle).forEach(k=>{ const p = fgPos(k); if(p) ultima = Math.max(ultima, p.r); });
      r0 = 1; r1 = ultima; c0 = 0; c1 = cur.nc - 1;
      if(r1 <= r0){ alert('Non ci sono abbastanza righe da ordinare.'); return; }
    }
    const righe = []; for(let r = r0; r <= r1; r++) righe.push(r);
    const chiave = (r) => val(fgRef(r, col));
    righe.sort((a, b)=>{
      const x = chiave(a), y = chiave(b);
      if(x === '' && y === '') return a - b; if(x === '') return 1; if(y === '') return -1;
      let d;
      if(typeof x === 'number' && typeof y === 'number') d = x - y;
      else if(typeof x === 'number') d = -1; else if(typeof y === 'number') d = 1;
      else d = String(x).localeCompare(String(y), 'it', {sensitivity:'base', numeric:true});
      return (cresc ? d : -d) || (a - b);
    });
    const celle = {...cur.celle}, fmt = {...cur.fmt};
    for(let r = r0; r <= r1; r++) for(let c = c0; c <= c1; c++){ delete celle[fgRef(r,c)]; delete fmt[fgRef(r,c)]; }
    righe.forEach((da, i)=>{ const a = r0 + i; for(let c = c0; c <= c1; c++){
      const v = cur.celle[fgRef(da,c)], fm = cur.fmt[fgRef(da,c)];
      if(v !== undefined) celle[fgRef(a,c)] = fgSposta(v, a - da, 0);
      if(fm) fmt[fgRef(a,c)] = fm;
    } });
    cambia({...cur, celle, fmt});
  };
  const struttura = (asse, piu) => {
    const q = zonaOra(), cur = fRef.current;
    if(piu){
      if(asse === 'c' && cur.nc >= FG_MAXC){ alert('Il foglio ha già il massimo delle colonne.'); return; }
      cambia(fgRistruttura(cur, asse, asse === 'r' ? q.r1 + 1 : q.c1 + 1, 1));
    } else {
      const quante = asse === 'r' ? q.r1 - q.r0 + 1 : q.c1 - q.c0 + 1;
      if(quante >= (asse === 'r' ? cur.nr : cur.nc)){ alert('Almeno una ' + (asse === 'r' ? 'riga' : 'colonna') + ' deve restare.'); return; }
      const piene = refsZonaIntera(asse, q).some(ref=>cur.celle[ref] !== undefined);
      if(piene && !confirm('Eliminare ' + (quante === 1 ? (asse === 'r' ? 'la riga' : 'la colonna') : quante + (asse === 'r' ? ' righe' : ' colonne')) + ' con quello che c\'è dentro?')) return;
      cambia(fgRistruttura(cur, asse, asse === 'r' ? q.r0 : q.c0, -quante));
      vai(Math.min(q.r0, cur.nr - 1), Math.min(q.c0, cur.nc - 1));
    }
  };
  const refsZonaIntera = (asse, q) => { const cur = fRef.current, out = [];
    if(asse === 'r'){ for(let r = q.r0; r <= q.r1; r++) for(let c = 0; c < cur.nc; c++) out.push(fgRef(r,c)); }
    else { for(let c = q.c0; c <= q.c1; c++) for(let r = 0; r < cur.nr; r++) out.push(fgRef(r,c)); }
    return out; };

  const csv = () => {
    const cur = fRef.current; let maxR = -1, maxC = -1;
    Object.keys(cur.celle).forEach(k=>{ const p = fgPos(k); if(p){ maxR = Math.max(maxR, p.r); maxC = Math.max(maxC, p.c); } });
    if(maxR < 0){ alert('Il foglio è vuoto.'); return; }
    const righe = [];
    for(let r = 0; r <= maxR; r++){ const riga = [];
      for(let c = 0; c <= maxC; c++){ const v = val(fgRef(r,c)); const t = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
        riga.push(/[;"\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t); }
      righe.push(riga.join(';')); }
    const blob = new Blob(['﻿', righe.join('\r\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'foglio.csv';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };

  /* copia e incolla: tra celle del foglio le formule si adattano; da e verso Excel passano i valori */
  const copia = (e, taglia) => {
    if(editRef.current) return;
    const q = zonaOra(), cur = fRef.current, righe = [], grezzi = [], fmts = [];
    for(let r = q.r0; r <= q.r1; r++){ const a = [], g = [], fm = [];
      for(let c = q.c0; c <= q.c1; c++){ const ref = fgRef(r,c), v = val(ref);
        a.push(typeof v === 'number' ? String(v).replace('.', ',') : String(v).replace(/[\t\n]/g,' ')); g.push(cur.celle[ref] || ''); fm.push(cur.fmt[ref] || null); }
      righe.push(a.join('\t')); grezzi.push(g); fmts.push(fm); }
    const testo = righe.join('\n');
    e.clipboardData.setData('text/plain', testo); e.preventDefault();
    appunti.current = {testo, grezzi, fmts, r0:q.r0, c0:q.c0};
    if(taglia && !ro) svuota();
  };
  const incolla = (e) => {
    if(editRef.current || ro) return;
    const testo = (e.clipboardData.getData('text/plain') || '').replace(/\r/g,'').replace(/\n$/,'');
    if(testo === '') return;
    e.preventDefault();
    const q = zonaOra(), cur = fRef.current, ap = appunti.current;
    const interno = !!(ap && ap.testo === testo);
    const m = interno ? ap.grezzi : testo.split('\n').map(x=>x.split('\t'));
    const celle = {...cur.celle}, fmt = {...cur.fmt}; let nr = cur.nr, nc = cur.nc;
    const metti = (r, c, i, j) => {
      if(c >= FG_MAXC) return;
      const ref = fgRef(r,c); let t = String(m[i][j] == null ? '' : m[i][j]);
      if(interno){ t = fgSposta(t, r - (ap.r0 + i), c - (ap.c0 + j)); if(ap.fmts[i][j]) fmt[ref] = ap.fmts[i][j]; else delete fmt[ref]; }
      if(t.trim() === '') delete celle[ref]; else { celle[ref] = t; if(!interno) formatoDa(t, fmt, ref); }
      nr = Math.max(nr, r+1); nc = Math.max(nc, c+1);
    };
    const unaSola = m.length === 1 && m[0].length === 1;
    let r1 = q.r0 + m.length - 1, c1 = q.c0 + Math.max(...m.map(x=>x.length)) - 1;
    if(unaSola && (q.r1 > q.r0 || q.c1 > q.c0)){                     // una cella copiata su più celle scelte: le riempie tutte
      for(let r = q.r0; r <= q.r1; r++) for(let c = q.c0; c <= q.c1; c++) metti(r, c, 0, 0);
      r1 = q.r1; c1 = q.c1;
    } else m.forEach((riga, i)=>riga.forEach((x, j)=>metti(q.r0 + i, q.c0 + j, i, j)));
    cambia({...cur, celle, fmt, nr, nc});
    setSel({r:q.r0, c:q.c0, r2:r1, c2:Math.min(c1, FG_MAXC-1)});
  };

  const tasti = (e) => {
    if(editRef.current) return;
    const s = selRef.current, k = e.key, mod = e.ctrlKey || e.metaKey;
    if(mod){
      const kk = (k || '').toLowerCase();
      if(kk === 'z'){ e.preventDefault(); e.shiftKey ? ripeti() : annulla(); }
      else if(kk === 'y'){ e.preventDefault(); ripeti(); }
      else if(kk === 'b'){ e.preventDefault(); alterna('b'); }
      else if(kk === 'i'){ e.preventDefault(); alterna('i'); }
      else if(kk === 'd'){ e.preventDefault(); riempi('giu'); }
      else if(kk === 'a'){ e.preventDefault(); setSel({r:0, c:0, r2:fRef.current.nr-1, c2:fRef.current.nc-1}); }
      return;
    }
    if(k === 'ArrowDown'){ e.preventDefault(); e.shiftKey ? vai(s.r2+1, s.c2, true) : vai(s.r+1, s.c); }
    else if(k === 'ArrowUp'){ e.preventDefault(); e.shiftKey ? vai(s.r2-1, s.c2, true) : vai(s.r-1, s.c); }
    else if(k === 'ArrowRight'){ e.preventDefault(); e.shiftKey ? vai(s.r2, s.c2+1, true) : vai(s.r, s.c+1); }
    else if(k === 'ArrowLeft'){ e.preventDefault(); e.shiftKey ? vai(s.r2, s.c2-1, true) : vai(s.r, s.c-1); }
    else if(k === 'Enter'){ e.preventDefault(); vai(s.r + (e.shiftKey ? -1 : 1), s.c); }
    else if(k === 'Tab'){ e.preventDefault(); vai(s.r, s.c + (e.shiftKey ? -1 : 1)); }
    else if(k === 'F2'){ e.preventDefault(); apri(s.r, s.c); }
    else if(k === 'Delete' || k === 'Backspace'){ e.preventDefault(); svuota(); }
    else if(k && k.length === 1 && !e.altKey && !ro){ e.preventDefault(); apri(s.r, s.c, k); }
  };
  const tastiEdit = (e) => {
    e.stopPropagation();
    if(e.key === 'Enter'){ e.preventDefault(); conferma(e.shiftKey ? -1 : 1, 0); }
    else if(e.key === 'Tab'){ e.preventDefault(); conferma(0, e.shiftKey ? -1 : 1); }
    else if(e.key === 'Escape'){ e.preventDefault(); lasciaEdit(); }
  };
  const cambiaTesto = (t) => setEdit({...editRef.current, testo: t});

  /* clic sulle celle: sceglie; mentre scrivo una formula, il clic inserisce il riferimento (trascinando, la zona) */
  const giuCella = (e, r, c) => {
    if(e.button !== undefined && e.button !== 0) return;
    const ed = editRef.current;
    if(ed){
      if(ed.r === r && ed.c === c) return;
      if(/^=/.test(ed.testo) && /[=+\-*\/(;:<>,]\s*$/.test(ed.testo)){
        e.preventDefault();
        trascina.current = {tipo:'rif', base: ed.testo, r, c};
        cambiaTesto(ed.testo + fgRef(r,c));
        return;
      }
      conferma(0, 0, true);
    }
    e.preventDefault();
    fuocoGriglia();
    if(e.shiftKey) setSel({...selRef.current, r2:r, c2:c}); else setSel({r, c, r2:r, c2:c});
    trascina.current = {tipo:'sel'};
  };
  const sopraCella = (e, r, c) => {
    const t = trascina.current;
    if(!t || e.buttons !== 1) return;
    if(t.tipo === 'sel'){ const s = selRef.current; if(s.r2 !== r || s.c2 !== c) setSel({...s, r2:r, c2:c}); }
    else if(t.tipo === 'rif' && editRef.current){
      const a = fgRef(Math.min(t.r, r), Math.min(t.c, c)), b = fgRef(Math.max(t.r, r), Math.max(t.c, c));
      cambiaTesto(t.base + (a === b ? a : a + ':' + b));
    }
  };
  useEffect(()=>{
    const su = () => { trascina.current = null; };
    document.addEventListener('mouseup', su);
    return ()=>document.removeEventListener('mouseup', su);
  }, []);

  /* larghezza delle colonne: si trascina il bordo dell'intestazione */
  const tiraCol = useRef(null);
  const giuManiglia = (e, c) => {
    if(ro) return;
    e.preventDefault(); e.stopPropagation();
    try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
    tiraCol.current = {c, x0: e.clientX, w0: larghezza(c), prima: fRef.current};
  };
  const muoviManiglia = (e) => {
    const t = tiraCol.current; if(!t) return;
    const w = Math.max(44, Math.min(600, Math.round(t.w0 + e.clientX - t.x0)));
    const n = {...fRef.current, larg: {...fRef.current.larg, [fgLettera(t.c)]: w}};
    fRef.current = n; setF(n);
  };
  const suManiglia = () => {
    const t = tiraCol.current; if(!t) return;
    tiraCol.current = null;
    const fatto = fRef.current; fRef.current = t.prima; cambia(fatto);
  };

  /* riga di stato: somma, media e conteggio delle celle scelte */
  let stat = null;
  if(z.r0 !== z.r1 || z.c0 !== z.c1){
    const nums = []; let piene = 0;
    for(let r = z.r0; r <= z.r1 && nums.length < 5000; r++) for(let c = z.c0; c <= z.c1; c++){ const v = val(fgRef(r,c)); if(v !== '') piene++; if(typeof v === 'number') nums.push(v); }
    if(nums.length){ const s = nums.reduce((a,b)=>a+b, 0); stat = {somma: s, media: s/nums.length, n: nums.length, piene}; } else if(piene) stat = {piene};
  }
  const mostraNum = (v) => scriviNumero(v, fgDecimali(v, 2), 'punto', false);
  const rifAttiva = fgRef(sel.r, sel.c);
  const grezza = f.celle[rifAttiva] || '';
  const colonne = []; for(let c = 0; c < f.nc; c++) colonne.push(c);
  const righe = []; for(let r = 0; r < f.nr; r++) righe.push(r);
  const largTot = 42 + colonne.reduce((s, c)=>s + larghezza(c), 0);
  const st = storia.current;

  return (
    <div className="fg-box">
      {!ro && (
        <div className="fg-tools" onMouseDown={e=>{ if(e.target.closest('button')) e.preventDefault(); }}>
          <button disabled={!st.passi.length} onClick={annulla} title="Annulla (Ctrl/Cmd+Z)">↶</button>
          <button disabled={!st.avanti.length} onClick={ripeti} title="Ripeti">↷</button>
          <span className="sep"></span>
          <button className={fmtAttiva.b ? 'on' : ''} onClick={()=>alterna('b')} title="Grassetto"><b>B</b></button>
          <button className={fmtAttiva.i ? 'on' : ''} onClick={()=>alterna('i')} title="Corsivo"><i>I</i></button>
          <button className={fmtAttiva.al === 'l' ? 'on' : ''} onClick={()=>conFormato(o=>({...o, al: o.al === 'l' ? '' : 'l'}))} title="A sinistra">⇤</button>
          <button className={fmtAttiva.al === 'c' ? 'on' : ''} onClick={()=>conFormato(o=>({...o, al: o.al === 'c' ? '' : 'c'}))} title="Al centro">↔</button>
          <button className={fmtAttiva.al === 'r' ? 'on' : ''} onClick={()=>conFormato(o=>({...o, al: o.al === 'r' ? '' : 'r'}))} title="A destra">⇥</button>
          <span className="sep"></span>
          {FG_SFONDI.map(col=><button key={col} className="col" style={{background:col}} title="Colore della cella" onClick={()=>conFormato(o=>({...o, bg:col}))}></button>)}
          <button onClick={()=>conFormato(o=>({...o, bg:''}))} title="Togli il colore">⊘</button>
          <span className="sep"></span>
          <button className={!fmtAttiva.nf ? 'on' : ''} onClick={()=>numFmt('')} title="Numero così com'è">123</button>
          <button className={fmtAttiva.nf === 'num' ? 'on' : ''} onClick={()=>numFmt('num')} title="Con il punto delle migliaia">1.000</button>
          <button className={fmtAttiva.nf === 'eur' ? 'on' : ''} onClick={()=>numFmt('eur')} title="Euro">€</button>
          <button className={fmtAttiva.nf === 'perc' ? 'on' : ''} onClick={()=>numFmt('perc')} title="Percentuale (0,15 → 15%)">%</button>
          <button onClick={()=>decimali(1)} title="Un decimale in più">,0+</button>
          <button onClick={()=>decimali(-1)} title="Un decimale in meno">,0−</button>
          <span className="sep"></span>
          <button onClick={sommaAuto} title="Somma automatica: totale dei numeri sopra, o delle celle scelte"><b>Σ</b></button>
          <button onClick={()=>riempi('giu')} title="Riempi in basso: copia la prima riga scelta in quelle sotto (Ctrl/Cmd+D)">⤓</button>
          <button onClick={()=>riempi('destra')} title="Riempi a destra: copia la prima colonna scelta in quelle a destra">⤏</button>
          <button onClick={()=>ordina(true)} title="Ordina dalla A alla Z / dal più piccolo, secondo la colonna della cella attiva">A→Z</button>
          <button onClick={()=>ordina(false)} title="Ordina dalla Z alla A / dal più grande">Z→A</button>
          <span className="sep"></span>
          <button onClick={()=>struttura('r', true)} title="Inserisci una riga sotto">+ riga</button>
          <button onClick={()=>struttura('r', false)} title="Elimina le righe scelte">− riga</button>
          <button onClick={()=>struttura('c', true)} title="Inserisci una colonna a destra">+ col</button>
          <button onClick={()=>struttura('c', false)} title="Elimina le colonne scelte">− col</button>
          <span className="sep"></span>
          <button onClick={csv} title="Scarica il foglio in CSV, da aprire con Excel">CSV</button>
        </div>
      )}
      <div className="fg-barra">
        <span className="fg-rif">{rifAttiva}</span>
        <span className="fg-fx">fx</span>
        <input ref={barraRef} value={edit ? edit.testo : grezza} readOnly={ro} placeholder={ro ? '' : 'Scrivi un numero, un testo o una formula, es. =SOMMA(C3:C7)'}
          onFocus={()=>{ if(!editRef.current && !ro) setEdit({r:sel.r, c:sel.c, testo:grezza, barra:true, k:Date.now()}); }}
          onChange={e=>{ if(editRef.current) cambiaTesto(e.target.value); }}
          onKeyDown={e=>{ if(editRef.current) tastiEdit(e); }}
          onBlur={()=>{ if(trascina.current && trascina.current.tipo === 'rif') return; if(editRef.current && editRef.current.barra) conferma(0, 0, true); }}/>
      </div>
      <div className="fg-wrap" ref={wrapRef} tabIndex={0} onKeyDown={tasti}
        onCopy={e=>copia(e, false)} onCut={e=>copia(e, true)} onPaste={incolla}>
        <table className="fg" style={{width: largTot}}>
          <colgroup><col style={{width:42}}/>{colonne.map(c=><col key={c} style={{width: larghezza(c)}}/>)}</colgroup>
          <thead><tr>
            <th className="ang" onMouseDown={e=>{ e.preventDefault(); fuocoGriglia(); setSel({r:0, c:0, r2:f.nr-1, c2:f.nc-1}); }}></th>
            {colonne.map(c=>(
              <th key={c} className={c >= z.c0 && c <= z.c1 ? 'su' : ''}
                onMouseDown={e=>{ if(editRef.current) conferma(0, 0, true); e.preventDefault(); fuocoGriglia(); setSel(e.shiftKey ? {...selRef.current, r2:f.nr-1, c2:c} : {r:0, c, r2:f.nr-1, c2:c}); }}>
                {fgLettera(c)}
                <span className="fg-man" onPointerDown={e=>giuManiglia(e, c)} onPointerMove={muoviManiglia} onPointerUp={suManiglia} onPointerCancel={suManiglia}
                  onMouseDown={e=>e.stopPropagation()}></span>
              </th>
            ))}
          </tr></thead>
          <tbody>
            {righe.map(r=>(
              <tr key={r}>
                <th className={r >= z.r0 && r <= z.r1 ? 'su' : ''}
                  onMouseDown={e=>{ if(editRef.current) conferma(0, 0, true); e.preventDefault(); fuocoGriglia(); setSel(e.shiftKey ? {...selRef.current, r2:r, c2:f.nc-1} : {r, c:0, r2:r, c2:f.nc-1}); }}>{r+1}</th>
                {colonne.map(c=>{
                  const ref = fgRef(r,c), fm = f.fmt[ref];
                  const inEdit = edit && edit.r === r && edit.c === c;
                  if(inEdit && !edit.barra) return (
                    <td key={c} className="ed" data-p={r + '_' + c}>
                      <input ref={inRef} value={edit.testo} style={{width: Math.max(larghezza(c), edit.testo.length * 7.6 + 24)}}
                        onChange={e=>cambiaTesto(e.target.value)} onKeyDown={tastiEdit}
                        onBlur={()=>{ if(trascina.current && trascina.current.tipo === 'rif') return; conferma(0, 0, true); }}/>
                    </td>
                  );
                  const v = inEdit ? edit.testo : val(ref);
                  const num = typeof v === 'number';
                  const scelta = r >= z.r0 && r <= z.r1 && c >= z.c0 && c <= z.c1;
                  let stile;
                  if(fm){ stile = {};
                    if(fm.b) stile.fontWeight = 600; if(fm.i) stile.fontStyle = 'italic'; if(fm.bg) stile.backgroundColor = fm.bg;
                    if(fm.al) stile.textAlign = fm.al === 'c' ? 'center' : fm.al === 'r' ? 'right' : 'left'; }
                  const testo = inEdit ? v : fgMostra(v, fm);
                  return (
                    <td key={c} data-p={r + '_' + c} style={stile}
                      className={(num ? 'n' : '') + (scelta ? ' sel' : '') + (r === sel.r && c === sel.c ? ' att' : '') + (!num && typeof v === 'string' && v[0] === '#' ? ' err' : '')}
                      title={!num && testo.length > 14 ? testo : undefined}
                      onMouseDown={e=>giuCella(e, r, c)} onMouseEnter={e=>sopraCella(e, r, c)}
                      onDoubleClick={()=>apri(r, c)}>{testo}</td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="fg-stato">
        {stat && stat.n ? <><span>Somma <b>{mostraNum(stat.somma)}</b></span><span>Media <b>{mostraNum(stat.media)}</b></span><span>Numeri <b>{stat.n}</b></span></>
          : stat ? <span>Celle scritte <b>{stat.piene}</b></span> : <span>{/^=/.test(grezza) ? 'Formula: ' + grezza : ''}</span>}
        <span className="spacer"></span>
        {!ro && <button className="link-btn" onClick={()=>cambia({...fRef.current, nr: fRef.current.nr + 20}, true)}>+ 20 righe</button>}
      </div>
      {!ro && <div className="fg-aiuto">Doppio clic o F2 per modificare una cella; scrivi <b>=</b> per una formula e clicca le celle per inserirle.
        Funzioni: SOMMA, MEDIA, MIN, MAX, CONTA.NUMERI, CONTA.VALORI, SE, SOMMA.SE, CONTA.SE, ARROTONDA. Puoi incollare da Excel e copiare verso Excel.</div>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   UTENTI E RUOLI
   Ogni persona entra con la sua email. Il ruolo sta nel database (ramo "utenti"):
   amministratore, può modificare, sola lettura. Il primo che entra diventa amministratore;
   chi arriva dopo resta "in attesa" finché un amministratore non gli dà un ruolo.
   ═══════════════════════════════════════════════════════════════ */
const RUOLI = {admin:'Amministratore', editor:'Può modificare', lettore:'Sola lettura', attesa:'In attesa'};
const erroreAuth = (e) => {
  const c = (e && e.code) || '';
  if(c === 'auth/email-already-in-use') return 'Esiste già un account con questa email. Fallo entrare una volta: comparirà qui "in attesa" e potrai dargli un ruolo.';
  if(c === 'auth/weak-password') return 'La password deve avere almeno 6 caratteri.';
  if(c === 'auth/invalid-email') return 'L\'indirizzo email non è scritto bene.';
  if(c === 'auth/operation-not-allowed') return 'Nella console Firebase va attivato l\'accesso con email e password (Authentication → Metodo di accesso).';
  if(c === 'PERMISSION_DENIED' || /permission/i.test((e && e.message) || '')) return 'Il database ha rifiutato la modifica: controlla le regole di sicurezza.';
  return 'Non riuscito: ' + ((e && e.message) || 'errore sconosciuto');
};

    setBusy(true); setMsg(null);

      await fbDb.ref(ROOT + '/utenti/' + u.uid).set({uid:u.uid, email:u.email || n.email.trim(), nome:n.nome.trim() || (u.email || '').split('@')[0], ruolo:n.ruolo, creato:nowISO()});

  const reimposta = (email) => fbAuth.sendPasswordResetEmail(email)
    .then(()=>setMsg({ok:true, t:'Ho mandato a ' + email + ' l\'email per scegliere una nuova password.'}))

  const lista = utenti ? Object.values(utenti).filter(u=>u && u.uid).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')) : [];
  const attesa = lista.filter(u=>u.ruolo === 'attesa'), attivi = lista.filter(u=>u.ruolo !== 'attesa');

        <small>{u.email}{u.uid === io.uid ? ' · sei tu' : ''}</small>
      </div>
      <select value={u.ruolo} disabled={u.uid === io.uid} title={u.uid === io.uid ? 'Il tuo ruolo lo può cambiare un altro amministratore' : 'Ruolo'}
        onChange={e=>scrivi(u.uid, {ruolo:e.target.value})}>
        {u.ruolo === 'attesa' && <option value="attesa">In attesa — scegli un ruolo…</option>}
        <option value="admin">{RUOLI.admin}</option><option value="editor">{RUOLI.editor}</option><option value="lettore">{RUOLI.lettore}</option>
      </select>
      <button className="btn sm" onClick={()=>reimposta(u.email)} title="Manda l'email per scegliere una nuova password">Reimposta password</button>
      {u.uid !== io.uid && <button className="btn sm danger" onClick={()=>{
        if(confirm('Togliere l\'accesso a ' + (u.nome || u.email) + '? Non vedrà più niente. L\'account resta nella console Firebase: se rientra, tornerà "in attesa".'))
          fbDb.ref(ROOT + '/utenti/' + u.uid).remove().catch(e=>setMsg({ok:false, t:erroreAuth(e)}));
      }}>Togli</button>}
    </div>
  );
  return (
    <div className="actions-wrap">
      <h1 style={{fontFamily:'var(--serif)',fontSize:30,margin:'0 0 4px'}}>Utenti</h1>
      <p style={{color:'var(--muted)',marginTop:0}}>Chi può entrare e cosa può fare. Tutti lavorano sugli stessi documenti.</p>
      {msg && <div className="nota-box" style={{marginTop:0, marginBottom:14, background: msg.ok ? 'var(--accent-soft)' : '#f7e9e8', color: msg.ok ? '#165689' : '#7d2f28'}}>{msg.t}</div>}
      {utenti === null && <div className="empty">Carico…</div>}

          <div className="f"><label>Password provvisoria</label><input value={n.pw} onChange={e=>setN({...n, pw:e.target.value})} placeholder="almeno 6 caratteri" autoComplete="off"/></div>
          <div className="f"><label>Ruolo</label>

              <option value="editor">{RUOLI.editor}</option><option value="lettore">{RUOLI.lettore}</option><option value="admin">{RUOLI.admin}</option>
            </select></div>

        I permessi sono fatti rispettare dalle regole del database, non solo da questa pagina. Se due persone modificano lo stesso
        documento nello stesso momento, resta l'ultima modifica salvata: per i lavori a più mani conviene dividersi i documenti.

  );
}

function Login(){
  const [email,setEmail]=useState(window.AUTH_EMAIL||''); const [pw,setPw]=useState(''); const [err,setErr]=useState(''); const [ok,setOk]=useState(''); const [busy,setBusy]=useState(false);
  const entra = () => {
    setBusy(true); setErr(''); setOk('');
    fbAuth.signInWithEmailAndPassword(email.trim(), pw)
      .catch(e=>{ setErr('Accesso non riuscito. Controlla email e password.'); setBusy(false); });
  };
  const dimenticata = () => {
    setErr(''); setOk('');
    if(!email.trim()){ setErr('Scrivi prima la tua email qui sopra.'); return; }
    fbAuth.sendPasswordResetEmail(email.trim())
      .then(()=>setOk('Ti ho mandato un\'email per scegliere una nuova password.'))
      .catch(()=>setErr('Non sono riuscito a mandare l\'email: controlla l\'indirizzo.'));
  };
  return (
    <div className="login">
      <h1>{APP_NOME}</h1>
      <p>Piani, riunioni e appunti della pro loco</p>
      <div className="f" style={{marginBottom:10}}>
        <label>Email</label>
        <input value={email} onChange={e=>setEmail(e.target.value)} autoComplete="username"/>
      </div>
      <div className="f" style={{marginBottom:16}}>
        <label>Password</label>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} autoComplete="current-password"
          onKeyDown={e=>{if(e.key==='Enter') entra();}}/>
      </div>
      <button className="btn primary" style={{width:'100%'}} disabled={busy} onClick={entra}>
        {busy?'Accesso in corso…':'Entra'}
      </button>
      <div style={{marginTop:12,textAlign:'center'}}><button className="link-btn" onClick={dimenticata}>Password dimenticata?</button></div>
      {err && <div className="err">{err}</div>}
      {ok && <div className="err" style={{color:'var(--accent)'}}>{ok}</div>}
    </div>
  );
}
